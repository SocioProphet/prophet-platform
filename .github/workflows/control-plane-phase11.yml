name: control-plane-phase11

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/evidence_collector.py'
      - 'tools/tests/test_evidence_collector.py'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE11.md'
      - '.github/workflows/control-plane-phase11.yml'
  pull_request:
    paths:
      - 'tools/evidence_collector.py'
      - 'tools/tests/test_evidence_collector.py'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE11.md'
      - '.github/workflows/control-plane-phase11.yml'

jobs:
  control-plane-phase11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
      - name: Evidence collector pipeline tests
        run: pytest -q tools/tests/test_evidence_collector.py
