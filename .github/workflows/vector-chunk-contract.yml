name: vector-chunk-contract

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'contracts/memory/vector-chunk.v0.json'
      - 'contracts/memory/vector-chunk.v0.valid.example.json'
      - 'contracts/memory/vector-chunk.v0.invalid-missing-scope.example.json'
      - 'contracts/memory/vector-chunk.v0.invalid-no-object-id.example.json'
      - 'tools/validate_vector_chunk_contract.py'
      - 'tools/tests/test_vector_chunk_contract.py'
      - '.github/workflows/vector-chunk-contract.yml'
  pull_request:
    paths:
      - 'contracts/memory/vector-chunk.v0.json'
      - 'contracts/memory/vector-chunk.v0.valid.example.json'
      - 'contracts/memory/vector-chunk.v0.invalid-missing-scope.example.json'
      - 'contracts/memory/vector-chunk.v0.invalid-no-object-id.example.json'
      - 'tools/validate_vector_chunk_contract.py'
      - 'tools/tests/test_vector_chunk_contract.py'
      - '.github/workflows/vector-chunk-contract.yml'

jobs:
  vector-chunk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema
      - name: Validate VectorChunk contract
        run: python tools/validate_vector_chunk_contract.py
      - name: VectorChunk contract tests
        run: pytest -q tools/tests/test_vector_chunk_contract.py
