name: prometheus-jsonld

on:
  pull_request:
    paths:
      - "contracts/ontology/sr-assertion.shacl.ttl"
      - "tools/emit_prometheus_jsonld_review.py"
      - "tools/emit_prometheus_gate_evaluation.py"
      - "tools/validate_prometheus_jsonld_review.py"
      - "tools/validate_prometheus_jsonld_shacl.py"
      - "tools/run_prometheus_local_demo.py"
      - "tests/fixtures/prometheus/agentplane-sr-gate-policy.valid.json"
      - "tests/fixtures/prometheus/jsonld-invalid-missing-dataset.jsonld"
      - "tests/fixtures/prometheus/jsonld-invalid-inconsistent-units-promotion.jsonld"
      - "docs/PROMETHEUS_JSONLD_REVIEW.md"
      - ".github/workflows/prometheus-jsonld.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/ontology/sr-assertion.shacl.ttl"
      - "tools/emit_prometheus_jsonld_review.py"
      - "tools/emit_prometheus_gate_evaluation.py"
      - "tools/validate_prometheus_jsonld_review.py"
      - "tools/validate_prometheus_jsonld_shacl.py"
      - "tools/run_prometheus_local_demo.py"
      - "tests/fixtures/prometheus/agentplane-sr-gate-policy.valid.json"
      - "tests/fixtures/prometheus/jsonld-invalid-missing-dataset.jsonld"
      - "tests/fixtures/prometheus/jsonld-invalid-inconsistent-units-promotion.jsonld"
      - "docs/PROMETHEUS_JSONLD_REVIEW.md"
      - ".github/workflows/prometheus-jsonld.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-prometheus-jsonld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python3 -m pip install sympy pyshacl rdflib
      - name: Generate PROMETHEUS local demo artifacts
        run: |
          python3 tools/run_prometheus_local_demo.py \
            --output-dir build/prometheus/jsonld \
            --issued-at 2026-05-27T22:30:00Z
      - name: Emit gate evaluation artifact with AgentPlane policy fixture
        run: |
          python3 tools/emit_prometheus_gate_evaluation.py \
            --candidate build/prometheus/jsonld/pysr/equation-candidate.json \
            --run-artifact build/prometheus/jsonld/pysr/sr-run-artifact.json \
            --dataset tests/fixtures/prometheus/pysr-mvp-linear.csv \
            --gate-policy tests/fixtures/prometheus/agentplane-sr-gate-policy.valid.json \
            --evaluation-id urn:prometheus:gate-evaluation:pysr-local-demo:001 \
            --issued-at 2026-05-27T22:30:30Z \
            --output build/prometheus/jsonld/pysr/gate-evaluation.json
      - name: Require gate evidence for automated review
        run: |
          ! python3 tools/emit_prometheus_jsonld_review.py \
            --candidate build/prometheus/jsonld/pysr/equation-candidate.json \
            --run-artifact build/prometheus/jsonld/pysr/sr-run-artifact.json \
            --review-id urn:prometheus:jsonld:pysr-local-demo:no-gate \
            --review-surface automated_shacl_gate \
            --issued-at 2026-05-27T22:30:45Z \
            --output build/prometheus/jsonld/pysr/should-not-exist.jsonld
      - name: Emit JSON-LD artifact
        run: |
          python3 tools/emit_prometheus_jsonld_review.py \
            --candidate build/prometheus/jsonld/pysr/equation-candidate.json \
            --run-artifact build/prometheus/jsonld/pysr/sr-run-artifact.json \
            --gate-evaluation build/prometheus/jsonld/pysr/gate-evaluation.json \
            --review-id urn:prometheus:jsonld:pysr-local-demo:001 \
            --review-surface automated_shacl_gate \
            --issued-at 2026-05-27T22:31:00Z \
            --output build/prometheus/jsonld/pysr/sr.jsonld
      - name: Validate JSON-LD artifact structure
        run: |
          python3 tools/validate_prometheus_jsonld_review.py \
            build/prometheus/jsonld/pysr/sr.jsonld
      - name: Validate JSON-LD artifact with SHACL
        run: |
          python3 tools/validate_prometheus_jsonld_shacl.py \
            build/prometheus/jsonld/pysr/sr.jsonld
      - name: Require invalid missing-dataset fixture to fail SHACL
        run: |
          ! python3 tools/validate_prometheus_jsonld_shacl.py \
            tests/fixtures/prometheus/jsonld-invalid-missing-dataset.jsonld
      - name: Require invalid inconsistent-units fixture to fail SHACL
        run: |
          ! python3 tools/validate_prometheus_jsonld_shacl.py \
            tests/fixtures/prometheus/jsonld-invalid-inconsistent-units-promotion.jsonld
