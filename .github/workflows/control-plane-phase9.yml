name: control-plane-phase9

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/otel_tracer.py'
      - 'tools/tests/test_otel_tracer.py'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE9.md'
      - '.github/workflows/control-plane-phase9.yml'
  pull_request:
    paths:
      - 'tools/otel_tracer.py'
      - 'tools/tests/test_otel_tracer.py'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE9.md'
      - '.github/workflows/control-plane-phase9.yml'

jobs:
  control-plane-phase9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
      - name: OTel observability scaffold tests
        run: pytest -q tools/tests/test_otel_tracer.py
