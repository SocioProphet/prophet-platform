name: OSM Map API

on:
  push:
    paths:
      - 'apps/osm-map-api/**'
      - '.github/workflows/osm-map-api.yml'
  pull_request:
    paths:
      - 'apps/osm-map-api/**'
      - '.github/workflows/osm-map-api.yml'

jobs:
  test-osm-map-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/osm-map-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -e '.[test]'

      - name: Run tests
        run: pytest -q

      - name: Compile package
        run: python3 -m compileall osm_map_api
