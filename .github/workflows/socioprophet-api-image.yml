name: socioprophet-api-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'libs/go/tritrpcbridge/**'
      - '.github/workflows/socioprophet-api-image.yml'
      - 'releases/images/component-inventory.v1.yaml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'libs/go/tritrpcbridge/**'
      - '.github/workflows/socioprophet-api-image.yml'
      - 'releases/images/component-inventory.v1.yaml'

permissions:
  contents: read
  packages: write

# COST GUARD 2 (queue vs cancel) — one concurrency group per ref.
#   * main (release-relevant builds): cancel-in-progress is FALSE, so pushes QUEUE and every
#     built image reaches the registry (a cancelled push leaves a dangling pin).
#   * feature branches / PRs: cancel-in-progress is TRUE, so a superseded build is cancelled
#     — no runner minutes spent finishing an image nobody will deploy (INV-DEP-5).
concurrency:
  group: socioprophet-api-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # COST GUARD 1 (change-detection skip) — compute the source content-digest and compare it to
  # the last-built value recorded in the image-lock. Byte-identical source => SKIP the build and
  # reuse the already-pinned immutable digest (INV-DEP-5). Real source change => build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: decide
        name: Decide build-vs-skip from source content-digest (+ image-exists, INV-DEP-6)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set +e
          python3 tools/compute_source_content_digest.py decide \
            --path apps/api \
            --path libs/go/tritrpcbridge \
            --path .github/workflows/socioprophet-api-image.yml \
            --lock releases/images/socioprophet-api.image-lock.json \
            --verify-image-exists \
            --allow-missing
          rc=$?
          # exit 0 = SKIP, 10 = BUILD; anything else is a real (fail-closed) error.
          if [ "$rc" != "0" ] && [ "$rc" != "10" ]; then exit "$rc"; fi

  image:
    needs: changes
    # Build when the content changed (push/dispatch) OR always on a PR (validation build).
    if: needs.changes.outputs.build_needed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: ghcr.io/socioprophet/prophet-platform/socioprophet-api:pr-${{ github.event.pull_request.number }}
          # Layer cache — reuse layers across runs so an unchanged build stage is not re-run.
          cache-from: type=gha,scope=socioprophet-api
          cache-to: type=gha,mode=max,scope=socioprophet-api

      - name: Build and push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/socioprophet/prophet-platform/socioprophet-api:main
            ghcr.io/socioprophet/prophet-platform/socioprophet-api:${{ github.sha }}
          cache-from: type=gha,scope=socioprophet-api
          cache-to: type=gha,mode=max,scope=socioprophet-api

      - name: Compute source content-digest (record for next run's skip decision)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: content
        run: |
          cd="$(python3 tools/compute_source_content_digest.py digest \
            --path apps/api \
            --path libs/go/tritrpcbridge \
            --path .github/workflows/socioprophet-api-image.yml)"
          echo "content_digest=$cd" >> "$GITHUB_OUTPUT"

      - name: Emit digest evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p image-evidence
          cat > image-evidence/socioprophet-api-image.json <<EOF
          {
            "component_id": "socioprophet_api",
            "image": "ghcr.io/socioprophet/prophet-platform/socioprophet-api",
            "source_sha": "${{ github.sha }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "pinned_ref": "ghcr.io/socioprophet/prophet-platform/socioprophet-api@${{ steps.build.outputs.digest }}",
            "source_content_digest": "${{ steps.content.outputs.content_digest }}",
            "runtime_base": "scratch",
            "host_substrate_target": "fcos_silverblue_ostree_fedora_family"
          }
          EOF

      - name: Upload digest evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: socioprophet-api-image-evidence
          path: image-evidence/socioprophet-api-image.json
