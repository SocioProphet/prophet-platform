name: FogStack Live Apply Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemas/runtime/fogstack-live-apply-plan-record-v0.1.schema.json"
      - "tools/emit_fogstack_live_apply_plan_record.py"
      - "tools/tests/test_fogstack_live_apply_plan_record.py"
      - ".github/workflows/fogstack-live-apply-plan.yml"
  push:
    branches: [main]
    paths:
      - "schemas/runtime/fogstack-live-apply-plan-record-v0.1.schema.json"
      - "tools/emit_fogstack_live_apply_plan_record.py"
      - "tools/tests/test_fogstack_live_apply_plan_record.py"
      - ".github/workflows/fogstack-live-apply-plan.yml"

permissions:
  contents: read

jobs:
  live-apply-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run plan-record tests
        run: |
          python -m pytest -q tools/tests/test_fogstack_live_apply_plan_record.py
