name: infra-drift-detect

on:
  schedule:
    # Runs at 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for all OIDC cloud auth
  issues: write    # open drift issue when plan is non-empty

# All cloud credentials are obtained via OIDC federation — no static secrets.
# After first applying each env, set these as GitHub Actions *variables*
# (Settings → Secrets and variables → Variables), not secrets:
#   GCP_WIF_PROVIDER       — tofu output github_ci_wif_provider  (infra/tofu/envs/shared)
#   GCP_TOFU_SA            — tofu output github_ci_sa_email       (infra/tofu/envs/shared)
#   AWS_TOFU_ROLE_ARN      — tofu output github_ci_role_arn       (infra/tofu/environments/aws-eks)
#   AZURE_CLIENT_ID        — tofu output github_ci_client_id      (infra/tofu/environments/azure-aks)
#   AZURE_TENANT_ID        — your Azure tenant GUID
#   AZURE_SUBSCRIPTION_ID  — your Azure subscription GUID
#   IBM_TRUSTED_PROFILE_ID — tofu output github_ci_trusted_profile_id (infra/tofu/environments/ibm-iks)

jobs:
  gcp-landing:
    name: plan / gcp-landing
    runs-on: ubuntu-latest
    environment: gcp-prod
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TOFU_SA }}
      - name: plan
        id: plan
        working-directory: infra/tofu/envs/gcp-landing
        run: |
          tofu init -reconfigure
          # -detailed-exitcode returns 2 on drift; capture it before set -e/pipefail aborts the step.
          set +e
          tofu plan -detailed-exitcode -out=plan.tfplan 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${ec}" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: open drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/envs/gcp-landing/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] gcp-landing diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });

  aws-eks:
    name: plan / aws-eks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TOFU_ROLE_ARN }}
          aws-region: us-east-1
      - name: plan
        id: plan
        working-directory: infra/tofu/environments/aws-eks
        run: |
          tofu init -reconfigure
          # -detailed-exitcode returns 2 on drift; capture it before set -e/pipefail aborts the step.
          set +e
          tofu plan -detailed-exitcode -out=plan.tfplan 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${ec}" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: open drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/environments/aws-eks/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] aws-eks diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });

  azure-aks:
    name: plan / azure-aks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: plan
        id: plan
        working-directory: infra/tofu/environments/azure-aks
        run: |
          tofu init -reconfigure
          # -detailed-exitcode returns 2 on drift; capture it before set -e/pipefail aborts the step.
          set +e
          tofu plan -detailed-exitcode -out=plan.tfplan 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${ec}" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: open drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/environments/azure-aks/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] azure-aks diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });

  ibm-iks:
    name: plan / ibm-iks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - name: Authenticate via IBM Trusted Profile (OIDC)
        run: |
          # Exchange the GitHub OIDC token for an IBM IAM access token.
          OIDC_TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iam.cloud.ibm.com" | jq -r .value)
          IBM_TOKEN=$(curl -s -X POST "https://iam.cloud.ibm.com/identity/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ibm:params:oauth:grant-type:cr-token&cr_token=${OIDC_TOKEN}&profile_id=${{ vars.IBM_TRUSTED_PROFILE_ID }}" \
            | jq -r .access_token)
          echo "::add-mask::$IBM_TOKEN"
          echo "IC_IAM_TOKEN=$IBM_TOKEN" >> "$GITHUB_ENV"
      - name: plan
        id: plan
        working-directory: infra/tofu/environments/ibm-iks
        env:
          IC_IAM_TOKEN: ${{ env.IC_IAM_TOKEN }}
        run: |
          tofu init -reconfigure
          # -detailed-exitcode returns 2 on drift; capture it before set -e/pipefail aborts the step.
          set +e
          tofu plan -detailed-exitcode -out=plan.tfplan 2>&1 | tee plan.txt
          ec=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${ec}" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: open drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/environments/ibm-iks/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] ibm-iks diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });
