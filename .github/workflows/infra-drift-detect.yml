name: infra-drift-detect

on:
  schedule:
    # Runs at 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    # So a change to the drift machinery itself is exercised before it merges.
    # Only the self-test runs on a PR; the cloud lanes are gated on the event.
    paths:
      - ".github/workflows/infra-drift-detect.yml"
      - "scripts/ci/tofu-drift-plan.sh"
      - "scripts/ci/install-opentofu.sh"
      - "scripts/ci/test-tofu-drift-plan.sh"

permissions:
  contents: read
  id-token: write  # required for all OIDC cloud auth
  issues: write    # open drift issue when plan is non-empty

# All cloud credentials are obtained via OIDC federation — no static secrets.
# After first applying each env, set these as GitHub Actions *variables*
# (Settings → Secrets and variables → Variables), not secrets:
#   GCP_WIF_PROVIDER       — tofu output github_ci_wif_provider  (infra/tofu/envs/shared)
#   GCP_TOFU_SA            — tofu output github_ci_sa_email       (infra/tofu/envs/shared)
#   AWS_TOFU_ROLE_ARN      — tofu output github_ci_role_arn       (infra/tofu/environments/aws-eks)
#   AZURE_CLIENT_ID        — tofu output github_ci_client_id      (infra/tofu/environments/azure-aks)
#   AZURE_TENANT_ID        — your Azure tenant GUID
#   AZURE_SUBSCRIPTION_ID  — your Azure subscription GUID
#   IBM_TRUSTED_PROFILE_ID — tofu output github_ci_trusted_profile_id (infra/tofu/environments/ibm-iks)
#
# Every lane runs scripts/ci/tofu-drift-plan.sh, which maps OpenTofu's exit codes
# onto three distinct outcomes: 0 = clean, 2 = drift (issue opened, job green),
# anything else = the check could not run (job RED). Previously the plan ran under
# `continue-on-error: true` and an issue was opened only on exit 2, so a failed
# init or bad credentials — exit 1 — gave a green job and no issue, which is the
# same signal as "no drift".
#
# OpenTofu is installed by scripts/ci/install-opentofu.sh rather than
# opentofu/setup-opentofu, which this repo's Actions allowlist blocks; see that
# script for why, and for the checksum pinning that replaces it.

jobs:
  # Guards the exit-code mapping itself. Runs everywhere, needs no cloud access,
  # and is the reason the four lanes below can be trusted to tell drift from error.
  self-test:
    name: self-test / exit-code mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify drift, error and clean are distinguishable
        run: scripts/ci/test-tofu-drift-plan.sh

  gcp-landing:
    name: plan / gcp-landing
    runs-on: ubuntu-latest
    needs: self-test
    if: github.event_name != 'pull_request'
    # Was `gcp-prod`, which does not exist in this repo; `gcp-plan` is the
    # plan-only environment tofu-plan.yml already uses.
    environment: gcp-plan
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        run: scripts/ci/install-opentofu.sh
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TOFU_SA }}
      - name: plan
        id: plan
        run: scripts/ci/tofu-drift-plan.sh gcp-landing infra/tofu/envs/gcp-landing
      - name: open drift issue
        if: steps.plan.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/envs/gcp-landing/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] gcp-landing diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });

  aws-eks:
    name: plan / aws-eks
    runs-on: ubuntu-latest
    needs: self-test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        run: scripts/ci/install-opentofu.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TOFU_ROLE_ARN }}
          aws-region: us-east-1
      - name: plan
        id: plan
        run: scripts/ci/tofu-drift-plan.sh aws-eks infra/tofu/environments/aws-eks
      - name: open drift issue
        if: steps.plan.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/environments/aws-eks/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] aws-eks diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });

  azure-aks:
    name: plan / azure-aks
    runs-on: ubuntu-latest
    needs: self-test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        run: scripts/ci/install-opentofu.sh
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: plan
        id: plan
        run: scripts/ci/tofu-drift-plan.sh azure-aks infra/tofu/environments/azure-aks
      - name: open drift issue
        if: steps.plan.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/environments/azure-aks/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] azure-aks diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });

  ibm-iks:
    name: plan / ibm-iks
    runs-on: ubuntu-latest
    needs: self-test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        run: scripts/ci/install-opentofu.sh
      - name: Authenticate via IBM Trusted Profile (OIDC)
        run: |
          # Exchange the GitHub OIDC token for an IBM IAM access token.
          OIDC_TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iam.cloud.ibm.com" | jq -r .value)
          IBM_TOKEN=$(curl -s -X POST "https://iam.cloud.ibm.com/identity/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ibm:params:oauth:grant-type:cr-token&cr_token=${OIDC_TOKEN}&profile_id=${{ vars.IBM_TRUSTED_PROFILE_ID }}" \
            | jq -r .access_token)
          echo "::add-mask::$IBM_TOKEN"
          echo "IC_IAM_TOKEN=$IBM_TOKEN" >> "$GITHUB_ENV"
      - name: plan
        id: plan
        env:
          IC_IAM_TOKEN: ${{ env.IC_IAM_TOKEN }}
        run: scripts/ci/tofu-drift-plan.sh ibm-iks infra/tofu/environments/ibm-iks
      - name: open drift issue
        if: steps.plan.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/environments/ibm-iks/plan.txt', 'utf8').slice(0, 6000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[drift] ibm-iks diverged from live state (${new Date().toISOString().slice(0,10)})`,
              labels: ['infra-drift'],
              body: `\`\`\`\n${plan}\n\`\`\``,
            });
