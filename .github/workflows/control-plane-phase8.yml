name: control-plane-phase8

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/memory_tier.py'
      - 'tools/tests/test_memory_tier.py'
      - 'contracts/workspace-control-plane/**'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE8.md'
      - '.github/workflows/control-plane-phase8.yml'
  pull_request:
    paths:
      - 'tools/memory_tier.py'
      - 'tools/tests/test_memory_tier.py'
      - 'contracts/workspace-control-plane/**'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE8.md'
      - '.github/workflows/control-plane-phase8.yml'

jobs:
  control-plane-phase8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
      - name: Claim extraction + memory tier tests
        run: pytest -q tools/tests/test_memory_tier.py
