# Build every service image through the estate's reusable build-image workflow:
# push with the immutable commit-SHA tag (what the Argo ApplicationSets in
# deploy/argocd promote) + cosign-sign the digest.
#
# Supersedes the per-service GHCR one-offs (socioprophet-api-image.yml etc.):
# one matrix, one signing path.
#
# REGISTRY CUTOVER (in progress): images default to Artifact Registry and move to
# the sovereign zot registry one at a time, per entry, by setting `registry` +
# `registry_auth: basic` in the matrix. socioprophet-web goes first — it is the
# proof of the cutover. The end state is every entry on zot and the GAR terraform
# (infra/tofu/modules/artifact-registry) retired; until then the two coexist.
#
# DEPENDS ON: SocioProphet/.github (the reusable workflow) + the GAR repo. Until
# those exist this is intentionally not wired to PRs (push/dispatch only), so it
# can't go red before the backbone is provisioned.
name: images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

# WIF + cosign keyless signing both need id-token: write, and a reusable-workflow
# caller must grant it explicitly or the run fails at startup (org default token is
# read-only). contents: read for checkout.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go services + monorepo-rooted Dockerfiles COPY from the repo root (go.work, libs/go/…,
          # apps/…), so they build with context '.' and a full dockerfile path. Self-contained
          # services keep their own dir as context.
          - { image: socioprophet-api,      context: .,                         dockerfile: apps/api/Dockerfile }
          - { image: socioprophet-gateway,  context: .,                         dockerfile: apps/gateway/Dockerfile }
          # First image on the sovereign registry. Chosen to go first because it is
          # already broken in-cluster (see the nginx contract fix), so the cutover
          # can only improve it — no working service is put at risk to prove zot.
          - { image: socioprophet-web,      context: .,                         dockerfile: apps/socioprophet-web/Dockerfile, registry: registry.socioprophet.ai, registry_auth: basic }
          - { image: evidence-console,      context: apps/evidence-console,     dockerfile: Dockerfile }
          - { image: evidence-receipts,     context: apps/evidence-receipts,    dockerfile: Dockerfile }
          - { image: eval-fabric-api,       context: apps/eval-fabric-api,      dockerfile: Dockerfile }
          - { image: agentic-os-api,        context: apps/agentic-os-api,       dockerfile: Dockerfile }
          - { image: hellgraph-service,     context: apps/hellgraph-service,    dockerfile: Dockerfile }
          - { image: reporting-watcher,     context: apps/reporting-watcher,    dockerfile: Dockerfile }
          - { image: osm-map-api,           context: .,                         dockerfile: apps/osm-map-api/Dockerfile }
          - { image: dashboard-bff,         context: .,                         dockerfile: apps/dashboard-bff/Dockerfile }
          - { image: workspace-mail,        context: services/workspace-mail,   dockerfile: Dockerfile, registry: registry.socioprophet.ai, registry_auth: basic }
          - { image: workspace-caldav,      context: services/workspace-caldav, dockerfile: Dockerfile, registry: registry.socioprophet.ai, registry_auth: basic }
          - { image: workspace-smtp,        context: services/workspace-smtp,   dockerfile: Dockerfile, registry: registry.socioprophet.ai, registry_auth: basic }
          - { image: search-orchestrator,   context: .,                         dockerfile: services/search-orchestrator/Dockerfile }
          - { image: regis-acr-api,         context: apps/regis-acr-api,        dockerfile: Dockerfile }
          - { image: commons-search,        context: apps/commons-search,       dockerfile: Dockerfile }
          - { image: embeddings,           context: apps/embeddings,           dockerfile: Dockerfile }
          - { image: reasoning-failure-runner, context: apps/reasoning-failure-runner, dockerfile: Dockerfile }
          - { image: search-gateway,        context: apps/search-gateway,        dockerfile: Dockerfile }
          - { image: sherlock-engine,       context: apps/sherlock-engine,       dockerfile: Dockerfile }
          - { image: lattice-studio,        context: apps/lattice-studio,        dockerfile: Dockerfile }
          - { image: lattice-forge,         context: apps/lattice-forge,         dockerfile: Dockerfile }
          - { image: compute-gateway,       context: apps/compute-gateway,       dockerfile: Dockerfile }
          # GPU batch JOB, not a service. It has no port and no /healthz, and it is not
          # deployed by gitops-promote — the run planes reference the image directly, so
          # pass an explicit sha- tag rather than relying on :latest (a moving tag with
          # IfNotPresent means a fix never rolls out).
          - { image: noetica-impair,        context: apps/noetica-impair,        dockerfile: Dockerfile }
          - { image: grlplus-service,       context: apps/grlplus-service,       dockerfile: Dockerfile }
          - { image: grl-mesh,             context: apps/grl-mesh,             dockerfile: Dockerfile }
          - { image: owl-reasoner,         context: apps/owl-reasoner,         dockerfile: Dockerfile }
          - { image: entity-resolution,     context: apps/entity-resolution,     dockerfile: Dockerfile }
          - { image: algo-engine,           context: apps/algo-engine,           dockerfile: Dockerfile }
          - { image: ie-engine,             context: apps/ie-engine,             dockerfile: Dockerfile }
          - { image: synapse-bridge,        context: apps/synapse-bridge,        dockerfile: Dockerfile }
          - { image: holmes,                context: apps/holmes,                dockerfile: Dockerfile }
          - { image: portfolio-agent,       context: apps/portfolio-agent,       dockerfile: Dockerfile }
          - { image: academy-board,         context: apps/academy-board,         dockerfile: Dockerfile }
          - { image: health-twin,           context: apps/health-twin,           dockerfile: Dockerfile }
          - { image: memoryd,               context: apps/memoryd,               dockerfile: Dockerfile }
          - { image: node-commander,        context: apps/node-commander,        dockerfile: Dockerfile }
          - { image: liberty-stack-readout, context: apps/liberty-stack-readout, dockerfile: Dockerfile }
          - { image: tritfabric-consumption-api, context: ., dockerfile: apps/tritfabric-consumption-api/Dockerfile }
          - { image: agora,                 context: apps/agora,                 dockerfile: Dockerfile }
          - { image: spark-runner,          context: apps/spark-runner,          dockerfile: Dockerfile }
          # PHT-5 dataset/version store (embedded ArcticDB gateway). QuestDB + ClickHouse are
          # upstream images digest-pinned in deploy/values — no build entry for them.
          - { image: arcticdb-gateway,      context: apps/arcticdb-gateway,      dockerfile: Dockerfile }
          # Seal-the-Walls W1.1: proof-carrying HellGraph-log → ClickHouse materializer.
          - { image: prophet-materializer-clickhouse, context: apps/prophet-materializer-clickhouse, dockerfile: Dockerfile }
          # Seal-the-Walls W1.2: deterministic synthetic MarketDataEvent replay emitter —
          # the first sourceos-spec-conformant events INTO the log the materializer tails.
          - { image: market-replay,         context: apps/market-replay,         dockerfile: Dockerfile }
          # L5 governance executor: runs the engine's lifecycle FSM + retention scheduler +
          # vendor-cache gc (blueprint-audit: complete machinery, zero callers — until this).
          - { image: lifecycle-warden,      context: apps/lifecycle-warden,      dockerfile: Dockerfile }
    uses: SocioProphet/.github/.github/workflows/build-image.yml@main
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      # Per-entry overrides; entries that set neither keep the Artifact Registry
      # default, so this cutover moves one image at a time rather than all at once.
      registry:      ${{ matrix.registry || 'us-central1-docker.pkg.dev/socioprophet-platform/socioprophet' }}
      registry_auth: ${{ matrix.registry_auth || 'gar' }}
    # All four are optional in the reusable workflow, which asserts that the ones
    # its chosen auth path needs are actually present. GAR entries ignore the zot
    # credentials and vice versa.
    secrets:
      gcp_wif_provider:    ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      registry_username:   ${{ secrets.ZOT_CI_USERNAME }}
      registry_password:   ${{ secrets.ZOT_CI_PASSWORD }}
