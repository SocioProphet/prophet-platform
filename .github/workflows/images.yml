# Build every service image through the estate's reusable build-image workflow:
# push to Artifact Registry with the immutable commit-SHA tag (what the Argo
# ApplicationSets in deploy/argocd promote) + cosign-sign the digest.
#
# Supersedes the per-service GHCR one-offs (socioprophet-api-image.yml etc.):
# one matrix, one registry (GAR), one signing path.
#
# DEPENDS ON: SocioProphet/.github (the reusable workflow) + the GAR repo. Until
# those exist this is intentionally not wired to PRs (push/dispatch only), so it
# can't go red before the backbone is provisioned.
name: images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

# WIF + cosign keyless signing both need id-token: write, and a reusable-workflow
# caller must grant it explicitly or the run fails at startup (org default token is
# read-only). contents: read for checkout.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go services + monorepo-rooted Dockerfiles COPY from the repo root (go.work, libs/go/…,
          # apps/…), so they build with context '.' and a full dockerfile path. Self-contained
          # services keep their own dir as context.
          - { image: socioprophet-api,      context: .,                         dockerfile: apps/api/Dockerfile }
          - { image: socioprophet-gateway,  context: .,                         dockerfile: apps/gateway/Dockerfile }
          - { image: socioprophet-web,      context: .,                         dockerfile: apps/socioprophet-web/Dockerfile }
          - { image: evidence-console,      context: apps/evidence-console,     dockerfile: Dockerfile }
          - { image: evidence-receipts,     context: apps/evidence-receipts,    dockerfile: Dockerfile }
          - { image: eval-fabric-api,       context: apps/eval-fabric-api,      dockerfile: Dockerfile }
          - { image: hellgraph-service,     context: apps/hellgraph-service,    dockerfile: Dockerfile }
          - { image: osm-map-api,           context: .,                         dockerfile: apps/osm-map-api/Dockerfile }
          - { image: workspace-mail,        context: services/workspace-mail,   dockerfile: Dockerfile }
          - { image: workspace-caldav,      context: services/workspace-caldav, dockerfile: Dockerfile }
          - { image: workspace-smtp,        context: services/workspace-smtp,   dockerfile: Dockerfile }
          - { image: search-orchestrator,   context: .,                         dockerfile: services/search-orchestrator/Dockerfile }
          - { image: regis-acr-api,         context: apps/regis-acr-api,        dockerfile: Dockerfile }
    uses: SocioProphet/.github/.github/workflows/build-image.yml@main
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
    secrets:
      gcp_wif_provider:    ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
