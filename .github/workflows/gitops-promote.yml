# gitops-promote — the missing link that keeps deploy/values/*.yaml image pins in sync with main.
#
# Root cause it fixes: images.yml builds + publishes `sha-<commit>` on every merge, but nothing was bumping the
# values pins — so a service's deployed image silently drifted from main (lattice-studio was stale by dozens of
# merges). This closes the loop: after a green images build on main, it re-pins the CHANGED services to the fresh
# sha and commits to main; ArgoCD then rolls them. A values-only commit does NOT re-trigger images.yml (its path
# filter is apps/**, services/**, .github/workflows/images.yml), so there's no loop.
name: gitops-promote

on:
  workflow_run:
    workflows: ["images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: "Promote ALL sha-pinned values to origin/main HEAD (one-time catch-up), not just changed services"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write   # promote merges via auto-merged PR (see push step) — no direct-push bypass needed

concurrency:
  group: gitops-promote
  cancel-in-progress: false

jobs:
  promote:
    # auto: on any COMPLETED images run for main (success OR failure). The per-service build-job check in the
    # step below promotes ONLY services that actually built — so one unrelated matrix failure can't block
    # everyone's deploy (the sherlock-engine incident). manual (workflow_dispatch): always.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-pin values to the built sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for the per-service build-job success query (gh api)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA=$(git rev-parse HEAD)
            ALL="${{ inputs.all }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            ALL="false"
          fi
          echo "promoting to sha-$SHA (all=$ALL)"

          # --first-parent is REQUIRED: a plain `git show --name-only` is EMPTY for a MERGE commit, so a
          # service merged via a merge-commit (the default PR merge) was invisible here and NEVER promoted —
          # its built image silently never deployed (hellgraph-service hit exactly this). --first-parent
          # shows the merge's changes vs main.
          # GUARD: a commit that changed no app/service source built NO images, so promoting to it creates
          # dangling pins → estate-wide ImagePullBackOff. Bail out cleanly.
          if ! git show --name-only --first-parent --pretty="" "$SHA" | grep -qE '^(apps|services)/'; then
            echo "sha-$SHA changed no service source → no images built → nothing to promote"; exit 0
          fi

          if [ "$ALL" = "true" ]; then
            # one-time catch-up: every values file that pins a sha- tag
            FILES=$(grep -lE 'tag: (sha-[0-9a-f]+|latest)\b' deploy/values/*.yaml 2>/dev/null || true)
          else
            # only the services whose source changed in this commit (image-name == dir-name convention)
            CHANGED=$(git show --name-only --first-parent --pretty="" "$SHA" | grep -oE '^(apps|services)/[^/]+/' \
                      | sed -E 's#(apps|services)/([^/]+)/#\2#' | sort -u || true)
            # PARTIAL-SUCCESS: the images matrix builds every service (fail-fast:false), so one unrelated
            # service failing makes the whole run "failure" — which must NOT block the services that DID
            # build. On a workflow_run, keep only changed services whose per-service build job SUCCEEDED
            # (so its image exists). Fail SAFE: if the job list can't be read, OK is empty → nothing is
            # promoted (manual-pin fallback), never a dangling pin. A manual dispatch has no run → no filter.
            OK=""
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              OK=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" --paginate \
                     --jq '.jobs[] | select(.conclusion=="success") | .name' 2>/dev/null \
                   | sed -nE 's/^build \(([^,]+),.*/\1/p' | sort -u || true)
            fi
            FILES=""
            for name in $CHANGED; do
              if [ "${{ github.event_name }}" != "workflow_dispatch" ] && ! printf '%s\n' "$OK" | grep -qxF "$name"; then
                echo "skip $name — its image build did not succeed in this run"; continue
              fi
              f="deploy/values/${name}.yaml"
              [ -f "$f" ] && grep -qE 'tag: (sha-[0-9a-f]+|latest)\b' "$f" && FILES="$FILES $f"
            done
          fi

          bumped=""
          for f in $FILES; do
            if grep -qE "tag: sha-${SHA}\b" "$f"; then continue; fi     # already current
            sed -i -E "s#tag: (sha-[0-9a-f]+|latest)\b#tag: sha-${SHA}#" "$f"
            bumped="$bumped $(basename "$f" .yaml)"
          done

          if [ -z "$(git status --porcelain deploy/values)" ]; then
            echo "nothing to promote — all pins already current"; exit 0
          fi
          git config user.name "gitops-promote[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/values
          git commit -m "gitops: promote${bumped} → sha-${SHA:0:12}"
          # The main-required-checks ruleset (required diagnostics-gate) rejects direct
          # GITHUB_TOKEN pushes — a required check can never pre-exist on a fresh commit,
          # and the GitHub Actions app can't be a ruleset bypass actor. So promote merges
          # the way everyone else does: a PR that PASSES the gate, auto-merged. Credential-
          # free — no PAT in CI — and the gate stays meaningful for the bot too.
          BRANCH="gitops/promote-${SHA:0:12}-$(date +%s)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "gitops: promote${bumped} → sha-${SHA:0:12}" \
            --body "Automated image-pin promotion (values-only). Auto-merges when diagnostics-gate passes."
          gh pr merge "$BRANCH" --squash --auto --delete-branch
          echo "promoted via auto-merge PR:${bumped}"
