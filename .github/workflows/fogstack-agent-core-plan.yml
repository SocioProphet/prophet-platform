name: FogStack Agent Core Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemas/agent/**"
      - "tools/build_fogstack_agent_core_plan.py"
      - "tools/check_fogstack_agent_core_plan.py"
      - "tools/tests/test_fogstack_agent_core_plan.py"
      - ".github/workflows/fogstack-agent-core-plan.yml"
  push:
    branches: [main]
    paths:
      - "schemas/agent/**"
      - "tools/build_fogstack_agent_core_plan.py"
      - "tools/check_fogstack_agent_core_plan.py"
      - "tools/tests/test_fogstack_agent_core_plan.py"
      - ".github/workflows/fogstack-agent-core-plan.yml"

permissions:
  contents: read

jobs:
  agent-core-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema

      - name: Run agent core plan tests
        run: |
          python -m pytest -q tools/tests/test_fogstack_agent_core_plan.py

      - name: Build access agent core plan artifact
        run: |
          python3 tools/build_fogstack_agent_core_plan.py \
            --bundle-id fogstack.access \
            --version 0.1.0 \
            --agent-id agent:fogstack.access.operator \
            --human-anchor-role operator \
            --runtime-mode local \
            --isolation process \
            --identity-mode local-dev \
            --max-runtime-seconds 900 \
            --output build/fogstack-agent-core-plan/fogstack.access.agent-core-plan.json
          test -s build/fogstack-agent-core-plan/fogstack.access.agent-core-plan.json

      - name: Check access agent core plan artifact
        run: |
          python3 tools/check_fogstack_agent_core_plan.py --plan build/fogstack-agent-core-plan/fogstack.access.agent-core-plan.json
