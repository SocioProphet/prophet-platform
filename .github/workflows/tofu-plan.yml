name: tofu-plan
# Plan-only. No apply gate exists yet.
# Apply requires: manual GH Actions environment approval + signed plan artifact.
# See: infra/tofu/envs/gcp-landing/main.tf for APPLY GATE doctrine.

on:
  push:
    branches: [main]
    paths:
      - "infra/tofu/**"
      - ".github/workflows/tofu-plan.yml"
      - "scripts/ci/install-opentofu.sh"
  pull_request:
    branches: [main]
    paths:
      - "infra/tofu/**"
      # So a change to this workflow, or to the installer it now depends on, is
      # exercised before it merges. Between 2026-06-23 and this commit every run
      # was a startup_failure, and nothing triggered on the workflow file itself,
      # so no PR could have revealed that.
      - ".github/workflows/tofu-plan.yml"
      - "scripts/ci/install-opentofu.sh"

env:
  TOFU_VERSION: "1.8.3"

jobs:
  fmt-and-validate:
    name: Format + validate all envs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # opentofu/setup-opentofu cannot run here: this repo restricts actions to
      # github-owned + verified-Marketplace + an explicit pattern allowlist, and
      # setup-opentofu is on none of those (it is not Marketplace-listed at all).
      # The run was rejected before any job started, which is why every run since
      # 2026-06-23 was a startup_failure with nothing in the logs.
      # See scripts/ci/install-opentofu.sh for the checksum pinning that replaces it.
      - name: Install OpenTofu
        run: scripts/ci/install-opentofu.sh

      - name: fmt check
        run: tofu fmt -check -recursive infra/tofu/

      - name: validate — local
        run: |
          cd infra/tofu/envs/local
          tofu init -backend=false
          tofu validate

      - name: validate — gcp-landing
        run: |
          cd infra/tofu/envs/gcp-landing
          tofu init -backend=false
          tofu validate
        env:
          TF_VAR_billing_account: "000000-000000-000000"

      - name: validate — shared
        run: |
          cd infra/tofu/envs/shared
          tofu init -backend=false
          tofu validate

      - name: validate — prod
        run: |
          cd infra/tofu/envs/prod
          tofu init -backend=false
          tofu validate

      - name: validate — dns
        run: |
          cd infra/tofu/envs/dns
          tofu init -backend=false
          tofu validate
        env:
          TF_VAR_project: "validate-placeholder"

  gcp-plan-readiness:
    name: Check gcp-plan secret readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - id: ready
        name: Determine whether gcp-plan secrets are configured
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          GCP_BILLING_ACCOUNT: ${{ secrets.GCP_BILLING_ACCOUNT }}
          GCP_ADMIN_GROUP_EMAIL: ${{ secrets.GCP_ADMIN_GROUP_EMAIL }}
          GCP_ALERT_EMAIL: ${{ secrets.GCP_ALERT_EMAIL }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ] && [ -n "$GCP_BILLING_ACCOUNT" ] && [ -n "$GCP_ADMIN_GROUP_EMAIL" ] && [ -n "$GCP_ALERT_EMAIL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "gcp-plan secrets are not configured; skipping live GCP plan. Static OpenTofu validation still runs."
          fi

  plan-gcp-landing:
    name: Plan gcp-landing
    runs-on: ubuntu-latest
    needs: gcp-plan-readiness
    # Only run plan on PRs to main, and only when required environment secrets are configured.
    if: github.event_name == 'pull_request' && needs.gcp-plan-readiness.outputs.ready == 'true'
    permissions:
      contents: read
      id-token: write   # for Workload Identity Federation
    environment: gcp-plan  # Requires environment secrets listed in gcp-plan-readiness
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        run: scripts/ci/install-opentofu.sh

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Init gcp-landing
        run: tofu init
        working-directory: infra/tofu/envs/gcp-landing

      - name: Plan gcp-landing
        run: tofu plan -out=plan.out -no-color 2>&1 | tee plan.txt
        working-directory: infra/tofu/envs/gcp-landing
        env:
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_admin_group_email: ${{ secrets.GCP_ADMIN_GROUP_EMAIL }}
          TF_VAR_alert_email: ${{ secrets.GCP_ALERT_EMAIL }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan-gcp-landing-${{ github.sha }}
          path: |
            infra/tofu/envs/gcp-landing/plan.out
            infra/tofu/envs/gcp-landing/plan.txt
          retention-days: 30

      - name: Post plan summary to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/envs/gcp-landing/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## OpenTofu Plan — gcp-landing\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  # provider-leakage-check moved to its OWN workflow (provider-leakage.yml, #1046): it scans
  # contracts/schemas/specs/infra-* but tofu-plan only TRIGGERS on infra/tofu/**, so a leak
  # in a contract or an argocd/k8s manifest never ran this check. Its new home is filtered to
  # what it actually reads, and tofu-plan stays scoped to tofu (its heavy plan jobs shouldn't
  # run on every contract edit).

  dns-plan-readiness:
    name: Check dns-plan secret readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - id: ready
        name: Determine whether dns-plan secrets are configured
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          GCP_DNS_PROJECT: ${{ secrets.GCP_DNS_PROJECT }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ] && [ -n "$GCP_DNS_PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "dns-plan secrets are not configured; skipping live DNS plan. Static OpenTofu validation still runs."
          fi

  plan-dns:
    name: Plan dns
    runs-on: ubuntu-latest
    needs: dns-plan-readiness
    if: github.event_name == 'pull_request' && needs.dns-plan-readiness.outputs.ready == 'true'
    permissions:
      contents: read
      id-token: write   # for Workload Identity Federation
    environment: gcp-plan
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Init dns
        run: tofu init
        working-directory: infra/tofu/envs/dns

      - name: Plan dns
        run: tofu plan -out=plan.out -no-color 2>&1 | tee plan.txt
        working-directory: infra/tofu/envs/dns
        env:
          TF_VAR_project: ${{ secrets.GCP_DNS_PROJECT }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan-dns-${{ github.sha }}
          path: |
            infra/tofu/envs/dns/plan.out
            infra/tofu/envs/dns/plan.txt
          retention-days: 30

      - name: Post plan summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tofu/envs/dns/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## OpenTofu Plan — dns\n\`\`\`hcl\n${truncated}\n\`\`\``
            });
