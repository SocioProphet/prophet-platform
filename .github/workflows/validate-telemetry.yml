name: validate-telemetry
on:
  push:
    paths:
      - 'telemetry/**'
      - 'tools/validate_telemetry_package.py'
      - '.github/workflows/validate-telemetry.yml'
  pull_request:
    paths:
      - 'telemetry/**'
      - 'tools/validate_telemetry_package.py'
      - '.github/workflows/validate-telemetry.yml'

permissions:
  contents: read

jobs:
  validate-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install --upgrade pip jsonschema
      - name: Validate telemetry package
        run: python3 tools/validate_telemetry_package.py
