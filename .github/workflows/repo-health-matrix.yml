name: RepoHealthMatrix
on:
  pull_request:
    paths:
      - "contracts/RepoHealthMatrix.v0.1.json"
      - "tools/build_health_matrix.py"
      - "tools/tests/test_health_matrix.py"
      - "tools/tests/fixtures/health_signals.json"
  push:
    branches: [main]
    paths:
      - "contracts/RepoHealthMatrix.v0.1.json"
      - "tools/build_health_matrix.py"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install jsonschema pytest
      - name: Build matrix from fixture
        run: python3 tools/build_health_matrix.py --from tools/tests/fixtures/health_signals.json
      - name: Classification + schema tests
        run: python3 -m pytest tools/tests/test_health_matrix.py -q
