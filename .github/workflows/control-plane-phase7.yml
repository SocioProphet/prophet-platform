name: control-plane-phase7

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/temporal_outbox.py'
      - 'tools/tests/test_temporal_outbox.py'
      - 'contracts/workspace-control-plane/**'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE7.md'
      - '.github/workflows/control-plane-phase7.yml'
  pull_request:
    paths:
      - 'tools/temporal_outbox.py'
      - 'tools/tests/test_temporal_outbox.py'
      - 'contracts/workspace-control-plane/**'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE7.md'
      - '.github/workflows/control-plane-phase7.yml'

jobs:
  control-plane-phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
      - name: Temporal outbox + approval gate tests
        run: pytest -q tools/tests/test_temporal_outbox.py
