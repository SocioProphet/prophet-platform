name: cloudshell-fog structural conformance

on:
  pull_request:
    paths:
      - 'apps/cloudshell-fog/**'
      - 'contracts/cloudshell-fog/**'
      - 'docs/CLOUDSHELL_FOG_*.md'
      - 'docs/FOGSTACK_SIGNED_MANIFESTS.md'
      - 'infra/argocd/cloudshell-fog*'
      - 'infra/k8s/cloudshell-fog/**'
      - 'infra/policy/cloudshell-fog/**'
      - 'releases/manifests/fogstack.access-cloudshell-fog*'
      - 'tools/validate-cloudshell-fog-*.sh'
      - 'tools/attach_fogstack_manifest_signature.py'
  # Unfiltered push-on-main: this is lightweight structural validation (no build/plan), so
  # it's cheap to run on every main push, and that safety net means a wrong pull_request
  # filter degrades to merge-time detection, never to the check silently never running.
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  structural-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run noexec-safe cloudshell-fog structural conformance
        run: bash tools/validate-cloudshell-fog-structural-conformance.sh
