name: proposal-safety-fixtures

on:
  pull_request:
    paths:
      - 'tools/validate_scope_d_hardening_fixtures.py'
      - 'fixtures/ops-fabric/**'
      - '.github/workflows/scope-d-hardening-fixtures.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-proposal-safety-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate proposal safety fixtures
        run: python3 tools/validate_scope_d_hardening_fixtures.py
