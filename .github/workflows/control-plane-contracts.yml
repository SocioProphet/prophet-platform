name: control-plane-contracts

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'contracts/workspace-control-plane/**'
      - 'tools/validate_control_plane_contracts.py'
      - 'tools/tests/test_control_plane_contracts.py'
      - '.github/workflows/control-plane-contracts.yml'
  pull_request:
    paths:
      - 'contracts/workspace-control-plane/**'
      - 'tools/validate_control_plane_contracts.py'
      - 'tools/tests/test_control_plane_contracts.py'
      - '.github/workflows/control-plane-contracts.yml'

jobs:
  control-plane-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
      - name: Validate frozen schemas against examples
        run: python tools/validate_control_plane_contracts.py
      - name: Invariant tests (negative — enums/required have teeth)
        run: pytest -q tools/tests/test_control_plane_contracts.py
