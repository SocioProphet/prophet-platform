name: tritrpc-gateway-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/gateway/**'
      - 'libs/go/tritrpcbridge/**'
      - '.github/workflows/tritrpc-gateway-image.yml'
      - 'releases/images/component-inventory.v1.yaml'
  pull_request:
    paths:
      - 'apps/gateway/**'
      - 'libs/go/tritrpcbridge/**'
      - '.github/workflows/tritrpc-gateway-image.yml'
      - 'releases/images/component-inventory.v1.yaml'

permissions:
  contents: read
  packages: write

# COST GUARD 2 (queue vs cancel) — see socioprophet-api-image.yml for the full note.
# main QUEUES (cancel-in-progress:false); feature branches/PRs CANCEL superseded runs (INV-DEP-5).
concurrency:
  group: tritrpc-gateway-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # COST GUARD 1 (change-detection skip) — byte-identical source reuses the pinned digest.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: decide
        name: Decide build-vs-skip from source content-digest
        run: |
          set +e
          python3 tools/compute_source_content_digest.py decide \
            --path apps/gateway \
            --path libs/go/tritrpcbridge \
            --path .github/workflows/tritrpc-gateway-image.yml \
            --lock releases/images/tritrpc-gateway.image-lock.json \
            --allow-missing
          rc=$?
          if [ "$rc" != "0" ] && [ "$rc" != "10" ]; then exit "$rc"; fi

  image:
    needs: changes
    if: needs.changes.outputs.build_needed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: false
          tags: ghcr.io/socioprophet/prophet-platform/tritrpc-gateway:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=tritrpc-gateway
          cache-to: type=gha,mode=max,scope=tritrpc-gateway

      - name: Build and push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/socioprophet/prophet-platform/tritrpc-gateway:main
            ghcr.io/socioprophet/prophet-platform/tritrpc-gateway:${{ github.sha }}
          cache-from: type=gha,scope=tritrpc-gateway
          cache-to: type=gha,mode=max,scope=tritrpc-gateway

      - name: Compute source content-digest (record for next run's skip decision)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: content
        run: |
          cd="$(python3 tools/compute_source_content_digest.py digest \
            --path apps/gateway \
            --path libs/go/tritrpcbridge \
            --path .github/workflows/tritrpc-gateway-image.yml)"
          echo "content_digest=$cd" >> "$GITHUB_OUTPUT"

      - name: Emit digest evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p image-evidence
          cat > image-evidence/tritrpc-gateway-image.json <<EOF
          {
            "component_id": "tritrpc_gateway",
            "image": "ghcr.io/socioprophet/prophet-platform/tritrpc-gateway",
            "source_sha": "${{ github.sha }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "pinned_ref": "ghcr.io/socioprophet/prophet-platform/tritrpc-gateway@${{ steps.build.outputs.digest }}",
            "source_content_digest": "${{ steps.content.outputs.content_digest }}",
            "runtime_base": "scratch",
            "host_substrate_target": "fcos_silverblue_ostree_fedora_family"
          }
          EOF

      - name: Upload digest evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tritrpc-gateway-image-evidence
          path: image-evidence/tritrpc-gateway-image.json
