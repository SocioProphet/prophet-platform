name: SourceOS contracts

on:
  pull_request:
    paths:
      - "contracts/sourceos/**"
      - "docs/SOURCEOS_*.md"
      - "tools/validate_sourceos_contracts.py"
      - "tools/build_sourceos_m2_lifecycle_proof.py"
      - "tools/build_sourceos_truth_current_manifest.py"
      - "tools/smoke_sourceos_m2_lifecycle_proof.py"
      - "tools/publish_sourceos_m2_filesystem_registry.py"
      - "tools/smoke_sourceos_m2_filesystem_registry.py"
      - "tools/convert_nlboot_manifest_to_sourceos_bootreleaseset.py"
      - "tools/smoke_nlboot_to_sourceos_bootreleaseset.py"
      - "tools/emit_sourceos_synthetic_boot_fingerprint.py"
      - "tools/smoke_sourceos_synthetic_boot_fingerprint.py"
      - ".github/workflows/sourceos-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/sourceos/**"
      - "docs/SOURCEOS_*.md"
      - "tools/validate_sourceos_contracts.py"
      - "tools/build_sourceos_m2_lifecycle_proof.py"
      - "tools/build_sourceos_truth_current_manifest.py"
      - "tools/smoke_sourceos_m2_lifecycle_proof.py"
      - "tools/publish_sourceos_m2_filesystem_registry.py"
      - "tools/smoke_sourceos_m2_filesystem_registry.py"
      - "tools/convert_nlboot_manifest_to_sourceos_bootreleaseset.py"
      - "tools/smoke_nlboot_to_sourceos_bootreleaseset.py"
      - "tools/emit_sourceos_synthetic_boot_fingerprint.py"
      - "tools/smoke_sourceos_synthetic_boot_fingerprint.py"
      - ".github/workflows/sourceos-contracts.yml"

jobs:
  validate-sourceos-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Validate SourceOS contracts
        run: python tools/validate_sourceos_contracts.py
      - name: Smoke SourceOS M2 lifecycle proof
        run: python tools/smoke_sourceos_m2_lifecycle_proof.py
      - name: Smoke SourceOS M2 filesystem registry
        run: python tools/smoke_sourceos_m2_filesystem_registry.py
      - name: Smoke nlboot BootReleaseSet adapter
        run: python tools/smoke_nlboot_to_sourceos_bootreleaseset.py
      - name: Smoke SourceOS synthetic boot fingerprint
        run: python tools/smoke_sourceos_synthetic_boot_fingerprint.py
