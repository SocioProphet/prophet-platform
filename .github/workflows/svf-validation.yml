name: SVF Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  svf-agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate SVF agent contract
        run: make validate-svf-agent-contract
