name: SVF Validation

on:
  pull_request:
    paths:
      - 'tools/validate_svf_agent_contract.py'
      - 'contracts/svf/**'
      - 'Makefile'
      - '.github/workflows/svf-validation.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  svf-agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate SVF agent contract
        run: make validate-svf-agent-contract
