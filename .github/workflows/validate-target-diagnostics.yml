name: validate-target-diagnostics

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Cheap gatekeeper: decide whether this PR can possibly affect application code or service
  # behaviour. Runs in seconds, no toolchain, so it costs far less than the legs it can save.
  #
  # SAFETY PROPERTIES (each one deliberate — see the PR for the adversarial review):
  #   * FAIL-SAFE. Any doubt -> docs_only=false -> everything runs. An empty diff, a detection
  #     error, or a push to main all fall through to "run everything". Skipping requires
  #     positive proof of inertness, never absence of evidence.
  #   * NARROW. Only docs/** and root *.md count as inert. Everything else (apps, tools, infra,
  #     .github, contracts) forces the full matrix.
  #   * COVERAGE-PRESERVING. validate-target-diagnostics is NEVER skipped, because its
  #     `validate-repo` leg runs tools/validate_repo.py, which asserts REQUIRED_FILES like
  #     docs/ARCHITECTURE.md exist and scans for TODO/PLACEHOLDER. Docs are NOT inert to that
  #     check, so it keeps running on docs-only PRs. Only the app-test and smoke legs — which
  #     exercise application code and service behaviour — are skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Is this diff provably inert for app/service tests?
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull_request (${{ github.event_name }}) — main is never validated by inference"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --quiet origin "$BASE"
          CHANGED="$(git diff --name-only "origin/$BASE...HEAD" || true)"
          if [ -z "$CHANGED" ]; then
            echo "empty diff — running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # printf, not echo: a filename beginning with -n/-e is legal in git and
          # echo would eat it as a flag.
          echo "changed files:"; printf '%s\n' "$CHANGED" | sed 's/^/  /'
          # The rule lives in tools/ci_docs_only.py so it is unit-tested; a skip rule that
          # only exists in YAML is a skip rule nobody can test.
          #
          # The detector is NOT allowed to fail this job. Skipping tests must require a
          # positive "true"; anything else — a crash, a missing interpreter, an
          # unrecognised answer — falls back to running the full matrix. Letting the job
          # fail instead would still be safe for coverage (the dependents run on an empty
          # output), but it paints the workflow red while the required gate stays green,
          # which teaches people to ignore red.
          if ! RESULT="$(printf '%s\n' "$CHANGED" | python3 tools/ci_docs_only.py 2>&1)"; then
            echo "detector failed, running everything. output: $RESULT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$RESULT" != "true" ] && [ "$RESULT" != "false" ]; then
            echo "detector said '$RESULT', which is neither true nor false — running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "docs_only=$RESULT" >> "$GITHUB_OUTPUT"
          echo "decision: docs_only=$RESULT (false => full matrix)"

  validate-target-diagnostics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate-repo
          - engine-guards
          - drift-check
          - standards-check
          - topology-check
          - chronos-evidence-loop-readout-validate
          - lattice-surfaces-check
          - validate-ops-fabric
          - validate-search-academy-deploy
          - validate-search-image-release
          - validate-lampstand-lifecycle
          - validate-zone-stack-audit
          - policy-fabric-endpoint-client-smoke
          - policy-fabric-guarded-workflow-smoke
          - zone-router-publication-local-publish-smoke
          - zone-router-publication-failure-evidence-smoke
          - zone-router-publication-retry-state-smoke
          - zone-router-publication-remote-broker-seam-smoke
          - validate-workroom-update-contract
          - validate-professional-intelligence-manifest
          - validate-svf-agent-contract
          - validate-environment-validate-change-v2
          - validate-channel-runtime-gates
          - test-go
          - validate-phase4
          - validate-fogstack
          - validate-storage-suite
          - trustops-art-runner-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        if: matrix.target == 'test-go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python validator dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema
      - name: Run target
        run: make ${{ matrix.target }}

  app-test-diagnostics:
    needs: changes
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eval-fabric-api
            working-directory: apps/eval-fabric-api
            install: pip install -r requirements.txt -r requirements-test.txt
            test: pytest -q tests ../knowledge-reason/tests
          - name: evidence-receipts
            working-directory: apps/evidence-receipts
            install: pip install -r requirements.txt -r requirements-test.txt
            test: pytest -q tests
          - name: evidence-console
            working-directory: apps/evidence-console
            install: pip install -r requirements-test.txt
            test: pytest -q tests
          - name: zone-router
            working-directory: apps/zone-router
            install: pip install -r requirements-test.txt
            test: PYTHONPATH=src pytest -q tests
          - name: semantic-bridge
            working-directory: apps/semantic-bridge
            install: pip install -r requirements-test.txt
            test: PYTHONPATH=src pytest -q tests
          - name: compute-gateway
            working-directory: apps/compute-gateway
            install: pip install -r requirements.txt pytest
            test: PYTHONPATH=src pytest -q tests
          # The KnowledgeNugget conformance vectors — POSITIVE and NEGATIVE. This
          # service's entire claim is "nothing non-conformant reaches the graph", and
          # that claim is worth exactly what its negative vectors prove: over-long and
          # under-long direct-quote spans, a quote the source does not contain, an
          # evidence-free computed/inferred warrant, a missing sourceRef, a warrant
          # outside the closed taxonomy, and the refusal to launder a model-generated
          # nugget into source-warranted status. The sourceos-spec schema is VENDORED and
          # sha256-asserted at import, so this leg also catches contract drift the moment
          # the vendored copy is edited.
          - name: nugget-extractor
            working-directory: apps/nugget-extractor
            install: pip install -r requirements.txt -r requirements-test.txt
            test: PYTHONPATH=src pytest -q tests
          # device-service (W8.7 southbound device plane). This leg gates the attribution
          # invariant — a reading must resolve to its device, its profile, the exact
          # profile REVISION (digest) and the declared physical channel, or it is refused
          # and counted. It also covers the gapless-retry and seal-then-count semantics,
          # the BLE GATT decoders (including the sint16 signedness trap that silently
          # turns -5 degC into +650 degC), and the refusal to start on a protocol with no
          # driver. The sourceos-spec schemas are VENDORED and sha256-asserted at import,
          # so this leg also catches contract drift the moment a vendored copy is edited.
          - name: device-service
            working-directory: apps/device-service
            install: pip install -r requirements.txt -r requirements-test.txt
            test: PYTHONPATH=src pytest -q tests
          - name: tools-tests
            working-directory: .
            install: pip install pytest pyyaml jsonschema
            test: pytest -q tools/tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create virtualenv
        working-directory: ${{ matrix.working-directory }}
        run: python3 -m venv .venv
      - name: Install app/tool test dependencies
        working-directory: ${{ matrix.working-directory }}
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      - name: Run app/tool diagnostic
        id: diagnostic
        working-directory: ${{ matrix.working-directory }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diagnostic-logs"
          log="$GITHUB_WORKSPACE/diagnostic-logs/${{ matrix.name }}.log"
          . .venv/bin/activate
          set +e
          {
            echo "target=${{ matrix.name }}"
            echo "working_directory=${{ matrix.working-directory }}"
            echo "test_command=${{ matrix.test }}"
            ${{ matrix.test }}
            status=$?
            echo "exit_status=$status"
            exit $status
          } 2>&1 | tee "$log"
          exit ${PIPESTATUS[0]}
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.name }}
          path: diagnostic-logs/${{ matrix.name }}.log

  smoke-target-diagnostics:
    needs: changes
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - lattice-surface-ingestor-smoke
          - lattice-studio-smoke
          - grlplus-service-smoke
          - grl-mesh-smoke
          - owl-reasoner-smoke
          - entity-resolution-smoke
          - memoryd-smoke
          - node-commander-smoke
          - liberty-stack-readout-smoke
          - tritfabric-consumption-api-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run target
        run: make ${{ matrix.target }}

  # Single stable check name for branch-protection rulesets: requiring this one
  # job covers every matrix leg above (and any added later) without having to
  # enumerate ~45 per-target check names in repo settings.
  #
  # DO NOT RENAME THIS JOB. `diagnostics-gate` is the only context in the
  # `main-required-checks` ruleset, and gitops-promote.yml dispatches this
  # workflow specifically to produce this check name on promote branches.
  #
  # This gate used to read:
  #   [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
  # which tested `failure` and `cancelled` and nothing else. A skipped job
  # reports `skipped`, so both contains() calls were false and the gate went
  # GREEN — the sole required check for the repository passing having verified
  # that nothing ran. `changes` was not even in `needs:`, so the job that
  # authorises the skips was outside the gate it authorises.
  #
  # The verdict now lives in tools/ci_diagnostics_gate.py, under unit test, for
  # the same reason the skip rule lives in tools/ci_docs_only.py: a rule that
  # only exists as a YAML expression is a rule nobody can test — and this one
  # decides whether anything may merge at all. It is fail-CLOSED. Every needed
  # job must have SUCCEEDED, with exactly one documented exception: app-test-
  # diagnostics and smoke-target-diagnostics may report `skipped` when the
  # `changes` job proved the diff docs-only (docs/** and root *.md, per
  # tools/ci_docs_only.py), which is the filter declared on those two jobs
  # above. Any other skip — a new path filter, a mistyped condition, a leg
  # dropped from `needs:` — is RED until someone argues the case in that file.
  diagnostics-gate:
    if: always()
    needs: [changes, validate-target-diagnostics, app-test-diagnostics, smoke-target-diagnostics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail unless every diagnostics job ran and passed
        # `needs` reaches the rule through the environment rather than string
        # interpolation, so the verdict is computed from data and never from
        # shell text assembled at template-expansion time.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" | python3 tools/ci_diagnostics_gate.py
