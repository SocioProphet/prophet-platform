name: control-plane-phase10

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/policy_gate.py'
      - 'tools/tests/test_policy_gate.py'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE10.md'
      - '.github/workflows/control-plane-phase10.yml'
  pull_request:
    paths:
      - 'tools/policy_gate.py'
      - 'tools/tests/test_policy_gate.py'
      - 'docs/WORKSPACE_CONTROL_PLANE_PHASE10.md'
      - '.github/workflows/control-plane-phase10.yml'

jobs:
  control-plane-phase10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
      - name: Policy gate + PolicyDecision span tests
        run: pytest -q tools/tests/test_policy_gate.py
