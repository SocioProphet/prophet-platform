name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build API
        run: |
          cd apps/api/cmd/socioprophet-api && go build
      - name: Build Gateway
        run: |
          cd apps/gateway/cmd/tritrpc-gateway && go build

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned pnpm
        run: npm install -g pnpm@9.15.4
      - name: Build
        run: |
          cd apps/socioprophet-web
          pnpm install
          pnpm build

  orchestration-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixture validation dependencies
        run: python -m pip install jsonschema==4.23.0
      - name: Validate core orchestration fixture
        run: python specs/orchestration/orchestration_contract_fixture.py
      - name: Validate embodied experience traces
        run: |
          python specs/orchestration/embodied_experience_trace_fixture.py
          python specs/orchestration/embodied_experience_trace_fixture.py --records > /tmp/embodied-training-records.json
      - name: Validate event capability fixture
        run: |
          python specs/orchestration/event_capability_fixture.py
          python specs/orchestration/event_capability_fixture.py --events > /tmp/event-capability.records.json
      - name: Validate validate_change v2 API stub
        run: python tools/smoke_validate_change_v2_api_stub.py
      - name: Validate DevSecOps workroom fixtures
        run: python tools/validate_devsecops_workroom.py
      - name: Validate DevSecOps validation receipt refs
        run: python tools/validate_devsecops_validation_run_receipt_ref.py
      - name: Validate external fixture mirror governance
        run: python tools/validate_external_fixture_mirrors.py
      - name: Validate cross-plane runtime handoff
        run: python tools/validate_cross_plane_runtime_handoff.py
      - name: Validate Workroom GAIA topology refs
        run: python tools/validate_workroom_gaia_topology_refs.py
      - name: Validate Workroom Guardrail action safety
        run: python tools/validate_workroom_guardrail_action_safety.py
      - name: Validate Workroom Guardrail decision binding
        run: python tools/validate_workroom_guardrail_decision_binding.py
      - name: Validate persisted FogStack parity bundle
        run: python tools/validate_fogstack_parity_artifact_bundle.py
      - name: Validate FogStack SVF nonprod sandbox observation
        run: python tools/validate_fogstack_svf_nonprod_sandbox_observation.py
      - name: Validate FogStack SVF baseline fallback trace
        run: python tools/validate_fogstack_svf_baseline_fallback_trace.py
      - name: Validate Workroom baseline fallback bridge
        run: python tools/validate_workroom_runtime_baseline_fallback_bridge.py
      - name: Validate FogStack SVF network isolation observation
        run: python tools/validate_fogstack_svf_network_isolation_observation.py
      - name: Validate Workroom network isolation bridge
        run: python tools/validate_workroom_runtime_network_isolation_bridge.py
      - name: Validate FogStack SVF async topic isolation observation
        run: python tools/validate_fogstack_svf_async_topic_isolation_observation.py
      - name: Validate Workroom async topic isolation bridge
        run: python tools/validate_workroom_runtime_async_topic_isolation_bridge.py
      - name: Validate FogStack SVF stateful resource isolation observation
        run: python tools/validate_fogstack_svf_stateful_resource_isolation_observation.py
      - name: Validate Workroom stateful resource isolation bridge
        run: python tools/validate_workroom_runtime_stateful_resource_isolation_bridge.py
      - name: Validate Workroom runtime parity bridge
        run: python tools/validate_workroom_runtime_parity_bridge.py
      - name: Validate Workroom runtime parity UI wiring
        run: python tools/validate_workroom_runtime_parity_ui_component.py
      - name: Validate validate_change v2 Workroom adapter
        run: python tools/smoke_generate_workroom_from_validate_change_v2.py
      - name: Build validate_change v2 Workroom bundle
        run: python tools/build_validate_change_workroom_bundle.py --out /tmp/validate-change-workroom
      - name: Validate DevSecOps Workroom report surface
        run: python tools/smoke_build_devsecops_workroom_report.py
      - name: Run world-class event loop proof
        run: |
          python specs/orchestration/world_class_event_loop_demo.py --out /tmp/world-class-event-loop --compact
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('/tmp/world-class-event-loop')
          report = json.loads((out / 'demo-report.json').read_text())
          assert report['status'] == 'pass', report
          required = [
              'core-orchestration.bundle.json',
              'embodied-traces.bundle.json',
              'embodied-training-records.json',
              'event-capability.bundle.json',
              'event-capability.records.json',
              'event-capability.policy-annotated.records.json',
              'sourceos-queue.snapshot.json',
              'agentplane-admission.artifact.json',
              'sherlock-event-capability-index.json',
              'demo-report.json',
          ]
          missing = [name for name in required if not (out / name).exists()]
          assert not missing, missing
          print(json.dumps(report['summary'], sort_keys=True))
          PY
