name: search-orchestrator-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/search-orchestrator/**'
      - '.github/workflows/search-orchestrator-image.yml'
      - '.github/workflows/search-orchestrator-image-pin.yml'
      - 'tools/apply_search_orchestrator_image_lock.py'
  pull_request:
    paths:
      - 'services/search-orchestrator/**'
      - '.github/workflows/search-orchestrator-image.yml'
      - '.github/workflows/search-orchestrator-image-pin.yml'
      - 'tools/apply_search_orchestrator_image_lock.py'
      - 'tools/validate_search_orchestrator_image_release.py'
      - 'releases/images/search-orchestrator.image-lock.example.json'

permissions:
  contents: read
  packages: write

# COST GUARD 2 (queue vs cancel) — see socioprophet-api-image.yml for the full note.
# main QUEUES (cancel-in-progress:false); feature branches/PRs CANCEL superseded runs (INV-DEP-5).
concurrency:
  group: search-orchestrator-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # COST GUARD 1 (change-detection skip) — this component has a committed image-lock carrying a
  # source_content_digest, so an unchanged services/search-orchestrator tree SKIPS the build and
  # reuses the already-pinned digest (releases/images/search-orchestrator.image-lock.json).
  changes:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: decide
        name: Decide build-vs-skip from source content-digest
        run: |
          set +e
          python3 tools/compute_source_content_digest.py decide \
            --path services/search-orchestrator \
            --path .github/workflows/search-orchestrator-image.yml \
            --lock releases/images/search-orchestrator.image-lock.json \
            --allow-missing
          rc=$?
          if [ "$rc" != "0" ] && [ "$rc" != "10" ]; then exit "$rc"; fi

  image:
    needs: changes
    if: needs.changes.outputs.build_needed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/search-orchestrator/Dockerfile
          push: false
          tags: ghcr.io/socioprophet/prophet-platform/search-orchestrator:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=search-orchestrator
          cache-to: type=gha,mode=max,scope=search-orchestrator

      - name: Build and push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/search-orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/socioprophet/prophet-platform/search-orchestrator:main
            ghcr.io/socioprophet/prophet-platform/search-orchestrator:${{ github.sha }}
          cache-from: type=gha,scope=search-orchestrator
          cache-to: type=gha,mode=max,scope=search-orchestrator

      - name: Compute source content-digest (record for next run's skip decision)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: content
        run: |
          cd="$(python3 tools/compute_source_content_digest.py digest \
            --path services/search-orchestrator \
            --path .github/workflows/search-orchestrator-image.yml)"
          echo "content_digest=$cd" >> "$GITHUB_OUTPUT"

      - name: Emit digest evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p image-evidence
          cat > image-evidence/search-orchestrator-image.json <<EOF
          {
            "image": "ghcr.io/socioprophet/prophet-platform/search-orchestrator",
            "source_sha": "${{ github.sha }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "pinned_ref": "ghcr.io/socioprophet/prophet-platform/search-orchestrator@${{ steps.build.outputs.digest }}",
            "source_content_digest": "${{ steps.content.outputs.content_digest }}"
          }
          EOF

      - name: Upload digest evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: search-orchestrator-image-evidence
          path: image-evidence/search-orchestrator-image.json
