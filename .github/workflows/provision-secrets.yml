name: provision-secrets

# Provision app-token Secrets into the cluster THROUGH CI — no out-of-band kubectl.
# The token VALUES live in GitHub Actions secrets (set once in repo/org settings); this
# workflow materializes them as Kubernetes Secrets in the right namespaces using the
# estate's GCP Workload Identity Federation (the same WIF helm-release.yml uses).
# Idempotent: `kubectl create ... --dry-run=client | kubectl apply -f -`.
#
# One-time setup (repo settings):
#   • Variables:  GKE_CLUSTER, GKE_LOCATION  (the prophet-platform GKE Autopilot cluster)
#   • Secrets:    GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT  (already set),
#                 plus the token values: SPARK_RUNNER_TOKEN, LATTICE_FORGE_TOKEN,
#                 COMPUTE_GATEWAY_TOKEN, STUDIO_WRITE_TOKEN,
#                 WORDOPS_ROOM_FACTORY_TOKEN (the Synapse-issued room-factory service-account token).
#                 wordops-broker-signing needs NO GitHub secret — it is MINTED here.
#                 gitea-signing-key needs NO GitHub secret — it is MINTED here (the agentic shell's
#                 sovereign Gitea backend root; activates ShellBackendAdapter + gitea-sovereign mint).
#                 arcticdb-gateway-token needs NO GitHub secret — it is MINTED here (a symmetric
#                 self-issued bearer; the gateway checks presented bearers against this Secret).
#
# Run: Actions → provision-secrets → Run workflow (optionally scope with `only`).
# Rotate a token = update the GitHub secret, re-run. A missing value is skipped, not errored.
#
# THREE CLASSES OF SECRET LIVE HERE:
#   1. SYNCED  — the value is a human/vendor-issued token held in GitHub secrets (the `sync` calls).
#   2. DERIVED — the value already exists in-cluster and is copied so it cannot drift
#                (postgres-credentials ← postgres-admin).
#   3. MINTED  — nobody should ever know the value: CI generates it. No GitHub secret, no human
#                handling, no value in a chat log or a terminal history. `clickhouse-admin` is the
#                first of these. Minted secrets are CREATE-IF-ABSENT: see the mint step for why
#                re-running must never silently regenerate them.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated secret names to provision (blank = all)"
        required: false
        default: ""
      rotate:
        description: "Comma-separated MINTED secrets to force-regenerate (DANGEROUS — see the mint step)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # required for WIF

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2.3.5
        with:
          # Default to the known prophet-platform coordinates so the workflow is self-sufficient
          # even when the repo Variables were never set (they weren't — this is why the first run
          # failed with "input required and not supplied: cluster_name"). Setting vars.GKE_CLUSTER /
          # vars.GKE_LOCATION still overrides these.
          cluster_name: ${{ vars.GKE_CLUSTER || 'prophet-platform' }}
          location: ${{ vars.GKE_LOCATION || 'us-central1' }}

      - name: Materialize token Secrets
        env:
          SPARK_RUNNER_TOKEN: ${{ secrets.SPARK_RUNNER_TOKEN }}
          LATTICE_FORGE_TOKEN: ${{ secrets.LATTICE_FORGE_TOKEN }}
          COMPUTE_GATEWAY_TOKEN: ${{ secrets.COMPUTE_GATEWAY_TOKEN }}
          STUDIO_WRITE_TOKEN: ${{ secrets.STUDIO_WRITE_TOKEN }}
          WORDOPS_ROOM_FACTORY_TOKEN: ${{ secrets.WORDOPS_ROOM_FACTORY_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail

          # sync <secret-name> <key> <value> <namespace...>
          sync() {
            local name="$1" key="$2" val="$3"; shift 3
            if [ -z "$val" ]; then echo "· skip $name (no value in GitHub secrets)"; return 0; fi
            if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ",$name,"; then
              echo "· skip $name (not in 'only' filter)"; return 0
            fi
            for ns in "$@"; do
              kubectl create secret generic "$name" -n "$ns" \
                --from-literal="$key=$val" --dry-run=client -o yaml | kubectl apply -f -
              echo "✔ $name → namespace/$ns"
            done
          }

          # name                     key    value                     namespaces
          sync spark-runner-token    token "$SPARK_RUNNER_TOKEN"    sovereign-runtime socioprophet
          sync lattice-forge-token   token "$LATTICE_FORGE_TOKEN"   sovereign-runtime socioprophet
          sync compute-gateway-token token "$COMPUTE_GATEWAY_TOKEN" socioprophet
          sync studio-write-token    token "$STUDIO_WRITE_TOKEN"    socioprophet
          # wordops-room-factory holds the Synapse service-account access token the room-factory
          # uses to createRoom. Synapse ISSUES it, so it originates in a GitHub secret and is
          # synced (not minted). The deploy marks it optional: until present, /rooms fails closed.
          sync wordops-room-factory access_token "$WORDOPS_ROOM_FACTORY_TOKEN" socioprophet

          echo "done."

      # postgres-credentials is a TWO-key secret (username + password) shared by workspace-smtp,
      # memoryd, and agent-registry to reach the `postgres` StatefulSet (DB prophet_platform).
      # Rather than duplicate the password into a GitHub secret (and risk it drifting from the
      # running DB), DERIVE it from the in-cluster `postgres-admin` secret — the same value the
      # postgres pod itself uses — so it always matches. Idempotent (create --dry-run | apply).
      - name: Derive postgres-credentials from postgres-admin
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ',postgres-credentials,'; then
            echo "· skip postgres-credentials (not in 'only' filter)"; exit 0
          fi
          PW=$(kubectl get secret postgres-admin -n socioprophet -o jsonpath='{.data.password}' | base64 -d)
          if [ -z "$PW" ]; then echo "✗ postgres-admin has no password — aborting"; exit 1; fi
          kubectl create secret generic postgres-credentials -n socioprophet \
            --from-literal=username=postgres --from-literal=password="$PW" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✔ postgres-credentials → namespace/socioprophet (derived from postgres-admin)"

      # ── MINTED secrets: generated in CI, known to nobody ────────────────────────────────────
      # clickhouse-admin gates BOTH the ClickHouse server (which sets its admin password from this
      # value on first init) and prophet-materializer-clickhouse (which authenticates with it).
      # Until it exists both pods sit in CreateContainerConfigError — `secret "clickhouse-admin"
      # not found` — which is exactly where they have been.
      #
      # CREATE-IF-ABSENT, deliberately. ClickHouse PERSISTS the admin password into its data
      # volume on first initialization, so regenerating this Secret on a later run would leave the
      # stored server password and the client credential disagreeing — the materializer would then
      # fail to authenticate against a database that is otherwise perfectly healthy, which is a
      # miserable failure to diagnose. Rotation is therefore opt-in via the `rotate` input AND
      # requires the coordinated procedure in deploy/values/clickhouse.yaml (rotate the server's
      # own password, then this Secret, then restart consumers) — a workflow input alone cannot
      # make that safe, so it warns loudly and still refuses to touch an initialized volume.
      #
      # Charset is hex on purpose: base64 emits '/', '+' and '=', which are hazardous inside
      # connection strings and URL-encoded config. 48 hex chars is 192 bits — more than enough,
      # and it cannot break a DSN.
      - name: Mint clickhouse-admin (create-if-absent)
        env:
          ONLY: ${{ inputs.only }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          NAME=clickhouse-admin NS=socioprophet
          if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ",$NAME,"; then
            echo "· skip $NAME (not in 'only' filter)"; exit 0
          fi

          EXISTS=$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name || true)
          FORCE=false
          if printf ',%s,' "$ROTATE" | grep -q ",$NAME,"; then FORCE=true; fi

          if [ -n "$EXISTS" ] && [ "$FORCE" != true ]; then
            echo "✔ $NAME already present in $NS — left untouched (minted secrets are never silently regenerated)"
            exit 0
          fi

          if [ -n "$EXISTS" ] && [ "$FORCE" = true ]; then
            echo "⚠ ROTATING $NAME. ClickHouse stores its admin password on the data volume: unless"
            echo "⚠ the SERVER password was rotated in the same maintenance window, consumers will"
            echo "⚠ now fail to authenticate. Restart clickhouse AND prophet-materializer-clickhouse."
          fi

          # openssl, not `tr -dc … | head -c N`: when head closes the pipe after N bytes, tr dies
          # of SIGPIPE and the pipeline returns non-zero, so under `bash -e` the step fails AFTER
          # having possibly applied nothing — which is exactly how the first run of this step died
          # ("tr: write error: Broken pipe"). openssl needs no pipeline at all.
          PW=$(openssl rand -hex 24)
          [ ${#PW} -eq 48 ] || { echo "✗ generator produced ${#PW} chars, refusing"; exit 1; }
          case "$PW" in *[!0-9a-f]*) echo "✗ generator produced non-hex output, refusing"; exit 1;; esac
          echo "::add-mask::$PW"

          kubectl create secret generic "$NAME" -n "$NS" \
            --from-literal=password="$PW" --dry-run=client -o yaml | kubectl apply -f -
          echo "✔ $NAME → namespace/$NS (minted in CI; the value exists nowhere else)"

      # gitea-signing-key is the HMAC root the gitea-sovereign local-authority signs ScopedAgentTokens
      # with (core/local-authority.js issueLocalGrant). It is what activates the agentic shell's
      # sovereign Gitea backend (ShellBackendAdapter + gitea-sovereign mint-shell-ops-token). MINTED:
      # the runner never signs with a human-held key — the authority pod mounts this Secret and issues
      # short-lived (900s) tokens; the CI mint job calls the authority, it does not hold the root.
      # CREATE-IF-ABSENT: rotating it invalidates every outstanding grant, so rotation is opt-in via
      # `rotate` and must be coordinated with an authority restart. 32 hex bytes = a 256-bit HMAC key
      # (HS256 bootstrap; the schema reserves an Ed25519 upgrade path).
      - name: Mint gitea-signing-key (create-if-absent)
        env:
          ONLY: ${{ inputs.only }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          NAME=gitea-signing-key NS=socioprophet
          if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ",$NAME,"; then
            echo "· skip $NAME (not in 'only' filter)"; exit 0
          fi
          EXISTS=$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name || true)
          FORCE=false
          if printf ',%s,' "$ROTATE" | grep -q ",$NAME,"; then FORCE=true; fi
          if [ -n "$EXISTS" ] && [ "$FORCE" != true ]; then
            echo "✔ $NAME already present in $NS — left untouched (minted secrets are never silently regenerated)"
            exit 0
          fi
          if [ -n "$EXISTS" ] && [ "$FORCE" = true ]; then
            echo "⚠ ROTATING $NAME. Every outstanding ScopedAgentToken becomes unverifiable the moment"
            echo "⚠ the authority reloads this key. Restart the gitea-sovereign local-authority in the"
            echo "⚠ same maintenance window, or in-flight shell sessions will fail token verification."
          fi
          # openssl (no pipeline → no SIGPIPE-under-bash-e trap, same reason as clickhouse-admin above)
          KEY=$(openssl rand -hex 32)
          [ ${#KEY} -eq 64 ] || { echo "✗ generator produced ${#KEY} chars, refusing"; exit 1; }
          case "$KEY" in *[!0-9a-f]*) echo "✗ generator produced non-hex output, refusing"; exit 1;; esac
          echo "::add-mask::$KEY"
          kubectl create secret generic "$NAME" -n "$NS" \
            --from-literal=key="$KEY" --dry-run=client -o yaml | kubectl apply -f -
          echo "✔ $NAME → namespace/$NS (minted in CI; the HMAC root exists nowhere else)"

      # authority-caller-token is the bearer the agentic shell presents to the gitea
      # authority's /v1/tokens endpoints. MINTED: nobody types it; the authority checks
      # it against this Secret and the shell reads the same Secret. Fail-closed — without
      # it the authority signs nothing. CREATE-IF-ABSENT (rotating logs out the shell).
      - name: Mint authority-caller-token (create-if-absent)
        env:
          ONLY: ${{ inputs.only }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          NAME=authority-caller-token NS=socioprophet
          if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ",$NAME,"; then
            echo "· skip $NAME (not in 'only' filter)"; exit 0
          fi
          EXISTS=$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name || true)
          FORCE=false
          if printf ',%s,' "$ROTATE" | grep -q ",$NAME,"; then FORCE=true; fi
          if [ -n "$EXISTS" ] && [ "$FORCE" != true ]; then
            echo "✔ $NAME already present in $NS — left untouched"
            exit 0
          fi
          TOKEN=$(openssl rand -hex 32)
          [ ${#TOKEN} -eq 64 ] || { echo "✗ generator produced ${#TOKEN} chars"; exit 1; }
          echo "::add-mask::$TOKEN"
          kubectl create secret generic "$NAME" -n "$NS" \
            --from-literal=token="$TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          echo "✔ $NAME → namespace/$NS (minted in CI)"

      # arcticdb-gateway-token is the INBOUND bearer for the arcticdb-gateway. server.py checks the
      # presented `Authorization: Bearer` against GATEWAY_TOKEN with secrets.compare_digest — a
      # SYMMETRIC self-issued bearer: nothing outside the cluster issues it and no human needs it,
      # so it is MINTED here. (It was previously mis-declared SYNCED; with no GitHub value ever set,
      # `sync` failed OPEN and silently skipped it — the pod sat in CreateContainerConfigError and
      # the ArgoCD app Degraded, a control that failed quietly. Minting is create-if-absent, so the
      # Secret is always produced.)
      #
      # CREATE-IF-ABSENT with plain rotation: no persisted copy on a data volume, so rotating is
      # safe — callers holding the old bearer get 401 until they re-read the Secret; restart
      # arcticdb-gateway after a rotation (the value is read into the process env at start).
      - name: Mint arcticdb-gateway-token (create-if-absent)
        env:
          ONLY: ${{ inputs.only }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          NAME=arcticdb-gateway-token NS=socioprophet
          if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ",$NAME,"; then
            echo "· skip $NAME (not in 'only' filter)"; exit 0
          fi

          EXISTS=$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name || true)
          FORCE=false
          if printf ',%s,' "$ROTATE" | grep -q ",$NAME,"; then FORCE=true; fi

          if [ -n "$EXISTS" ] && [ "$FORCE" != true ]; then
            echo "✔ $NAME already present in $NS — left untouched (minted secrets are never silently regenerated)"
            exit 0
          fi
          if [ -n "$EXISTS" ] && [ "$FORCE" = true ]; then
            echo "⚠ ROTATING $NAME. Callers holding the old bearer will get 401; restart arcticdb-gateway."
          fi

          # openssl (no pipeline → no SIGPIPE-under-bash-e trap, same reason as clickhouse-admin above)
          TOK=$(openssl rand -hex 32)
          [ ${#TOK} -eq 64 ] || { echo "✗ generator produced ${#TOK} chars, refusing"; exit 1; }
          case "$TOK" in *[!0-9a-f]*) echo "✗ generator produced non-hex output, refusing"; exit 1;; esac
          echo "::add-mask::$TOK"

          kubectl create secret generic "$NAME" -n "$NS" \
            --from-literal=token="$TOK" --dry-run=client -o yaml | kubectl apply -f -
          echo "✔ $NAME → namespace/$NS (minted in CI; the value exists nowhere else)"

      # nugget-extractor-token is the INBOUND bearer for nugget-extractor POST /v1/extract
      # (the extraction spine's door). Nothing outside the cluster needs to know it, and no
      # human does — so it is MINTED here rather than synced from a GitHub secret.
      #
      # CREATE-IF-ABSENT with plain rotation: unlike clickhouse-admin there is no persisted
      # copy on a data volume, so rotating is safe — the only consequence is that callers
      # holding the old token get 401 until they re-read the Secret. Restart nugget-extractor
      # after a rotation (the value is read into the process env at start).
      #
      # Until this runs, the deploy is FAIL-CLOSED, not broken: deploy/values/
      # nugget-extractor.yaml marks the secretEnv `optional: true`, so the pod starts and
      # /healthz answers, while /v1/extract returns 503 "ingest token not configured".
      - name: Mint nugget-extractor-token (create-if-absent)
        env:
          ONLY: ${{ inputs.only }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          NAME=nugget-extractor-token NS=socioprophet
          if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ",$NAME,"; then
            echo "· skip $NAME (not in 'only' filter)"; exit 0
          fi

          EXISTS=$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name || true)
          FORCE=false
          if printf ',%s,' "$ROTATE" | grep -q ",$NAME,"; then FORCE=true; fi

          if [ -n "$EXISTS" ] && [ "$FORCE" != true ]; then
            echo "✔ $NAME already present in $NS — left untouched (minted secrets are never silently regenerated)"
            exit 0
          fi
          if [ -n "$EXISTS" ] && [ "$FORCE" = true ]; then
            echo "⚠ ROTATING $NAME. Callers holding the old bearer will get 401; restart nugget-extractor."
          fi

          # openssl, not `tr -dc … | head -c N`: head closing the pipe kills tr with SIGPIPE and
          # the step fails after possibly applying nothing (see the clickhouse-admin note above).
          TOK=$(openssl rand -hex 24)
          [ ${#TOK} -eq 48 ] || { echo "✗ generator produced ${#TOK} chars, refusing"; exit 1; }
          case "$TOK" in *[!0-9a-f]*) echo "✗ generator produced non-hex output, refusing"; exit 1;; esac
          echo "::add-mask::$TOK"

          kubectl create secret generic "$NAME" -n "$NS" \
            --from-literal=token="$TOK" --dry-run=client -o yaml | kubectl apply -f -
          echo "✔ $NAME → namespace/$NS (minted in CI; the value exists nowhere else)"

      # wordops-broker-signing is the RSA private key the wordops-capability-broker signs lease
      # JWTs with. NOBODY should ever know it — CI generates it and it never leaves the cluster.
      # The gateway verifies leases via the broker's PUBLIC JWKS, so only the private half is secret.
      #
      # CREATE-IF-ABSENT with plain rotation: rotating swaps the signing key, so leases signed by
      # the OLD key (all ≤30s TTL) fail verification until they expire and the broker republishes
      # its JWKS — a brief, self-healing window. Restart wordops-capability-broker after a rotation
      # so it loads the new key and serves the new JWKS. Until this Secret exists the broker boots an
      # EPHEMERAL key (deploy marks the secret optional) — fine for dev, but the key then changes on
      # every pod restart, so mint this for stable verification.
      - name: Mint wordops-broker-signing (create-if-absent)
        env:
          ONLY: ${{ inputs.only }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          NAME=wordops-broker-signing NS=socioprophet
          if [ -n "$ONLY" ] && ! printf ',%s,' "$ONLY" | grep -q ",$NAME,"; then
            echo "· skip $NAME (not in 'only' filter)"; exit 0
          fi

          EXISTS=$(kubectl get secret "$NAME" -n "$NS" --ignore-not-found -o name || true)
          FORCE=false
          if printf ',%s,' "$ROTATE" | grep -q ",$NAME,"; then FORCE=true; fi

          if [ -n "$EXISTS" ] && [ "$FORCE" != true ]; then
            echo "✔ $NAME already present in $NS — left untouched (minted secrets are never silently regenerated)"
            exit 0
          fi
          if [ -n "$EXISTS" ] && [ "$FORCE" = true ]; then
            echo "⚠ ROTATING $NAME. Leases signed by the old key (≤30s TTL) fail verification until they"
            echo "⚠ expire; restart wordops-capability-broker so it serves the new JWKS."
          fi

          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          # 2048-bit RSA. `openssl genrsa` emits PKCS#1 or PKCS#8 PEM depending on the openssl
          # version; the broker's loadOrGenerateKey accepts either, so no -traditional needed.
          openssl genrsa -out "$KEY_FILE" 2048
          openssl rsa -in "$KEY_FILE" -noout -check >/dev/null 2>&1 || { echo "✗ generated key failed openssl check"; exit 1; }

          # --from-file keeps the multi-line PEM off the command line and out of any log.
          kubectl create secret generic "$NAME" -n "$NS" \
            --from-file=private.pem="$KEY_FILE" --dry-run=client -o yaml | kubectl apply -f -
          echo "✔ $NAME → namespace/$NS (RSA private key minted in CI; the value exists nowhere else)"
