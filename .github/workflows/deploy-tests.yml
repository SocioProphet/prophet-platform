# Cheap, deterministic, $0 gates for the deploy + proof layer. Keeps the things
# we just proved by hand from silently regressing. No cloud, no GPU.
name: deploy-tests

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'deploy/**'
      - 'apps/eval-fabric-api/**'
      - 'apps/nugget-extractor/**'
      - '.github/workflows/deploy-tests.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'deploy/**'
      - 'apps/eval-fabric-api/**'
      - 'apps/nugget-extractor/**'

jobs:
  # Gate 1: the reusable chart renders for every service's values.
  helm-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Render every service's values
        run: |
          fail=0
          for f in deploy/values/*.yaml; do
            if helm template x charts/socioprophet-service -f "$f" >/dev/null; then
              echo "ok   $(basename "$f")"
            else
              echo "FAIL $(basename "$f")"; fail=1
            fi
          done
          exit $fail

  # Gate 2: the head-to-head runner logic (code extraction, hidden-test grading,
  # arm assembly) — the determinism that protects the live proof + GPU/token spend.
  head-to-head-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/eval-fabric-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt -r requirements-test.txt
      - name: Run head-to-head unit tests
        run: pytest tests/test_head_to_head.py -q

  # Gate 3: the KnowledgeNugget conformance vectors — POSITIVE and NEGATIVE.
  # nugget-extractor's entire claim is "nothing non-conformant reaches the graph", and
  # that claim is only worth what its negative vectors prove: an over-long direct-quote
  # span, a quote the source does not contain, an evidence-free computed/inferred warrant,
  # a missing sourceRef, a warrant outside the closed taxonomy, and the refusal to launder
  # a model-generated nugget into source-warranted status. Cheap, hermetic ($0, no cloud):
  # the sourceos-spec schema is VENDORED and sha256-asserted at import, so this also
  # catches contract drift the moment the vendored copy is edited.
  nugget-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nugget-extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Run KnowledgeNugget conformance + extraction + emitter tests
        run: PYTHONPATH=src pytest tests -q
