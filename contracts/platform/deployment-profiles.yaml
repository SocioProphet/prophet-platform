version: 1
profiles:
  - key: p0-lab
    purpose: local development, replay, seeded evals, fake environment telemetry
  - key: p1-single-site
    purpose: first real single-org operational deployment
  - key: p2-private-mesh
    purpose: multi-site private mesh with central hosted services
  - key: p3-regional
    purpose: regional or federated production posture
  - key: p-edge
    purpose: >-
      on-device edge instance (k3s + TopoLVM flash). Per-person graph resident
      locally; a cloud twin holds canonical. Intermittent link tolerated.
    edge_twin_sync:
      # The edge HellGraph store (RocksDB on TopoLVM) snapshots to the S3-compatible
      # twin on a cadence; only non-private projections cross the link.
      direction: edge_to_twin
      cadence: 30m
      mechanism: volume-snapshot + rclone-to-s3
      privacy: reference_only   # private nodes never egress (ProviderProjection membrane)
channels:
  - dev
  - stage
  - prod
promotion_requirements:
  require_digest: true
  require_provenance: true
  require_sbom: true
  require_signature_state: true
