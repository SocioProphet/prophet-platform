imports:
  - repo: SocioProphet/semantic-serdes
    role: canonical cross-boundary event/context/surface contract layer
    import_mode: mirror_schema_subset
    local_path: contracts/imported/semantic-serdes/
    required_objects:
      - event-envelope.v1
      - surface-projection.v1
      - provenance-bundle.v1
    pin: "73dcafc7c71ed441df2e81c13b76db859b657199"
    validation:
      - jsonschema
      - roundtrip-fixtures

  - repo: SocioProphet/new-hope
    role: carrier and membrane semantics
    import_mode: mirror_schema_subset
    local_path: contracts/imported/new-hope/
    required_objects:
      - carrier.v1
      - ingress-decision.v1
      - membrane-decision.v1
    pin: "57cc29dd30e90c2bd990a0738ac2f9290a2da67b"
    validation:
      - jsonschema
      - membrane-fixtures

  - repo: SocioProphet/memory-mesh
    role: memory runtime API
    import_mode: mirror_api_subset
    local_path: contracts/imported/memory-mesh/
    required_objects:
      - memoryd.openapi.yaml
      - memory-search.request
      - memory-write.request
    pin: "41ba1ff684a1cb8cf6d867b0202118fb3805c6ad"
    validation:
      - openapi-validate
      - client-smoke

  - repo: SocioProphet/slash-topics
    role: governed signed topic scopes — topic-pack + membrane-decision + model-selection semantics
    import_mode: mirror_schema_subset
    local_path: contracts/imported/slash-topics/
    required_objects:
      - specs/SlashTopics_Schema_v0.1.json
      - specs/Membrane_Decision_v0.1.json
      - specs/Membrane_Decision_v0.2.json
      - specs/Model_Selection_Policy_v0.1.json
    pin: "9037a91959706e4cef07d0b55edfea8e9487baf1"
    validation:
      - jsonschema
      - newhope-slashtopics-integration

references:
  - repo: SocioProphet/ontogenesis
    role: semantic governance, SHACL gates, registry
    import_mode: pinned_reference
    local_path: docs/ONTOGENESIS_ALIGNMENT.md
    consumed_assets:
      - registry.ttl
      - registry.jsonld
      - selected-shacl-bundles
    pin: "45d61047678394abd8fe4dbec667e7ab3931be08"
    validation:
      - shacl-gate
      - registry-presence
