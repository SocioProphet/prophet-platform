[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-access-prewalk"
version = "0.1.0"
description = "Graded, receipt-bound access decisions for any Python service on the mesh — never a boolean permission checked in-line"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]
