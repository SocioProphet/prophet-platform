apiVersion: prophet-platform.socioprophet.org/v1alpha1
kind: StandardsLock
metadata:
  name: prophet-platform
  purpose: external-standards-and-seed-lock
spec:
  status: pinned
  policy:
    pinType: commit-sha
    allowBranchPins: false
    requireAdrForProfileChange: true
    requireGeneratedArtifactDiffReview: true
    defaultUpdateMode: manual
  transport:
    normativeProfile:
      standard: tritrpc
      profile: v1
      mode: stable-only
    experimentalProfiles:
      tritrpc-vnext:
        allowed: false
        enableRequires:
          - ADR approval
          - feature flag
          - parity report
          - registry freeze decision
  imports:
    normative_standards:
      tritrpc:
        repo: SocioProphet/TriTRPC
        class: transport-standard
        channel: stable
        pin:
          commit: 7b9dac0b2e027d99a5a530c52765590b931eecca
          tag: null
        consume:
          docs:
            - spec/README-full-spec.md
            - docs/integration_readiness_checklist.md
          runtime_targets:
            - apps/api
            - apps/gateway
            - apps/lampstand
            - apps/agentplane
            - apps/workspace-controller
            - apps/identity-prime
            - apps/hdt-gateway
          generated_artifacts:
            - contracts/transport/
            - tools/tritrpc/
        rules:
          shadowSpecForbidden: true
          localProfileOverridesForbidden: true

      ontogenesis:
        repo: SocioProphet/ontogenesis
        class: ontology-constraints-pack
        channel: controlled
        pin:
          commit: 0a3f7b402d1af21d6699d3fe6a6e657b9882e5af
          tag: null
        consume:
          docs:
            - README.md
          generated_artifacts:
            - contracts/ontology/
            - contracts/policy/
            - docs/generated/ontology/
        rules:
          directRuntimeAuthority: false
          generatedArtifactsMustBeDiffed: true

      semantic-serdes:
        repo: SocioProphet/semantic-serdes
        class: semantic-interop-pack
        channel: controlled
        pin:
          commit: 448576a15848a8a99d8d09d40f87b406ebdbc3cc
          tag: null
        consume:
          docs:
            - README.md
          generated_artifacts:
            - contracts/semantic-serdes/
            - examples/semantic-serdes/
            - tools/validate_semantic_serdes.py
        rules:
          implicitLabelReuseForbidden: true
          parityMatrixRequired: true

      standards-storage:
        repo: SocioProphet/socioprophet-standards-storage
        class: storage-contracts-and-benchmarks
        channel: controlled
        pin:
          commit: 11c9edb33a421f2fbe3377515281f7e964aedc08
          tag: null
        consume:
          docs:
            - README.md
          generated_artifacts:
            - contracts/storage/
            - docs/generated/storage/
            - benchmarks/
        rules:
          benchmarkBudgetRequired: true
          systemOfRecordContractRequired: true

      market-data-runtime-profile:
        repo: SocioProphet/prophet-platform-standards
        class: runtime-profile
        channel: controlled
        pin:
          commit: c4b474d2f2438c3777518e68eb5557adf2e244a5
          tag: null
        consume:
          docs:
            - docs/profiles/market-data-runtime-profile-v0.md
        rules:
          storageAuthorityRemainsExternal: true
          runtimeConformanceRequiredForMarketData: true

      agent-auth-standards:
        repo: SocioProphet/socioprophet-agent-standards
        class: agent-auth-and-identity-profile
        channel: controlled
        pin:
          commit: baed2ca7f9fa07fe1ed9354f9d896fd982c22616
          tag: null
        consume:
          docs:
            - docs/standards/authentication/001-agent-authentication-session-and-recovery-standard.md
            - docs/standards/authentication/002-credential-enrollment-and-authenticator-lifecycle-standard.md
            - docs/standards/authentication/003-enterprise-federation-and-claim-mapping-standard.md
            - docs/standards/authentication/004-workload-and-service-identity-standard.md
            - conformance/CONFORMANCE-CRITERIA-0001.md
          runtime_targets:
            - apps/gateway
            - apps/identity-prime
          generated_artifacts:
            - contracts/identity/
            - docs/generated/identity/
        rules:
          shadowSpecForbidden: true
          localProfileOverridesForbidden: true
          identityRuntimeConformanceRequired: true

      forensic-genesis-edge:
        repo: SocioProphet/prophet-platform-standards
        class: runtime-profile
        channel: controlled
        pin:
          commit: 27be5c63098f443175a1507655ce9b7a094fc134
          tag: null
        consume:
          docs:
            - docs/FORENSIC_GENESIS_EDGE.md
          generated_artifacts:
            - contracts/forensic-genesis/
            - docs/LOCAL-FORENSIC-GENESIS-EDGE.md
            - infra/local/docker-compose.forensic-genesis-edge.yml
        rules:
          runtimeConformanceRequiredForForensicGenesisEdge: true
          standardsRepoRemainsNormative: true

    reference_inputs:
      identity-prime-reference:
        repo: SocioProphet/identity-is-prime-reference
        class: design-reference
        pin:
          commit: f6547fd68d07202a75a30db8b15b5deaeff6a5bd
          tag: null
        consume:
          docs:
            - docs/20_FORMAL_SPEC.md
            - docs/30_ARCHITECTURE_FOG_CITIZEN_CLOUD.md
          generated_artifacts:
            - contracts/identity/
            - contracts/evidence/
            - docs/generated/identity/
        rules:
          directRuntimeImport: false
          codeMayBeCopiedVerbatim: false
          useAsSourceForServiceDesign: true

      hdt-reference:
        repo: SocioProphet/human-digital-twin
        class: design-reference
        pin:
          commit: faee188fbf0e9d853e5c41fe2c06f81dfbf67974
          tag: null
        consume:
          docs:
            - README.md
          generated_artifacts:
            - contracts/export/
            - contracts/capability/
            - docs/generated/hdt/
        rules:
          directRuntimeImport: false
          omegaIsNotIdentity: true
          useAsSourceForGatewayDesign: true

      cairnpath-mesh:
        repo: SocioProphet/cairnpath-mesh
        class: contract-reference
        pin:
          commit: e32545e46e3090711ac33eda027d7d4125f25891
          tag: null
        consume:
          generated_artifacts:
            - contracts/cairnpath/
        rules:
          runtimeService: false

      graphbrain-contract:
        repo: SocioProphet/graphbrain-contract
        class: contract-reference
        pin:
          commit: 6ef13d31a63fda84983998348f140bb887eb36c0
          tag: null
        consume:
          generated_artifacts:
            - contracts/model/
        rules:
          runtimeService: false

    service_seeds:
      lampstand:
        repo: SocioProphet/lampstand
        class: service-seed
        pin:
          commit: 6498266c7d819410bc57bfcf3441edb4d806ca75
          tag: null
        target: apps/lampstand
        rules:
          importAsService: true
          directSubtreeCopyAllowed: false
          mustAdoptTriTRPCv1: true
          mustAdoptPlatformContracts: true

      agentplane:
        repo: SocioProphet/agentplane
        class: service-seed
        pin:
          commit: 2daa7511a51baf3c18bd2a0ac0a5d57e57d404a0
          tag: null
        target: apps/agentplane
        rules:
          importAsService: true
          emitEvidenceReceipts: true
          mustAdoptPlatformContracts: true

      sociosphere:
        repo: SocioProphet/sociosphere
        class: coordination-source
        pin:
          commit: c92df58f0b64cb74c6ecf2623f84e5c5fcf7c185
          tag: null
        target: apps/workspace-controller
        rules:
          wholeRepoImportForbidden: true
          manifestLockRunnerRemainExternal: true
          runtimeSubsetOnly: true

  generated:
    transportContractsDir: contracts/transport
    evidenceContractsDir: contracts/evidence
    identityContractsDir: contracts/identity
    exportContractsDir: contracts/export
    modelContractsDir: contracts/model
    ontologyContractsDir: contracts/ontology
  review:
    requiredOwners:
      - platform
      - security
      - contracts
      - runtime
    checklist:
      - lock pin changed intentionally
      - generated artifacts updated
      - compatibility docs updated
      - e2e smoke test updated
      - ADR added for profile or topology changes

services:
  lampstand:
    classification: local-daemon
    repo: SocioProphet/lampstand
    ref: 6498266c7d819410bc57bfcf3441edb4d806ca75
    notes:
      - upstream source staged under apps/lampstand/vendor/lampstand-src
      - transport remains upstream-managed; platform wrapper stays transport-neutral
