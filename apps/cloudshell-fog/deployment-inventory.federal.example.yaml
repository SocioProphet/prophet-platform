profile: federal
gateway_image:
  repository: ghcr.io/socioprophet/cloudshell-fog
  digest: sha256:REPLACE_WITH_REAL_DIGEST
  fips_profile: true
policy_bundle_path: infra/policy/cloudshell-fog/kyverno
secrets:
  - name: cloudshell-fog-secrets
    required_keys:
      - session-token-signing-key
    source: REPLACE_WITH_SECRET_MANAGER_OR_EXTERNAL_SECRET
federal_controls:
  minimum_trust_tier: attested_fog
  require_fips_validated_crypto: true
  # The named FIPS-validated crypto module per runtime — the warrant behind the flag above.
  # Enforced against security/fips-boundary.yaml's allowlist by check_fips_conformance.py.
  fips_crypto_modules:
    python: openssl-3-fips-provider
    node: openssl-3-fips-provider
    rust: aws-lc-rs
  strict_egress: true
