[project]
name = "node-commander"
version = "0.1.0"
description = "Bootstrap runtime starter for the local-first SourceOS / SociOS control-node lane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
