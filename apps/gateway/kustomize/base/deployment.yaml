apiVersion: apps/v1
kind: Deployment
metadata:
  name: socioprophet-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: socioprophet-gateway
  template:
    metadata:
      labels:
        app: socioprophet-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/SocioProphet/socioprophet-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: TRITRPC_TARGET_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: TRITRPC_TARGET_ADDR
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: GATEWAY_PORT
            - name: TRITRPC_ALLOW_INSECURE_DEV_KEY
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: TRITRPC_ALLOW_INSECURE_DEV_KEY
            - name: TRITRPC_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: tritrpc-shared-key
                  key: TRITRPC_KEY_HEX
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
