[project]
name = "prophet-agora"
version = "0.1.0"
description = "Agora — the sovereign work + knowledge plane (Jira/Confluence killer): work items + wiki pages as proof-carrying HellGraph facts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
