[project]
name = "prophet-lattice-studio"
version = "0.1.0"
description = "Governed notebook/session workbench surface for Prophet Lattice + the Studio BFF."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "rdflib>=7.0.0",
]

[project.scripts]
lattice-studio = "lattice_studio.cli:main"
lattice-model-zoo = "lattice_studio.model_zoo_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
