apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hellgraph-superpeer-baseline
  labels:
    bundle: graph.twin
spec:
  podSelector:
    matchLabels:
      app: hellgraph-superpeer
  policyTypes: [Ingress]
  ingress:
    # Only same-namespace consumers may query the twin's read view.
    - from:
        - podSelector: {}
      ports:
        - port: 8850
          protocol: TCP
