# Bearer secret that arms auth on the super-peer's sensitive routes (/health /cut /query /admit).
# Example ExternalSecret — pulls the token from the cluster's secret store; do NOT commit a real
# value. Copy to a non-.example file, set the store ref + remote key, and apply (or wire into an
# overlay). It materializes the k8s Secret `hellgraph-superpeer-auth` (key `auth-secret`) that the
# Deployment's HELLGRAPH_AUTH_SECRET env consumes.
#
# This is deliberately NOT in base/kustomization.yaml: until the operator provisions it the Secret
# is absent, so the pod fails to start rather than silently running OPEN — fail-closed by default.
#
# Generate a token: `openssl rand -hex 32` and store it in your secrets backend under the property
# below. Rotate by updating the backend; ESO refreshes and the Deployment picks it up on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hellgraph-superpeer-auth
  namespace: socioprophet
  labels:
    app: hellgraph-superpeer
    bundle: graph.twin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: REPLACE_WITH_SECRET_STORE
  target:
    name: hellgraph-superpeer-auth
    creationPolicy: Owner
  data:
    - secretKey: auth-secret
      remoteRef:
        key: REPLACE_WITH_REMOTE_KEY_PATH
        property: hellgraph_superpeer_auth_secret
