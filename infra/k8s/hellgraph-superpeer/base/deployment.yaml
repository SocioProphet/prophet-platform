apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellgraph-superpeer
  labels:
    app: hellgraph-superpeer
    bundle: graph.twin
  annotations:
    # This runs in the CLOUD-TWIN cluster. It is a read-replica of the edge's sovereign graph:
    # it bootstraps from the edge federation base key, replicates the edge's Hypercore log, and
    # serves the causally-merged view. A Deployment (not a StatefulSet) with rebuildable storage
    # makes the "twin is a disposable index, never a second writer" property structural — it is
    # never admitted as a writer, so it cannot forge/rewrite and there is no split-brain.
    mount-intent.socioprophet.io/storage: derived_index
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellgraph-superpeer
  template:
    metadata:
      annotations:
        # /metrics is public (returns before the auth gate) and network-restricted to this
        # namespace by the baseline NetworkPolicy — safe for in-cluster Prometheus scraping.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8850"
        prometheus.io/path: /metrics
      labels:
        app: hellgraph-superpeer
        bundle: graph.twin
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: superpeer
          # The mode-aware hellgraph-service image (apps/hellgraph-service, vendoring
          # @socioprophet/hellgraph 0.4.4 — the hardened engine: bearer auth, public /livez +
          # /metrics, and the epoch-1..3 parser/DoS hardening). HELLGRAPH_MODE=superpeer selects
          # the federation replica role over the default local service — one image, two roles.
          # No command override needed. (Image name is kept in step with the edge StatefulSet; the
          # ghcr↔GAR hellgraph-service naming reconciliation is a separate infra follow-up.)
          image: ghcr.io/socioprophet/hellgraph:latest
          ports:
            - name: http
              containerPort: 8850
          env:
            - name: HELLGRAPH_MODE
              value: "superpeer"
            - name: HELLGRAPH_HTTP_PORT
              value: "8850"
            - name: HELLGRAPH_STORAGE_DIR
              value: "/var/lib/hellgraph-superpeer"
            # The edge federation base key — the twin joins THIS federation as a replica.
            - name: HELLGRAPH_BOOTSTRAP_KEY
              valueFrom:
                configMapKeyRef:
                  name: hellgraph-federation
                  key: base-key
            # Bearer secret that arms auth on the sensitive routes (/health /cut /query /admit).
            # Unset → the engine warns and runs OPEN; set here so the twin is authenticated from
            # day one. /livez + /metrics stay public (they return before the auth gate), so the
            # probes and Prometheus below keep working.
            - name: HELLGRAPH_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellgraph-superpeer-auth
                  key: auth-secret
          # Probes hit the PUBLIC /livez (not /health): with auth armed, /health requires the
          # 'read' scope and would 401 the kubelet. /livez is unauthenticated by design.
          readinessProbe:
            httpGet: { path: /livez, port: 8850 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8850 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: replica-store
              mountPath: /var/lib/hellgraph-superpeer
      volumes:
        # Rebuildable: the replica re-derives from the edge's log via the federation on restart —
        # nothing here is a source of truth (mount-intent: derived_index, never egressed).
        - name: replica-store
          emptyDir: {}
