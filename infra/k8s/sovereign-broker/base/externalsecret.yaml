# ESO ExternalSecret for the broker signing key and registered OIDC clients.
# Signing key: generated once with `openssl genpkey -algorithm ed25519 -outform PEM -out ed25519.key`
# and stored in your secrets backend.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sovereign-broker-signing-key
  namespace: socioprophet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: REPLACE_WITH_SECRET_STORE
  target:
    name: sovereign-broker-signing-key
    creationPolicy: Owner
  data:
    - secretKey: ed25519.key
      remoteRef:
        key: REPLACE_WITH_REMOTE_KEY_PATH
        property: ed25519_pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sovereign-broker-clients
  namespace: socioprophet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: REPLACE_WITH_SECRET_STORE
  target:
    name: sovereign-broker-clients
    creationPolicy: Owner
  data:
    - secretKey: BROKER_CLIENTS
      remoteRef:
        key: REPLACE_WITH_REMOTE_KEY_PATH
        property: broker_clients_json
