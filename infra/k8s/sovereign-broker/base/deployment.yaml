apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-broker
  labels:
    app.kubernetes.io/name: sovereign-broker
    app.kubernetes.io/part-of: prophet-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-broker
        app.kubernetes.io/part-of: prophet-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: ghcr.io/socioprophet/prophet-platform/workspace-broker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
          env:
            - name: PORT
              value: "8089"
            - name: BROKER_ISS
              value: "https://id.workspace.socioprophet.ai"
            - name: BROKER_APP_NAME
              value: "Prophet Workspace"
            - name: BROKER_TOKEN_TTL
              value: "3600"
            - name: BROKER_REQUIRE_KEY
              value: "1"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: sovereign-broker-clients
                optional: false
          volumeMounts:
            - name: signing-key
              mountPath: /etc/broker/signing
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: signing-key
          secret:
            secretName: sovereign-broker-signing-key
