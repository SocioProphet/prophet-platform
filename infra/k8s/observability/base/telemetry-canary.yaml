# Telemetry canary — continuously emits a heartbeat log so Loki ALWAYS has a
# known-live stream. With a guaranteed baseline, "Loki ingestion == 0" provably
# means the pipeline is broken, not just a quiet cluster. This operationalizes
# the estate's never-fired=suspect rule: the control has a guaranteed input, so
# silence == failure (see telemetry-liveness.yaml, alert LokiNotIngestingLogs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-canary
  namespace: observability
  labels:
    app.kubernetes.io/name: telemetry-canary
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-canary
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - name: canary
          image: busybox:1.36
          command: [/bin/sh, -c]
          args:
            - |
              while true; do
                echo "{\"level\":\"info\",\"logger\":\"telemetry-canary\",\"msg\":\"heartbeat\",\"ts\":\"$(date -u +%FT%TZ)\"}"
                sleep 15
              done
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 20m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
