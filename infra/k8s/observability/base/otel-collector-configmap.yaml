apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app: otel-collector
    bundle: observability
data:
  config.yaml: |
    # The estate's telemetry front door: OTLP in (the reasoning-evidence /
    # WorkspaceActionReceipt emitters already speak OTLP), fanned out to the three
    # backends installed by the observability Argo apps — metrics→Prometheus,
    # traces→Tempo, logs→Loki. This is the metric source Argo Rollouts (canary
    # analysis) and Chaos Mesh (steady-state) consume.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resourcedetection:
        detectors: [env, system]
        timeout: 5s
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      # Scraped by Prometheus via the ServiceMonitor (port 8889).
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlphttp/loki]
