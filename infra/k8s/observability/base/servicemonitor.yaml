# ServiceMonitors — Prometheus Operator scrapes these targets. Requires the
# kube-prometheus-stack CRDs (installed by the observability Argo app at an
# earlier sync-wave).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    bundle: observability
    release: kube-prometheus-stack   # picked up by the stack's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
    - port: metrics
      interval: 15s

# REMOVED (2026-07-30): the `hellgraph` ServiceMonitor. It was inert twice over.
#
#   1. Its selector was `app: hellgraph`. No Service in the estate carries that
#      label — the Service is named hellgraph-service and the chart labels it
#      app.kubernetes.io/{name,instance}. `kubectl get svc -A -l app=hellgraph`
#      returns nothing, so the Operator generated no scrape target at all: the
#      job never appeared in Prometheus, and no target ever showed as failing.
#   2. Even had it matched, hellgraph-service has no /metrics route. Probed
#      in-cluster: `GET http://hellgraph-service:8090/metrics` -> HTTP 404. Its
#      package.json has no prometheus module despite the README claiming one.
#
# Restoring it means giving hellgraph-service a real /metrics endpoint first.
# Until then a ServiceMonitor here is a control that reports configured and
# collects nothing — the failure this whole change is about. The HellGraphDown
# alert now reads kube-state-metrics instead (see prometheusrule-slos.yaml).
