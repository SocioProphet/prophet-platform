apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
labels:
  - includeSelectors: false
    pairs:
      app: deploy-health-alerter
      app.kubernetes.io/part-of: platform-ops
resources:
  - rbac.yaml
  - cronjob.yaml
  - prometheusrule.yaml

# Generated, not hand-written (same reasoning as pvc-capacity-guard): the generator's name
# hash changes the CronJob pod spec whenever the script changes, so an edit to the alerter
# shows up in ArgoCD as a diff on the workload rather than a silent ConfigMap mutation.
#
# NOTE: deploy_health_alert.py here is a MIRROR of tools/deploy_health_alert.py (kustomize's
# default load-restrictor forbids a base from reading files outside its own directory, so it
# cannot point at tools/). The two are kept byte-identical by tools/verify_cronjob_script_mirrors.py,
# wired into `make validate` — a drifted mirror fails the build.
configMapGenerator:
  - name: deploy-health-alerter
    files:
      - deploy_health_alert.py
