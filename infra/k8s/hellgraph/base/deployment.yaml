apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellgraph
  labels:
    app: hellgraph
    bundle: graph.kernel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellgraph
  template:
    metadata:
      labels:
        app: hellgraph
        bundle: graph.kernel
    spec:
      containers:
        - name: hellgraph
          image: ghcr.io/socioprophet/hellgraph:latest
          ports:
            - name: http
              containerPort: 8850
          env:
            - name: PORT
              value: "8850"
            - name: LOG_LEVEL
              value: "info"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8850
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8850
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
