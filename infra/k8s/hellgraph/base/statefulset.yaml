apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hellgraph
  labels:
    app: hellgraph
    bundle: graph.kernel
spec:
  # Headless service below gives stable network identity; a StatefulSet (not a
  # Deployment) so the RocksDB store survives reschedule — the graph is now a
  # managed, durable service, not an ephemeral kernel.
  serviceName: hellgraph
  replicas: 1
  selector:
    matchLabels:
      app: hellgraph
  template:
    metadata:
      labels:
        app: hellgraph
        bundle: graph.kernel
    spec:
      containers:
        - name: hellgraph
          image: ghcr.io/socioprophet/hellgraph:latest
          ports:
            - name: http
              containerPort: 8850
          env:
            - name: PORT
              value: "8850"
            - name: LOG_LEVEL
              value: "info"
            # RocksDB durable AtomSpace lives on the mounted PVC (see volumeMount).
            - name: HELLGRAPH_STORE_DIR
              value: "/var/lib/hellgraph"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8850
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8850
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: hellgraph-store
              mountPath: /var/lib/hellgraph
  volumeClaimTemplates:
    - metadata:
        name: hellgraph-store
      spec:
        accessModes:
          - ReadWriteOnce
        # storageClassName omitted → cluster default (works in p0-lab). The edge
        # overlay patches this to topolvm-provisioner to bind local NVMe/flash.
        resources:
          requests:
            storage: 10Gi
