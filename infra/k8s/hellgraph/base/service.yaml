apiVersion: v1
kind: Service
metadata:
  name: hellgraph
  labels:
    app: hellgraph
    bundle: graph.kernel
spec:
  selector:
    app: hellgraph
  clusterIP: None  # headless — StatefulSet stable DNS (consumers hit hellgraph:8850)
  ports:
    - name: http
      port: 8850
      targetPort: 8850
