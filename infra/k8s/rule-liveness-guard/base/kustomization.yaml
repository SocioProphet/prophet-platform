apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - cronjob.yaml
  - prometheusrule-guard.yaml

configMapGenerator:
  - name: rule-liveness-guard
    files:
      - guard.py
      - policy.json

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      bundle: observability
