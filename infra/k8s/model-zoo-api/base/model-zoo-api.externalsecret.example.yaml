# External Secrets Operator — preferred over manual bootstrap.
# Copy to model-zoo-api.externalsecret.yaml, fill in secretStoreRef + remoteRef, then apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-zoo-api-credentials
  namespace: socioprophet
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: REPLACE_WITH_SECRET_STORE
  target:
    name: model-zoo-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: promotion-gate
      remoteRef:
        key: REPLACE_WITH_REMOTE_SECRET_KEY
