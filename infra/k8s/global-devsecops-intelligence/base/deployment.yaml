apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-devsecops-intelligence
  labels:
    app: global-devsecops-intelligence
    app.kubernetes.io/name: global-devsecops-intelligence
    bundle: intelligence.devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: global-devsecops-intelligence
  template:
    metadata:
      labels:
        app: global-devsecops-intelligence
        # NetworkPolicy's podSelector matches app.kubernetes.io/name, not app — without this label
        # the policy silently selects zero pods and enforces nothing (same root cause found and fixed
        # for acquire-worker/noetica-agent-machine; this is the repo-wide follow-up audit).
        app.kubernetes.io/name: global-devsecops-intelligence
        bundle: intelligence.devsecops
    spec:
      serviceAccountName: gdi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: global-devsecops-intelligence
          # pinned sha published by the GDI repo's own build CI (no :latest)
          image: ghcr.io/socioprophet/global-devsecops-intelligence:sha-REPLACE_ON_FIRST_BUILD
          ports:
            - name: http
              containerPort: 8840
          env:
            - name: PORT
              value: "8840"
            - name: SHERLOCK_URL
              value: "http://sherlock-search:8810"
            - name: MODEL_ROUTER_URL
              value: "http://model-router:8710"
            # --- mesh consumer: closes the intelligence feedback loop ---
            - name: MESH_BOOTSTRAP
              value: "kafka.eventbus.svc.cluster.local:9092"
            - name: MESH_TOPICS_CONSUME
              value: "telemetry.logs,telemetry.metrics,telemetry.traces,intel.verdicts"
            - name: MESH_TOPICS_PRODUCE
              value: "ops.findings,ops.actions"
            - name: HOLMES_URL
              value: "http://holmes:8091"
            - name: SYNAPSEIQ_URL
              value: "http://synapseiq-reasoning-api:8092"
            # membrane gate: no /ops/* production without a MembraneDecision (C1/C9)
            - name: MEMBRANE_URL
              value: "http://sovereign-broker:8080/membrane"
            # RCA-claim EventEnvelope contract every /ops/* event MUST satisfy (C4/C7)
            - name: RCA_CLAIM_SCHEMA
              value: "https://socioprophet.org/contracts/workroom/workroom-rca-claim.v0.1.json"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8840
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8840
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
