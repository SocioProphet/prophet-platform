apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattice-forge
  labels:
    app: lattice-forge
    bundle: runtime.forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lattice-forge
  template:
    metadata:
      labels:
        app: lattice-forge
        bundle: runtime.forge
    spec:
      containers:
        - name: lattice-forge
          image: ghcr.io/socioprophet/lattice-forge:latest
          ports:
            - name: http
              containerPort: 8870
          env:
            - name: PORT
              value: "8870"
            - name: TRITFABRIC_URL
              value: "http://tritfabric:8750"
            - name: GOVERNANCE_LEDGER_URL
              value: "http://model-governance-ledger:8760"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8870
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8870
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
