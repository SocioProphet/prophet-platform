apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapseiq-control-plane
  labels:
    app: synapseiq-control-plane
    bundle: enrichment.control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapseiq-control-plane
  template:
    metadata:
      labels:
        app: synapseiq-control-plane
        bundle: enrichment.control
    spec:
      containers:
        - name: synapseiq-control-plane
          image: ghcr.io/socioprophet/synapseiq/control-plane:latest
          ports:
            - name: http
              containerPort: 8800
          env:
            - name: PORT
              value: "8800"
            - name: MODEL_ROUTER_URL
              value: "http://model-router:8710"
            - name: MEMORYD_URL
              value: "http://memoryd:8787"
            - name: MEMORYD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mesh-memoryd-credentials
                  key: api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8800
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8800
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
