# Gateway API — the traffic-splitting substrate for traffic-shaped canaries (Argo Rollouts
# drives HTTPRoute weights instead of replica weights, via the argoproj-labs/gatewayAPI
# plugin — see deploy/argocd/progressive-delivery-services.yaml; there is no plugin-free
# native support for this in Argo Rollouts as of v1.9.1, confirmed against the project's own
# docs source).
#
# gatewayClassName: gke-l7-rilb (2026-07-31, was `cilium` — dropped; this cluster has no
# separate Cilium Helm install and no CiliumNetworkPolicy CRD, only GKE's native Gateway API
# implementation). Confirmed via `kubectl get gatewayclass` against the live cluster:
# gke-l7-rilb/-gxlb/-regional-external-managed/-global-external-managed all exist.
# gke-l7-rilb (regional INTERNAL LB) chosen to match this Gateway's `allowedRoutes: from:
# Same` intent (in-namespace only, no internet exposure) — NOT a lightweight in-cluster
# proxy the way Cilium's own Gateway controller would have been: GKE's Gateway controller
# provisions a REAL regional internal Google Cloud load balancer for this. That's a cost +
# behavior difference from the original Cilium design worth a second look before this ships
# broadly (fine for a single pilot service; reconsider if many services adopt this pattern).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: socioprophet-gateway
  namespace: socioprophet
spec:
  gatewayClassName: gke-l7-rilb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hellgraph-service
  namespace: socioprophet
spec:
  parentRefs:
    - name: socioprophet-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /graph
      # Two backendRefs (NOT the single Service the chart renders by default) — the
      # argo-rollouts Gateway API plugin (see deploy/values/hellgraph-service.yaml's
      # rollout.trafficRouting block) patches these weights during a traffic-shaped
      # canary. Names must match rollout.trafficRouting.{canary,stable}ServiceSuffix
      # in charts/socioprophet-service (rollout-services.yaml renders both). Starts
      # 0/100 (all traffic on stable) until a canary rollout is in flight.
      # Port 8090 — matches deploy/values/hellgraph-service.yaml's service.port
      # (was 8080 here; that was stale relative to the Service it targets).
      backendRefs:
        - name: hellgraph-service-canary
          port: 8090
          weight: 0
        - name: hellgraph-service-stable
          port: 8090
          weight: 100
