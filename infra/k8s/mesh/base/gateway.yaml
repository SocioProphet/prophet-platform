# Gateway API (served by Cilium's Gateway controller) — the north-south entry
# and the traffic-splitting substrate for traffic-shaped canaries (Argo Rollouts
# can drive HTTPRoute weights instead of replica weights). Requires the Gateway
# API CRDs + Cilium gatewayAPI.enabled=true.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: socioprophet-gateway
  namespace: socioprophet
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hellgraph-service
  namespace: socioprophet
spec:
  parentRefs:
    - name: socioprophet-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /graph
      # Argo Rollouts rewrites these weights during a traffic-shaped canary
      # (stable vs canary Service). Starts 100/0.
      backendRefs:
        - name: hellgraph-service
          port: 8080
          weight: 100
