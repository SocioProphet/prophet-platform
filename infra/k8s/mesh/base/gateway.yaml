# Gateway API (served by Cilium's Gateway controller) — the north-south entry
# and the traffic-splitting substrate for traffic-shaped canaries (Argo Rollouts
# can drive HTTPRoute weights instead of replica weights). Requires the Gateway
# API CRDs + Cilium gatewayAPI.enabled=true.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: socioprophet-gateway
  namespace: socioprophet
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hellgraph-service
  namespace: socioprophet
spec:
  parentRefs:
    - name: socioprophet-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /graph
      # Two backendRefs (NOT the single Service the chart renders by default) — the
      # argo-rollouts Gateway API plugin (see deploy/values/hellgraph-service.yaml's
      # rollout.trafficRouting block) patches these weights during a traffic-shaped
      # canary. Names must match rollout.trafficRouting.{canary,stable}ServiceSuffix
      # in charts/socioprophet-service (rollout-services.yaml renders both). Starts
      # 0/100 (all traffic on stable) until a canary rollout is in flight.
      # Port 8090 — matches deploy/values/hellgraph-service.yaml's service.port
      # (was 8080 here; that was stale relative to the Service it targets).
      backendRefs:
        - name: hellgraph-service-canary
          port: 8090
          weight: 0
        - name: hellgraph-service-stable
          port: 8090
          weight: 100
