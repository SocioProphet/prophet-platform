# Baseline zero-trust for the graph spine: hellgraph-service accepts traffic only from
# same-namespace workloads plus the Prometheus scraper, and is reachable on its service
# port. A targeted allow (not a blanket default-deny, which would need per-service audit
# first).
#
# Converted from CiliumNetworkPolicy (2026-07-31, explore/rollouts-hellgraph-pilot):
# confirmed live (`kubectl get crd`) that `ciliumnetworkpolicies.cilium.io` is NOT
# registered on this cluster — GKE Autopilot's Dataplane V2 exposes only its own internal
# Cilium bookkeeping CRDs (ciliumendpoints/ciliumidentities/ciliumnodes/
# ciliumlocalredirectpolicies), never the user-facing CiliumNetworkPolicy CRD. A native
# networking.k8s.io/v1 NetworkPolicy is fully enforced by Dataplane V2 without it.
#
# ALSO FIXED here: the original selector (`app: hellgraph`, port 8850) targeted a different,
# legacy resource entirely — infra/k8s/hellgraph/base's StatefulSet, not the chart-deployed
# hellgraph-service Deployment/Rollout this policy is named after (app.kubernetes.io/name:
# hellgraph-service via charts/socioprophet-service, port 8090). As written it would have
# silently protected the wrong workload and left the live one with no policy at all — this
# only surfaced now that infra/k8s/mesh/base is actually wired into deploy/argocd (see
# deploy/argocd/progressive-delivery-services.yaml) and applies for real.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hellgraph-allow
  namespace: socioprophet
spec:
  podSelector:
    matchLabels:
      app: hellgraph-service
  policyTypes:
    - Ingress
  ingress:
    # Same-namespace consumers (memory-mesh runtime, regis-entity-graph, etc.).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: socioprophet
      ports:
        - port: 8090
          protocol: TCP
    # Prometheus scrape from the observability namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8090
          protocol: TCP
