apiVersion: apps/v1
kind: Deployment
metadata:
  name: tritfabric
  labels:
    app: tritfabric
    bundle: mesh.ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tritfabric
  template:
    metadata:
      labels:
        app: tritfabric
        bundle: mesh.ml
    spec:
      containers:
        - name: tritfabric
          image: ghcr.io/socioprophet/tritfabric:latest
          ports:
            - name: http
              containerPort: 8750
            - name: metrics
              containerPort: 9108
          env:
            - name: PORT
              value: "8750"
            - name: METRICS_PORT
              value: "9108"
            - name: GOVERNANCE_LEDGER_URL
              value: "http://model-governance-ledger:8760"
            - name: POLICY_OPT_IN_REQUIRED
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8750
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8750
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

