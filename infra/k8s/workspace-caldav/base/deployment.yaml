apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-caldav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-caldav
  template:
    metadata:
      labels:
        app: workspace-caldav
    spec:
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: radicale
          image: registry.socioprophet.ai/workspace-caldav:sha-8f1bb2f5d6d4d9577113887bbfb79ce8305782b3
          ports:
            - name: caldav
              containerPort: 5232
          volumeMounts:
            - name: collections
              mountPath: /var/lib/radicale/collections
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /.well-known/caldav
              port: 5232
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/caldav
              port: 5232
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: collections
          persistentVolumeClaim:
            claimName: workspace-caldav-pvc
        - name: config
          configMap:
            name: workspace-caldav-config
