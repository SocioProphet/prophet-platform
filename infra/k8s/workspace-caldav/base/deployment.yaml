apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-caldav
spec:
  replicas: 1
  # RWO PVC + single replica: Recreate terminates the old pod before starting the new one,
  # so the volume is released first. RollingUpdate deadlocks (new pod can't Multi-Attach the
  # ReadWriteOnce volume held by the old pod on another node) — which wedged this exact deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workspace-caldav
  template:
    metadata:
      labels:
        app: workspace-caldav
        # NetworkPolicy's podSelector matches app.kubernetes.io/name, not app — without this label
        # the policy silently selects zero pods and enforces nothing (same root cause found and fixed
        # for acquire-worker/noetica-agent-machine; this is the repo-wide follow-up audit).
        app.kubernetes.io/name: workspace-caldav
    spec:
      # radicale runs non-root, uid/gid 999 — VERIFIED via `id` in the live pod, NOT 1000 (a prior
      # revision guessed 1000; that only works by accident via a supplementary group). Its PVC mounts
      # root-owned, so WITHOUT fsGroup it gets "Permission denied" writing /var/lib/radicale/collections
      # — CalDAV silently fails to persist while /healthz stays green (the gitea-class trap Kyverno
      # require-fsgroup-for-pvc-writers flags). fsGroup: 999 chowns the volume to radicale's actual
      # primary group; OnRootMismatch does it only when the root dir is wrong, not every mount.
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: radicale
          image: registry.socioprophet.ai/workspace-caldav:sha-8f1bb2f5d6d4d9577113887bbfb79ce8305782b3
          ports:
            - name: caldav
              containerPort: 5232
          volumeMounts:
            - name: collections
              mountPath: /var/lib/radicale/collections
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /.well-known/caldav
              port: 5232
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/caldav
              port: 5232
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: collections
          persistentVolumeClaim:
            claimName: workspace-caldav-pvc
        - name: config
          configMap:
            name: workspace-caldav-config
