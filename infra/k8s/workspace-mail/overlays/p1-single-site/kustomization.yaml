apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: workspace-mail
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/socioprophet/prophet-platform/workspace-mail:latest
  - target:
      kind: Deployment
      name: workspace-smtp
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
