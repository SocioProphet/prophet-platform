apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-mail
spec:
  replicas: 1
  # RWO PVC + single replica: Recreate terminates the old pod before starting the new one,
  # so the volume is released first. RollingUpdate deadlocks (new pod can't Multi-Attach the
  # ReadWriteOnce volume held by the old pod on another node) — which wedged this exact deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workspace-mail
  template:
    metadata:
      labels:
        app: workspace-mail
        # NetworkPolicy's podSelector matches app.kubernetes.io/name, not app — without this label
        # the policy silently selects zero pods and enforces nothing (same root cause found and fixed
        # for acquire-worker/noetica-agent-machine; this is the repo-wide follow-up audit).
        app.kubernetes.io/name: workspace-mail
    spec:
      # dovecot runs as ROOT — verified via `id` in the live pod, and it MUST: it binds privileged
      # ports (imap 143, imaps 993, lmtp 24 — all < 1024) and its master process setuids per-user for
      # mail delivery. Do NOT "harden" it to non-root: that reintroduces the exact bind/permission
      # failures (the mail analogue of the gitea crashloop, in reverse). fsGroup: 1000 is kept anyway —
      # it satisfies kyverno require-fsgroup-for-pvc-writers AND is forward-compatible (a future
      # non-root gid 1000 would already own the maildir), unlike fsGroup: 0 which would be a landmine.
      # Root here is intentional, not an oversight.
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: dovecot
          image: registry.socioprophet.ai/workspace-mail:sha-8f1bb2f5d6d4d9577113887bbfb79ce8305782b3
          ports:
            - name: imap
              containerPort: 143
            - name: imaps
              containerPort: 993
            - name: lmtp
              containerPort: 24
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: prophet_platform
            # postgres-credentials never existed → CreateContainerConfigError. Reference the real cluster
            # secret (postgres-admin, key: password) and the literal superuser that the postgres StatefulSet
            # itself uses (POSTGRES_USER=postgres). TODO: give mail a dedicated, least-privilege DB role.
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
          volumeMounts:
            - name: mailstore
              mountPath: /var/mail/vhosts
            - name: config
              mountPath: /etc/dovecot/dovecot.conf
              subPath: dovecot.conf
          readinessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: mailstore
          persistentVolumeClaim:
            claimName: workspace-mail-pvc
        - name: config
          configMap:
            name: workspace-mail-config
