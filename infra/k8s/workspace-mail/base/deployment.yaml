apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-mail
  template:
    metadata:
      labels:
        app: workspace-mail
    spec:
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: dovecot
          image: registry.socioprophet.ai/workspace-mail:sha-8f1bb2f5d6d4d9577113887bbfb79ce8305782b3
          ports:
            - name: imap
              containerPort: 143
            - name: imaps
              containerPort: 993
            - name: lmtp
              containerPort: 24
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: prophet_platform
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: mailstore
              mountPath: /var/mail/vhosts
            - name: config
              mountPath: /etc/dovecot/dovecot.conf
              subPath: dovecot.conf
          readinessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: mailstore
          persistentVolumeClaim:
            claimName: workspace-mail-pvc
        - name: config
          configMap:
            name: workspace-mail-config
