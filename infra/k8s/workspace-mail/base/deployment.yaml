apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-mail
spec:
  replicas: 1
  # RWO PVC + single replica: Recreate terminates the old pod before starting the new one,
  # so the volume is released first. RollingUpdate deadlocks (new pod can't Multi-Attach the
  # ReadWriteOnce volume held by the old pod on another node) — which wedged this exact deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workspace-mail
  template:
    metadata:
      labels:
        app: workspace-mail
    spec:
      # dovecot/mail writes its maildir on the mounted PVC; fsGroup makes the volume group-writable
      # (via supplementary group) so the non-root container can write it (kyverno require-fsgroup-pvc).
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: dovecot
          image: registry.socioprophet.ai/workspace-mail:sha-8f1bb2f5d6d4d9577113887bbfb79ce8305782b3
          ports:
            - name: imap
              containerPort: 143
            - name: imaps
              containerPort: 993
            - name: lmtp
              containerPort: 24
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: prophet_platform
            # postgres-credentials never existed → CreateContainerConfigError. Reference the real cluster
            # secret (postgres-admin, key: password) and the literal superuser that the postgres StatefulSet
            # itself uses (POSTGRES_USER=postgres). TODO: give mail a dedicated, least-privilege DB role.
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
          volumeMounts:
            - name: mailstore
              mountPath: /var/mail/vhosts
            - name: config
              mountPath: /etc/dovecot/dovecot.conf
              subPath: dovecot.conf
          readinessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: mailstore
          persistentVolumeClaim:
            claimName: workspace-mail-pvc
        - name: config
          configMap:
            name: workspace-mail-config
