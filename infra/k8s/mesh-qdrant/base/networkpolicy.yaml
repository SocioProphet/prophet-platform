apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesh-qdrant-baseline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mesh-qdrant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: socioprophet
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: socioprophet
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6334
