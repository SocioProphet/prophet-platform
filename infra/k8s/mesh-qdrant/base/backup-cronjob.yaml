apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-snapshot
spec:
  schedule: "0 2 * * *"   # daily 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: qdrant-snapshot
              image: curlimages/curl:8.6.0
              env:
                # Retention: keep the newest N snapshots per collection; older ones are
                # DELETEd each run (see the pruning block below). Snapshots are full copies
                # living on the same volume they back up, so unbounded accumulation would
                # eventually take out the thing it is backing up.
                - name: RETAIN
                  value: "7"
              args:
                - /bin/sh
                - -c
                - |
                  set -e
                  # Two real bugs caught before first deploy: this pointed at a service
                  # named "qdrant" (the actual headless Service is "mesh-qdrant" -- see
                  # service.yaml) and piped to jq, which curlimages/curl:8.6.0 does not
                  # ship (verified directly against this exact image). Both would have
                  # failed this job silently, forever, on every scheduled run.
                  # grep/sed instead of jq: stays on the same minimal, already-reviewed
                  # image rather than adding a dependency for one field extraction.
                  #
                  # Copilot review on #1207: under plain /bin/sh (dash; no bash pipefail),
                  # `set -e` only sees a PIPELINE's LAST command's exit status -- so a
                  # failed curl here piped into grep/sed would still exit 0 (sed always
                  # succeeds on empty input), COLLECTIONS would end up empty, the for-loop
                  # would run zero times, and the job would print success having created
                  # ZERO snapshots. Capture curl's own exit status explicitly, outside the
                  # pipeline, so an unreachable mesh-qdrant fails this job loudly instead.
                  RESPONSE=$(curl -sf http://mesh-qdrant:6333/collections) || {
                    echo "ERROR: could not reach mesh-qdrant to list collections" >&2
                    exit 1
                  }
                  COLLECTIONS=$(echo "$RESPONSE" | grep -o '"name":"[^"]*"' | sed 's/"name":"//;s/"$//')
                  if [ -z "$COLLECTIONS" ]; then
                    echo "No collections exist yet -- nothing to snapshot (this is a legitimate empty state, not a fetch failure)"
                  else
                    for col in $COLLECTIONS; do
                      echo "Snapshotting collection: $col"
                      # Not piped -- set -e already catches a bare failing command like this.
                      curl -sf -X POST "http://mesh-qdrant:6333/collections/${col}/snapshots"

                      # Retention (salvaged from #1114): main's #1207 only ever POSTed -- it
                      # never called DELETE /collections/{c}/snapshots/{s}, so snapshots would
                      # accumulate forever. Keep the newest $RETAIN, delete the rest. Reuse the
                      # same no-jq grep/sed extraction as the collections list above; snapshot
                      # names carry a timestamp and sort chronologically, so the oldest sort
                      # first. Pruning is best-effort: a failed listing or DELETE is logged and
                      # skipped, never fatal -- creating a snapshot matters more than reclaiming
                      # the old one, and the snapshot above already succeeded.
                      SNAPS=$(curl -sf "http://mesh-qdrant:6333/collections/${col}/snapshots" | grep -o '"name":"[^"]*"' | sed 's/"name":"//;s/"$//' || true)
                      TOTAL=$(printf '%s\n' "$SNAPS" | grep -c . || true)
                      if [ "$TOTAL" -gt "$RETAIN" ]; then
                        DROP=$((TOTAL - RETAIN))
                        echo "Retention: $col has $TOTAL snapshots, deleting $DROP oldest (keep $RETAIN)"
                        printf '%s\n' "$SNAPS" | sort | head -n "$DROP" | while read -r snap; do
                          [ -z "$snap" ] && continue
                          echo "Retention: deleting $col/$snap"
                          curl -sf -X DELETE "http://mesh-qdrant:6333/collections/${col}/snapshots/${snap}" \
                            || echo "WARN: could not delete $col/$snap" >&2
                        done
                      fi
                    done
                  fi
                  echo "Backup run complete"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
