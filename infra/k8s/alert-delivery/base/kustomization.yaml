apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule-delivery.yaml

configMapGenerator:
  - name: alert-sink
    files:
      - sink.py

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      bundle: observability
