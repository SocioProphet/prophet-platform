# GCE ingress needs a 200 from the LB health check, but zot's /v2/ is 401 under the login-wall
# and v2.1.2 exposes no /v2/_zot/* health path (all 404). The UI root "/" returns 200 unauthenticated
# (ui extension enabled), so use it as the LB health path. Verified by port-forward probe at deploy.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: zot-backendconfig
  namespace: socioprophet
spec:
  healthCheck:
    type: HTTP
    requestPath: /
    port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: socioprophet
  labels: { app: zot }
  annotations:
    cloud.google.com/backend-config: '{"default": "zot-backendconfig"}'
spec:
  type: NodePort
  selector: { app: zot }
  ports:
    - { name: http, port: 5000, targetPort: 5000 }
