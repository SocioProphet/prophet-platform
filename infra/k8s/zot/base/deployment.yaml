# zot — sovereign OCI registry. Single binary, MinIO/S3-backed, extensions build (sync/search/ui).
# RWO cache PVC → Recreate strategy (one pod). S3 creds come from the existing minio-credentials secret
# mapped to the AWS_* env the zot S3 driver reads. The htpasswd file comes from the zot-htpasswd secret,
# which is created OUT OF BAND (not committed) — see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: socioprophet
  labels: { app: zot }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: zot }
  template:
    metadata:
      labels: { app: zot }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: zot
          # Full (extensions) image — sync/search/ui need this, not zot-minimal-*. Public on GHCR
          # (anonymous pull works during bootstrap). Pin the digest before prod hardening.
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.2
          args: ["serve", "/etc/zot/config.json"]
          env:
            # zot's S3 driver uses the AWS SDK → reads these. Sourced from the MinIO root creds.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: minio-credentials, key: access-key } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: secret-key } }
          ports:
            - { name: http, containerPort: 5000 }
          volumeMounts:
            - { name: config, mountPath: /etc/zot/config.json, subPath: config.json }
            - { name: htpasswd, mountPath: /etc/zot/htpasswd, subPath: htpasswd }
            - { name: cache, mountPath: /var/lib/zot }
          # zot's /v2/ returns 401 under the login-wall, so HTTP probes would fail auth — use TCP.
          #
          # STARTUP PROBE — without it a restart can CRASH-LOOP this registry.
          # On boot zot runs a dedupe restore across every blob in the MinIO backend before it
          # binds :5000. That work grows with the registry. The liveness probe alone gave it
          # 20s + 3x20s = 80s, so once the restore exceeded ~80s the container was killed
          # mid-restore, restarted, and began the restore again — observed live on 2026-08-04,
          # 3 kills before it converged (each restart keeps partial boltdb progress, which is the
          # only reason it ever came back). A registry that cannot survive its own restart is a
          # latent outage waiting for the next node drain or config change.
          #
          # startupProbe suspends liveness/readiness until the first success, then hands over:
          # 30 x 10s = up to 5 minutes to finish the restore, while STILL killing a genuinely
          # hung boot. Liveness keeps its tight loop afterwards, so steady-state detection of a
          # wedged process is unchanged.
          startupProbe:
            tcpSocket: { port: 5000 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: config
          configMap: { name: zot-config }
        - name: htpasswd
          secret: { secretName: zot-htpasswd }
        - name: cache
          persistentVolumeClaim: { claimName: zot-cache }
