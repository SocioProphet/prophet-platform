apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-minio
spec:
  replicas: 1
  # RWO PVC + single replica: Recreate terminates the old pod before starting the new one,
  # so the volume is released first. RollingUpdate deadlocks (new pod can't Multi-Attach the
  # ReadWriteOnce volume held by the old pod on another node) — which wedged this exact deploy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workspace-minio
  template:
    metadata:
      labels:
        app: workspace-minio
        # NetworkPolicy's podSelector matches app.kubernetes.io/name, not app — without this label
        # the policy silently selects zero pods and enforces nothing (same root cause found and fixed
        # for acquire-worker/noetica-agent-machine; this is the repo-wide follow-up audit).
        app.kubernetes.io/name: workspace-minio
    spec:
      # minio writes its data dir on the mounted PVC as UID/GID 1000; without fsGroup the
      # root-owned volume is unwritable → the gitea-class crashloop (kyverno require-fsgroup-pvc).
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          # Pinned to an immutable digest (was minio/minio:latest — a moving tag that re-pulls
          # unpredictably and can never be reproduced). This digest == the release running live at
          # pin time. Sovereign follow-up: mirror into registry.socioprophet.ai via the
          # fogstack-registry publication workflow and repoint here (tracked in the PR).
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workspace-minio-pvc
