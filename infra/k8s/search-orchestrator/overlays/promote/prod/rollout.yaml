# WAVE 3 (prod) — BLUE-GREEN cutover via Argo Rollouts, reusing the estate's existing
# canary/SLO machinery (infra/k8s/rollouts/base/analysistemplate-slo.yaml, the shared
# `slo-gate` AnalysisTemplate). This is NOT a second deploy path: it is the same digest the
# dev/canary Deployments carry (INV-DEP-2, build-once-promote-many), advanced into a
# blueGreen Rollout for the production cutover.
#
# Cutover rule (INV-DEP-3): the frozen digest deploys to GREEN (preview). prePromotionAnalysis
# runs the fail-closed slo-gate against the preview; promotion to active (the cutover) happens
# ONLY after it passes. autoPromotionEnabled:false keeps a manual/gated promotion; the OLD
# ReplicaSet (BLUE) is RETAINED for 600s (scaleDownDelaySeconds) so a bad cutover rolls back
# instantly by flipping the Service selector back — no rebuild, no re-pull.
#
# The image line is injected by image-patch.yaml (strategic-merge, generated by
# tools/apply_wave_promotion.py from the frozen release-train manifest) so the digest is
# single-sourced from the train, never hand-typed here. The placeholder below is overwritten
# at kustomize build time.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: search-orchestrator
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: search-orchestrator
  strategy:
    blueGreen:
      # The two Services the cutover flips between (defined in service.yaml).
      activeService: search-orchestrator            # BLUE / live traffic
      previewService: search-orchestrator-preview   # GREEN / the frozen digest under test
      autoPromotionEnabled: false                   # gated cutover, never time-based
      scaleDownDelaySeconds: 600                    # keep BLUE for instant rollback
      prePromotionAnalysis:
        templates:
          - templateName: slo-gate                  # reuse the in-repo fail-closed SLO gate
        args:
          - name: service
            value: search-orchestrator
  template:
    metadata:
      labels:
        app: search-orchestrator
    spec:
      serviceAccountName: search-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-orchestrator
          # OVERWRITTEN by image-patch.yaml with the frozen digest — do not hand-edit.
          image: ghcr.io/socioprophet/prophet-platform/search-orchestrator:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          workingDir: /app/services/search-orchestrator
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: search-orchestrator-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: search-orchestrator-data
              mountPath: /var/lib/prophet-platform
            - name: search-orchestrator-runtime
              mountPath: /run/prophet-platform
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: search-orchestrator-data
          persistentVolumeClaim:
            claimName: search-orchestrator-data
        - name: search-orchestrator-runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
