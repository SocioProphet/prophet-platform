apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# WAVE 1 (dev) of the build-once-promote-many release train.
# The image-patch below carries the SAME immutable digest that canary and prod carry
# (generated by tools/apply_wave_promotion.py from the frozen release-train manifest) —
# promote-many, never rebuild (INV-DEP-2). Digest-pinned, never a moving tag (INV-DEP-1).
namespace: prophet-platform-dev
commonAnnotations:
  # ArgoCD sync-wave: dev syncs and must be Healthy before canary (wave 21) and prod (22).
  # These are within-train ordering waves, layered above the estate appset's dependency
  # waves (0..13). See docs/DEPLOY-WAVE-STRATEGY.md.
  argocd.argoproj.io/sync-wave: "20"
  socioprophet.io/release-wave: dev
resources:
  - ../../../base
patches:
  - path: image-patch.yaml
