apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: search-orchestrator-policy-fabric
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: REPLACE_WITH_SECRET_STORE
  target:
    name: search-orchestrator-policy-fabric
    creationPolicy: Owner
  data:
    - secretKey: endpoint
      remoteRef:
        key: REPLACE_WITH_REMOTE_SECRET_KEY
