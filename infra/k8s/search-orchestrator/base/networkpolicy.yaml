apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-orchestrator-baseline
spec:
  podSelector:
    matchLabels:
      app: search-orchestrator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prophet-platform
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prophet-platform
      ports:
        - protocol: TCP
          port: 8080
