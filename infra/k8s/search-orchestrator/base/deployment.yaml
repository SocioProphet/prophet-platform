apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-orchestrator
  template:
    metadata:
      labels:
        app: search-orchestrator
    spec:
      serviceAccountName: search-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-orchestrator
          image: ghcr.io/socioprophet/prophet-platform/search-orchestrator:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          workingDir: /app/services/search-orchestrator
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: search-orchestrator-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: search-orchestrator-data
              mountPath: /var/lib/prophet-platform
            - name: search-orchestrator-runtime
              mountPath: /run/prophet-platform
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: search-orchestrator-data
          persistentVolumeClaim:
            claimName: search-orchestrator-data
        - name: search-orchestrator-runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
