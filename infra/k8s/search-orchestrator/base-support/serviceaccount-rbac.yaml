apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-orchestrator
  labels:
    app: search-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: search-orchestrator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: search-orchestrator
subjects:
  - kind: ServiceAccount
    name: search-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: search-orchestrator
