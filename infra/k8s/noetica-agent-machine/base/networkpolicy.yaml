apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: noetica-agent-machine-baseline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: noetica-agent-machine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: socioprophet
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Downstream: dispatches governed acquisition to acquire-worker (8790).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: socioprophet
      ports:
        - protocol: TCP
          port: 8790
