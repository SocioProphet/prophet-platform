apiVersion: apps/v1
kind: Deployment
metadata:
  name: prophet-mesh
  labels:
    app: prophet-mesh
    bundle: mesh.conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prophet-mesh
  template:
    metadata:
      labels:
        app: prophet-mesh
        bundle: mesh.conductor
    spec:
      containers:
        - name: prophet-mesh
          image: ghcr.io/socioprophet/prophet-mesh:latest
          ports:
            - name: http
              containerPort: 8780
          env:
            - name: PORT
              value: "8780"
            - name: AGENTPLANE_URL
              value: "http://agentplane:8730"
            - name: MODEL_ROUTER_URL
              value: "http://model-router:8710"
            - name: AGENT_REGISTRY_URL
              value: "http://agent-registry:8720"
            - name: MEMORYD_URL
              value: "http://memoryd:8787"
            - name: MEMORYD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mesh-memoryd-credentials
                  key: api-key
            - name: POLICY_FABRIC_URL
              value: "http://policy-fabric:8700"
            - name: SUPERCONSCIOUS_URL
              value: "http://superconscious:8740"
            - name: TRITFABRIC_URL
              value: "http://tritfabric:8750"
            - name: GOVERNANCE_LEDGER_URL
              value: "http://model-governance-ledger:8760"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8780
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8780
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

