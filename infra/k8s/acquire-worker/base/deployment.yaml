apiVersion: apps/v1
kind: Deployment
metadata:
  name: acquire-worker
  labels:
    app: acquire-worker
    app.kubernetes.io/name: acquire-worker
    bundle: acquisition.worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acquire-worker
  template:
    metadata:
      labels:
        app: acquire-worker
        # networkpolicy.yaml's podSelector matches on app.kubernetes.io/name, not app — without
        # this label the policy silently selects zero pods and enforces nothing (found while
        # verifying this manifest for deploy/argocd/acquisition-services.yaml; the same gap
        # exists in several other infra/k8s/*/base pairs in this repo, tracked separately).
        app.kubernetes.io/name: acquire-worker
        bundle: acquisition.worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: acquire-worker
          # us-central1-docker.pkg.dev/socioprophet-platform/socioprophet/ is the platform's
          # Artifact Registry default (charts/socioprophet-service/values.yaml, build-image.yml's
          # `registry` default) -- this is where .github/workflows/images.yml's `acquire-worker`
          # matrix entry (added alongside this manifest, no registry: override) actually publishes.
          # This ref previously said ghcr.io/socioprophet/acquire-worker:latest, a leftover from
          # before that images.yml entry existed; ghcr.io/socioprophet is not a registry this
          # platform publishes to (tools/preflight_deploy_contract.py OUR_REGISTRIES), so the old
          # ref could only ever ImagePullBackOff. tag:latest is the bootstrap for a brand-new
          # service; gitops-promote sha-pins it after the first images.yml build (same convention
          # as catalog-gateway/eval-fabric-api in deploy/values/).
          image: us-central1-docker.pkg.dev/socioprophet-platform/socioprophet/acquire-worker:latest
          ports:
            - name: http
              containerPort: 8790
          env:
            - name: PORT
              value: "8790"
            # Evidence sink — POSTs governed acquisition evidence to prophet-mesh's ingest.
            - name: ACQUIRE_SINK
              value: "http://prophet-mesh.socioprophet.svc.cluster.local:8780/v1/acquire/ingest"
            # Enricher — the worker enriches acquired items via the SynapseIQ reasoning API.
            - name: SYNAPSEIQ_URL
              value: "http://synapseiq-reasoning-api.socioprophet.svc.cluster.local:8803"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8790
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8790
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        # readOnlyRootFilesystem: the only writable path is this emptyDir for scratch/tmp.
        - name: tmp
          emptyDir: {}
