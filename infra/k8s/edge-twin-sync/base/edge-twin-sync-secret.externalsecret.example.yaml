# The twin credentials (rclone config for the S3-compatible twin + bucket name).
# Example ExternalSecret — pulls from the cluster's secret store; do not commit
# real creds. The rclone.conf defines a [twin] remote (s3/gcs).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edge-twin-sync
  namespace: socioprophet
  labels:
    bundle: edge-twin-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: edge-twin-sync
    template:
      data:
        # rclone remote named `twin` → the S3-compatible cloud store.
        rclone.conf: |
          [twin]
          type = s3
          provider = GCS
          endpoint = https://storage.googleapis.com
          access_key_id = {{ .access_key }}
          secret_access_key = {{ .secret_key }}
  data:
    - secretKey: bucket
      remoteRef: { key: REPLACE_WITH_REMOTE_SECRET_KEY, property: twin_bucket }
    - secretKey: access_key
      remoteRef: { key: REPLACE_WITH_REMOTE_SECRET_KEY, property: twin_access_key }
    - secretKey: secret_key
      remoteRef: { key: REPLACE_WITH_REMOTE_SECRET_KEY, property: twin_secret_key }
