apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  # Kept in sync with infra/local/otel-collector/config.yaml.
  # Conservative defaults: OTLP in, batch, debug exporter (backend-free).
  # Prometheus/Loki exporters are placeholders — see NEEDS-REAL-ENDPOINT markers.
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 512
        send_batch_max_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

    exporters:
      debug:
        verbosity: detailed
      # PLACEHOLDER — collector self-exposes metrics on :8889 for Prometheus scrape.
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: prophet_platform
      # PLACEHOLDER — disabled in pipeline. NEEDS-REAL-ENDPOINT for Loki push.
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
      telemetry:
        logs:
          level: info
