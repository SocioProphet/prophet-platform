apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudshell-fog-gateway
  namespace: cloudshell-system
  labels:
    app.kubernetes.io/name: cloudshell-fog
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: prophet-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudshell-fog-gateway
  namespace: cloudshell-system
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods", "pods/exec", "services", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudshell-fog-gateway
  namespace: cloudshell-system
subjects:
  - kind: ServiceAccount
    name: cloudshell-fog-gateway
    namespace: cloudshell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudshell-fog-gateway
