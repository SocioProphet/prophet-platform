apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudshell-fog-secrets
  namespace: cloudshell-system
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: REPLACE_WITH_SECRET_STORE
  target:
    name: cloudshell-fog-secrets
    creationPolicy: Owner
  data:
    - secretKey: session-token-signing-key
      remoteRef:
        key: REPLACE_WITH_REMOTE_SECRET_KEY
