apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-router
  labels:
    app: model-router
    app.kubernetes.io/name: model-router
    bundle: mesh.routing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-router
  template:
    metadata:
      labels:
        app: model-router
        # NetworkPolicy's podSelector matches app.kubernetes.io/name, not app — without this label
        # the policy silently selects zero pods and enforces nothing (same root cause found and fixed
        # for acquire-worker/noetica-agent-machine; this is the repo-wide follow-up audit).
        app.kubernetes.io/name: model-router
        bundle: mesh.routing
    spec:
      containers:
        - name: model-router
          image: ghcr.io/socioprophet/model-router:latest
          ports:
            - name: http
              containerPort: 8710
          env:
            - name: PORT
              value: "8710"
            - name: POLICY_FABRIC_URL
              value: "http://policy-fabric:8700"
            - name: MEMORYD_URL
              value: "http://memoryd:8787"
            - name: MEMORYD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mesh-memoryd-credentials
                  key: api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8710
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8710
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

