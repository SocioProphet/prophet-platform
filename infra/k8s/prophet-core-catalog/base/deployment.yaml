apiVersion: apps/v1
kind: Deployment
metadata:
  name: prophet-core-catalog
  labels:
    app: prophet-core-catalog
    app.kubernetes.io/name: prophet-core-catalog
    bundle: data.catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prophet-core-catalog
  template:
    metadata:
      labels:
        app: prophet-core-catalog
        # NetworkPolicy's podSelector matches app.kubernetes.io/name, not app — without this label
        # the policy silently selects zero pods and enforces nothing (same root cause found and fixed
        # for acquire-worker/noetica-agent-machine; this is the repo-wide follow-up audit).
        app.kubernetes.io/name: prophet-core-catalog
        bundle: data.catalog
    spec:
      containers:
        - name: prophet-core-catalog
          image: ghcr.io/socioprophet/prophet-core-catalog:latest
          ports:
            - name: http
              containerPort: 8830
          env:
            - name: PORT
              value: "8830"
            - name: POLICY_FABRIC_URL
              value: "http://policy-fabric:8700"
            - name: GOVERNANCE_LEDGER_URL
              value: "http://model-governance-ledger:8760"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8830
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8830
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
