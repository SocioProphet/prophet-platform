apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane
  labels:
    app: agentplane
    bundle: mesh.execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentplane
  template:
    metadata:
      labels:
        app: agentplane
        bundle: mesh.execution
    spec:
      containers:
        - name: agentplane
          image: ghcr.io/socioprophet/agentplane:latest
          ports:
            - name: http
              containerPort: 8730
          env:
            - name: PORT
              value: "8730"
            - name: POLICY_FABRIC_URL
              value: "http://policy-fabric:8700"
            - name: AGENT_REGISTRY_URL
              value: "http://agent-registry:8720"
            - name: MODEL_ROUTER_URL
              value: "http://model-router:8710"
            - name: MEMORYD_URL
              value: "http://memoryd:8787"
            - name: MEMORYD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mesh-memoryd-credentials
                  key: api-key
            - name: SUPERCONSCIOUS_URL
              value: "http://superconscious:8740"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8730
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8730
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

