apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapseiq-enrichment-collector
  labels:
    app: synapseiq-enrichment-collector
    bundle: enrichment.collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapseiq-enrichment-collector
  template:
    metadata:
      labels:
        app: synapseiq-enrichment-collector
        bundle: enrichment.collector
    spec:
      containers:
        - name: synapseiq-enrichment-collector
          image: ghcr.io/socioprophet/synapseiq/enrichment-collector:latest
          ports:
            - name: http
              containerPort: 8802
          env:
            - name: PORT
              value: "8802"
            - name: ENRICHMENT_API_URL
              value: "http://synapseiq-enrichment-api:8801"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8802
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8802
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
