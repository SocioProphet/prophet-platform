apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cloudshell-verify-signed-images
  annotations:
    policies.kyverno.io/title: Verify Signed Images
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verify keyless (Sigstore/Fulcio) signatures for approved cloudshell-fog
      runtime and service images. Images are signed by the estate's reusable
      GitHub Actions build workflow via OIDC — no long-lived key to manage.
spec:
  # AUDIT-FIRST rollout: logs signature violations, blocks nothing. Flip to Enforce in a
  # follow-up PR once the Audit logs are clean (see ROLLOUT.md). The controller is installed
  # HELD via deploy/argocd/kyverno.yaml.
  validationFailureAction: Audit
  # Audit-phase: kyverno being unavailable must NOT block admissions (it is an observer, not a
  # gate yet). Flip to Fail only when this policy goes Enforce, deliberately (#1344).
  failurePolicy: Ignore
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-socioprophet-and-socios-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        # The registries the estate ACTUALLY publishes to (GAR via the
        # build-image workflow, and the sovereign zot mirror). The previous
        # ghcr.io/* globs matched nothing this platform deploys — the policy
        # was a no-op even where installed. Kyverno is now installed estate-wide
        # (Audit, 2026-08-04); this policy is live and Kyverno's OWN admission webhook
        # validates it — which is how the mutateDigest/Audit mismatch below was caught
        # (the cloudshell-fog-policy ArgoCD app was stuck OutOfSync, its apply rejected).
        - imageReferences:
            - "us-central1-docker.pkg.dev/socioprophet-platform/socioprophet/*"
            - "registry.socioprophet.ai/*"
          required: true
          # mutateDigest MUST be false while validationFailureAction is Audit: Kyverno rejects
          # the policy otherwise ("mutateDigest must be set to false for 'Audit' failure action").
          # Mutation (rewriting a verified image to its digest) is an ENFORCING action — flip this
          # to true in the SAME PR that flips this policy to Enforce (#1344). verifyDigest below
          # still asserts the signature covers a digest, which is valid in Audit.
          mutateDigest: false
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                # Keyless: trust the estate's GitHub Actions OIDC identity that
                # cosign-signed the digest. No public key to rotate or leak.
                - keyless:
                    subject: "https://github.com/SocioProphet/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
