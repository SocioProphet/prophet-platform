# Wave 1 — the observability keystone, as GitOps Argo Applications.
#
# Sync order (argocd.argoproj.io/sync-wave): the kube-prometheus-stack lands
# FIRST (wave -3) so its CRDs (ServiceMonitor/PrometheusRule) exist before the
# collector base (wave 0) that references them; Loki/Tempo (wave -2) come up
# before the collector exports to them. Chart versions are pinned — bump
# deliberately.
#
# Backends installed:
#   kube-prometheus-stack → Prometheus (Operator) + Grafana + Alertmanager
#   loki                  → logs (OTLP ingest)
#   tempo                 → traces (OTLP ingest)
#   observability (this repo) → OTel collector + ServiceMonitors + SLO rules
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        crds:
          enabled: true
        grafana:
          enabled: true
        prometheus:
          prometheusSpec:
            # Adopt ServiceMonitors/PrometheusRules across namespaces (ours carry
            # the release: kube-prometheus-stack label).
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 15d
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.18.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: { replication_factor: 1 }
          storage: { type: filesystem }
          limits_config:
            allow_structured_metadata: true
        singleBinary: { replicas: 1 }
        # Disable the multi-target components for the single-binary profile.
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.10.3
    helm:
      releaseName: tempo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform.git
    targetRevision: main
    path: infra/k8s/observability/base
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
