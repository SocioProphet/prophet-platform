# Wave 4 — Chaos Mesh controller (install only). The experiments in
# infra/k8s/chaos/experiments are opt-in examples run during game-days — they are
# deliberately NOT synced by any ApplicationSet, so no fault is ever injected
# automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  source:
    repoURL: https://charts.chaos-mesh.org
    chart: chaos-mesh
    targetRevision: 2.7.0
    helm:
      releaseName: chaos-mesh
      values: |
        dashboard:
          create: true
        # Restrict blast radius: only namespaces labelled chaos-mesh.org/inject
        # can be targeted (defense-in-depth alongside experiments being manual).
        controllerManager:
          enableFilterNamespace: true
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
