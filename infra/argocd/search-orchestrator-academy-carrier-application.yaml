apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-orchestrator-academy-carrier
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: prophet-platform
  project: default
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform
    targetRevision: main
    path: infra/k8s/search-orchestrator/overlays/carrier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
