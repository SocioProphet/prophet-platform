# Wave 2 — the mesh half. MOVED OUT on 2026-07-30: `argo-rollouts` and
# `progressive-delivery-base` now live in deploy/argocd/progressive-delivery.yaml,
# the tree the root app-of-apps actually watches. Nothing in infra/argocd/ has
# ever reached the cluster, which is why `kubectl get analysistemplates` returned
# "the server doesn't have a resource type" while the canary gate was documented
# as live.
#
# Cilium stays here ON PURPOSE — see its own note below. GKE Autopilot already
# runs Cilium as its dataplane (Dataplane V2); installing this one on the live
# cluster would mean a second CNI. It belongs in the watched tree only on a
# self-managed or edge (k3s) cluster, where it is the CNI. Do not "finish the
# job" by relocating it without checking which cluster it is going to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # NOTE: Cilium is the CNI — install at cluster bootstrap on self-managed/edge
    # (k3s) clusters. On GKE Autopilot the dataplane is already Cilium (Dataplane
    # V2): don't install this there; enable NetworkPolicy + Gateway API via GKE
    # and apply infra/k8s/mesh/base only.
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.16.5
    helm:
      releaseName: cilium
      values: |
        # mTLS between endpoints (transparent encryption).
        encryption:
          enabled: true
          type: wireguard
        hubble:
          enabled: true
          relay: { enabled: true }
          ui: { enabled: true }
        gatewayAPI:
          enabled: true
        kubeProxyReplacement: true
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
