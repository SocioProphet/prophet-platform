# Wave 2 — progressive delivery + mesh, as GitOps Argo Applications.
#
# Argo Rollouts gives metric-gated canary/blue-green (A-B); its analysis reads the
# Wave-1 SLO recording rules. Cilium provides the mesh: mTLS (WireGuard), L3/L4 +
# L7 network policy, Hubble flow visibility, and the Gateway API used for
# traffic-shaped canaries.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.37.7
    helm:
      releaseName: argo-rollouts
      values: |
        controller:
          metrics:
            enabled: true
          # Registers the Gateway API traffic router plugin so a Rollout's
          # trafficRouting.plugins["argoproj-labs/gatewayAPI"] stanza (see
          # charts/socioprophet-service/templates/rollout.yaml, opted into by
          # deploy/values/hellgraph-service.yaml) resolves on the controller —
          # without this the plugin name is a dangling reference and the
          # Rollout errors at reconcile, not at apply. UNVERIFIED offline
          # (explore/rollouts-hellgraph-pilot, 2026-07-31): this key's shape
          # against the pinned argo-rollouts chart 2.37.7 needs confirming on
          # a real cluster/against the chart's values schema before this is
          # relied on — the plugin release URL below is a placeholder
          # pointer, not a verified/digest-pinned artifact.
          trafficRouterPlugins:
            - name: argoproj-labs/gatewayAPI
              location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.4.0/gatewayapi-plugin-linux-amd64
        dashboard:
          enabled: true
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # NOTE: Cilium is the CNI — install at cluster bootstrap on self-managed/edge
    # (k3s) clusters. On GKE Autopilot the dataplane is already Cilium (Dataplane
    # V2): don't install this there; enable NetworkPolicy + Gateway API via GKE
    # and apply infra/k8s/mesh/base only.
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.16.5
    helm:
      releaseName: cilium
      values: |
        # mTLS between endpoints (transparent encryption).
        encryption:
          enabled: true
          type: wireguard
        hubble:
          enabled: true
          relay: { enabled: true }
          ui: { enabled: true }
        gatewayAPI:
          enabled: true
        kubeProxyReplacement: true
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: progressive-delivery-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: socioprophet
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform.git
    targetRevision: main
    path: infra/k8s/rollouts/base
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
---
# Added by explore/rollouts-hellgraph-pilot (2026-07-31) — infra/k8s/mesh/base (Gateway +
# HTTPRoute + CiliumNetworkPolicy) previously had NO Application at all; both the rollouts
# README and this file's own cilium NOTE said to "apply infra/k8s/mesh/base" as a manual,
# out-of-band step. A Rollout that depends on the HTTPRoute existing (trafficRouting.enabled)
# cannot rely on a step nobody automated — wire it in at the same wave as the AnalysisTemplate
# so both land together. Requires the Gateway API CRDs to already be present in-cluster
# (NOT installed by the cilium Application above, and not anywhere else in this repo either —
# confirmed by grep; on GKE they ship with the cluster, on self-managed k3s they need a
# separate one-time `kubectl apply` of the upstream gateway-api CRD bundle before this syncs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: progressive-delivery-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: socioprophet
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform.git
    targetRevision: main
    path: infra/k8s/mesh/base
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
