apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudshell-fog-policy
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudshell-system
  project: default
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform
    targetRevision: main
    path: infra/policy/cloudshell-fog/kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
