apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudshell-fog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform.git
    targetRevision: main
    path: infra/k8s/cloudshell-fog/overlays/default
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudshell-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
