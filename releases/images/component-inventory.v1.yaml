# Prophet Platform container component inventory v1
#
# This inventory tracks runnable components and their container build substrate.
# It is governed by docs/CONTAINER_BUILD_SUBSTRATE.md.

schema_version: v1
owner: prophet-platform
canonical_host_substrate: fcos_silverblue_ostree_fedora_family
standards:
  - docs/CONTAINER_BUILD_SUBSTRATE.md
  - docs/SOURCEOS_CONTROL_PLANE_CONTRACTS.md
  - SocioProphet/socioprophet-standards-storage:standards/evidence-bundle-standard.v1.md
  - SocioProphet/socioprophet-standards-storage:standards/evaluation-record-standard.v1.md
  - SocioProphet/socioprophet-standards-knowledge:standards/evaluation-fabric-standard.v1.md
  - SocioProphet/sociosphere:standards/angel-of-the-lord/README.md

components:
  - id: search_orchestrator
    name: Search Orchestrator
    source_path: services/search-orchestrator
    component_type: service
    runtime_class: platform
    build_context: .
    containerfile: services/search-orchestrator/Dockerfile
    runtime_base: unknown_existing
    runtime_base_justification: Existing image workflow predates substrate hardening; verify and migrate to scratch/distroless/Wolfi/UBI-minimal as appropriate.
    host_substrate: fcos_silverblue_ostree_fedora_family
    image_registry: ghcr.io/socioprophet/prophet-platform
    image_name: search-orchestrator
    tags:
      - main
      - sha
    workflow: .github/workflows/search-orchestrator-image.yml
    current_status: existing_buildx_ghcr_digest_evidence
    digest_required: true
    sbom_required: true
    provenance_required: true
    vulnerability_scan_required: true
    evaluation_record_required: true
    angel_required: conditional
    notes: Existing workflow builds and pushes to GHCR and emits digest evidence. SBOM/provenance/scan gates should be added or verified in follow-up.

  - id: socioprophet_api
    name: SocioProphet API
    source_path: apps/api/cmd/socioprophet-api
    component_type: go_service
    runtime_class: platform
    build_context: .
    containerfile: apps/api/Dockerfile
    runtime_base: scratch
    runtime_base_justification: Static Go binary with no runtime userspace; suitable for FCOS/Silverblue/OSTree host deployment.
    host_substrate: fcos_silverblue_ostree_fedora_family
    image_registry: ghcr.io/socioprophet/prophet-platform
    image_name: socioprophet-api
    tags:
      - main
      - sha
    workflow: .github/workflows/socioprophet-api-image.yml
    current_status: deployable_buildx_ghcr_digest_evidence
    digest_required: true
    sbom_required: true
    provenance_required: true
    vulnerability_scan_required: true
    evaluation_record_required: true
    angel_required: conditional
    notes: Scratch runtime image. Builder stage is not host substrate and must not be interpreted as SourceOS system plane.

