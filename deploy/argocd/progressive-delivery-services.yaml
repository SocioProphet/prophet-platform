# Progressive delivery (Argo Rollouts canary/A-B, metric-gated once metrics exist) — CONNECTED
# into the watched tree (explore/rollouts-hellgraph-pilot, 2026-07-31; moved from
# infra/argocd/progressive-delivery.yaml, same fix class as this directory's own
# observability-services.yaml move: the tofu root app-of-apps only recurses deploy/argocd,
# so anything under infra/argocd/ never reaches the cluster no matter how correct it is).
#
# Verified live on the cluster (read-only kubectl, gke_socioprophet-platform_us-central1_
# prophet-platform) before this move: no `argo-rollouts` namespace, no rollouts.argoproj.io /
# analysistemplates.argoproj.io CRDs — only an orphaned, partially-installed
# `experiments.argoproj.io` CRD dated 2026-07-30 (a prior interrupted attempt, left as-is; not
# this PR's job to clean up). infra/argocd/progressive-delivery.yaml had genuinely never
# reconciled, not just gone stale.
#
# CILIUM DROPPED (was going to be installed as its own Application here). Confirmed live:
# this cluster's Gateway API CRDs (gateways/httproutes/gatewayclasses/referencegrants/
# tlsroutes/backendtlspolicies.gateway.networking.k8s.io, plus GKE's own
# gcpgatewaypolicies.networking.gke.io) are GKE's NATIVE Gateway implementation
# (networking.gke.io/gateway controller) — already installed, no separate CNI/mesh chart
# needed. Also confirmed: `ciliumnetworkpolicies.cilium.io` is NOT registered on this cluster
# (GKE Autopilot's Dataplane V2 exposes only its own internal Cilium bookkeeping CRDs —
# ciliumendpoints/ciliumidentities/ciliumnodes/ciliumlocalredirectpolicies — never the
# user-facing CiliumNetworkPolicy CRD). infra/k8s/mesh/base/cilium-networkpolicy.yaml was
# converted to a plain networking.k8s.io/v1 NetworkPolicy for that reason — Dataplane V2
# enforces standard NetworkPolicy natively, no CRD needed.
#
# TRAFFIC ROUTING: Argo Rollouts has NO plugin-free native Gateway API support (verified
# against the argoproj/argo-rollouts docs source at the pinned v1.7.2 AND at the latest
# v1.9.1 — "Gateway API" in the traffic-management provider list links to plugins.md in
# both; google-cloud.md explicitly says GKE Gateway API integration is "available with the
# Argo Rollouts Gateway API plugin" too). There is no trafficRouting.gatewayAPI key to
# switch to — the argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi plugin below is the
# only path to weighted-HTTPRoute canaries, on Cilium OR on GKE's native Gateway alike.
#
# PORTABILITY FIX (2026-07-31, same day): the path below now points at
# infra/k8s/mesh/overlays/gcp-gke-autopilot, not infra/k8s/mesh/base directly. The GatewayClass
# is a per-cloud overlay concern, not something to hardcode into the shared base — a future
# AWS/Azure/self-managed environment's own app-of-apps should point this same Application shape
# at overlays/cilium-portable instead (see that overlay's README for the companion Cilium
# install). No change to what's actually live on THIS cluster — gke-l7-rilb either way, matching
# GKE Autopilot's Dataplane V2 constraint (no user-facing Cilium Gateway API surface here).
#
# hellgraph-service (deploy/values/hellgraph-service.yaml) does NOT use the AnalysisTemplate
# below yet — no /metrics exist for it (separate, unresolved prerequisite) — it runs a
# metrics-free canary (fixed weights + pauses only). progressive-delivery-base still ships
# the AnalysisTemplate for whichever service instruments itself first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    socioprophet.io/tier: "foundation"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.37.7   # appVersion v1.7.2 (confirmed via `gh api` against argoproj/argo-helm) — current
    helm:
      releaseName: argo-rollouts
      values: |
        controller:
          metrics:
            enabled: true
          # Registers the Gateway API traffic router plugin so a Rollout's
          # trafficRouting.plugins["argoproj-labs/gatewayAPI"] stanza (see
          # charts/socioprophet-service/templates/rollout.yaml, opted into by
          # deploy/values/hellgraph-service.yaml's trafficRouting block) resolves on
          # the controller — without this the plugin name is a dangling reference and
          # the Rollout errors at reconcile, not at apply.
          #
          # FIXED 2026-08-02 (live 14h outage): the "UNVERIFIED offline" note this
          # comment used to carry was right to be worried — the original shape here
          # was a bare YAML list, but argo-rollouts' own configmap.yaml template does
          # `{{- with .Values.controller.trafficRouterPlugins }}{{ toYaml . | nindent 2 }}`
          # DIRECTLY under `data:`, so the value must already be a MAP (whose key
          # becomes the ConfigMap's data key, holding the plugin list as a nested YAML
          # string) — not a bare list. A bare list rendered straight under `data:`,
          # which Kubernetes rejects: "expected map, got &{[map[...]]}" (confirmed via
          # `kubectl get application argo-rollouts -o json`'s operationState.message).
          # ArgoCD retried the failing patch 5 times and gave up; argo-rollouts-config
          # never existed; the controller queued "plugin ... not configured in
          # configmap" for 5,212 retries; hellgraph-service ran zero pods for 14 hours.
          # Verified via `helm template argo-rollouts <chart> -f <these values>
          # --show-only templates/controller/configmap.yaml` before this landed —
          # renders a real `data: {trafficRouterPlugins: "<yaml string>"}` map now.
          #
          # Also still true from the original note: the plugin release URL below is a
          # placeholder pointer (upstream release asset), not a digest-pinned artifact
          # per the estate's vendoring convention — tracked as a fast-follow, not
          # blocking this outage fix. And the "hellgraph-service doesn't reference this
          # plugin yet" claim was already stale before this fix — its rollout.enabled
          # is true and its trafficRouting block is live; that's WHY the malformed
          # ConfigMap caused a real outage instead of sitting unused.
          trafficRouterPlugins:
            trafficRouterPlugins: |-
              - name: argoproj-labs/gatewayAPI
                location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.4.0/gatewayapi-plugin-linux-amd64
        dashboard:
          enabled: true
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: progressive-delivery-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    socioprophet.io/tier: "foundation"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: socioprophet
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform.git
    targetRevision: main
    path: infra/k8s/mesh/overlays/gcp-gke-autopilot
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: progressive-delivery-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    socioprophet.io/tier: "foundation"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: socioprophet
  source:
    repoURL: https://github.com/SocioProphet/prophet-platform.git
    targetRevision: main
    path: infra/k8s/rollouts/base
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
