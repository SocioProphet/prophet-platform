# Argo CD ApplicationSet — sovereign search (SearXNG).
#
# SearXNG is the keyless, self-hosted meta-search backend behind Noetica's web_search
# tool. It replaces a rented Google-search API (Serper) and the HTML scrapers that
# search engines block from datacenter IPs — the real "web search came back empty"
# bug. Same house convention as zot/socbase: kustomize, GCE-free ClusterIP (internal
# only, NetworkPolicy-restricted), image pulled through zot.
#
# Prereqs (out of band, NOT in git): the `searxng-secret` Secret (key: secret) and the
# `zot-pull` Secret. Noetica points SEARXNG_URL at http://searxng:8080 in-cluster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: search-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          # All reference tier: swappable search implementations and product edges — the
          # platform's contracts survive replacing any of them (SearXNG is the canonical
          # "replaceable reference service": it replaced Serper and can itself be replaced).
          - { name: searxng, path: infra/k8s/searxng/base, tier: reference }
          # The open-chat commons aggregator — instances publish REDACTED open chats here (floor-gated on
          # ingest), and SearXNG's json_engine (see the searxng ConfigMap) searches the corpus. ClusterIP +
          # NetworkPolicy = internal-only; an authenticated external /publish ingress is a separate, deliberate
          # decision. Prereq (out of band, NOT in git): the `commons-search-secret` Secret (key: publish-token).
          - { name: commons-search, path: infra/k8s/commons-search/base, tier: reference }
            # public HTTPS edge for search-gateway (read-only) → socioprophet.ai search surface
          - { name: search-gateway-ingress, path: infra/k8s/search-gateway-ingress/base, tier: reference }
          # public HTTPS edge for the Studio BFF (reads open; /extract write is fail-closed) → studio.socioprophet.ai
          - { name: studio-ingress, path: infra/k8s/studio-ingress/base, tier: reference }
  template:
    metadata:
      name: 'search-{{.name}}'
      labels:
        app.kubernetes.io/part-of: sovereign-search
      annotations:
        socioprophet.io/tier: '{{.tier}}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: socioprophet
      source:
        repoURL: https://github.com/SocioProphet/prophet-platform
        targetRevision: main
        path: '{{.path}}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
