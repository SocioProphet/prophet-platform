# Argo CD ApplicationSet — core platform services.
# Each entry renders the reusable socioprophet-service chart with its
# deploy/values/<name>.yaml. The image tag (commit SHA) is promoted by the
# build-image workflow / gitops-promote, overriding image.tag per release.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { name: api }
          - { name: gateway }
          - { name: socioprophet-web }
          - { name: evidence-console }
          - { name: evidence-receipts }
          - { name: eval-fabric-api }
          - { name: agentic-os-api }
          - { name: hellgraph-service }
          - { name: osm-map-api }
          - { name: dashboard-bff }
          - { name: reasoning-failure-runner }
          - { name: search-orchestrator }
          - { name: search-gateway }
          - { name: lattice-studio }
          - { name: grlplus-service }
          - { name: grl-mesh }
          - { name: owl-reasoner }
          - { name: entity-resolution }
          - { name: memoryd }
          - { name: embeddings }
          - { name: regis-acr-api }
          - { name: node-commander }
          - { name: liberty-stack-readout }
          - { name: tritfabric-consumption-api }
          - { name: agora }
          - { name: spark-runner }
          # socbase-auth / socbase-rest are third-party images (supabase/gotrue,
          # postgrest/postgrest) with tags pinned directly in their values files —
          # NOT touched by the build-image/gitops-promote SHA pipeline above, since
          # we don't build them. Install the charts/socbase-schema Job (separately;
          # it isn't part of this ApplicationSet — see its NOTES.txt) AFTER
          # socbase-auth is live, since it waits on GoTrue's auth schema.
          - { name: socbase-auth }
          - { name: socbase-rest }
  template:
    metadata:
      name: 'svc-{{.name}}'
      labels:
        app.kubernetes.io/part-of: socioprophet
    spec:
      project: default
      sources:
        - repoURL: https://github.com/SocioProphet/prophet-platform
          targetRevision: main
          ref: values
        - repoURL: https://github.com/SocioProphet/prophet-platform
          targetRevision: main
          path: charts/socioprophet-service
          helm:
            releaseName: '{{.name}}'
            valueFiles:
              - '$values/deploy/values/{{.name}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: socioprophet
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
