# health-twin — the Digital Health Twin engine (walking skeleton). FHIR-lite record bundle keyed to
# organ systems + governed, receipted, revocable consent grants. The cockpit's /health surface →
# nginx /svc/health → this on :8097. Node binds 0.0.0.0 (no localhost-bind CrashLoop trap).
#
# NOTE: in production this engine is LOCAL-FIRST on the person's own node (never a shared cloud); this
# deployment is the walking-skeleton demo with SYNTHETIC data only — no real PHI.
#
# tag:latest → gitops-promote pins the sha- tag on the first successful build (new-service pattern).
image: { repository: health-twin, tag: sha-ff9e3cb7577cbada45d27c428b923887e3d100f3 }
service: { port: 8097, portName: http }
# tsx/esbuild needs a writable /tmp under the chart's readOnlyRootFilesystem.
tmpDir: { enabled: true }
config:
  # Wall 2/3 reconciliation + CDS Hooks ORCHESTRATE existing estate services (the twin never rebuilds
  # NLP/ER/vector/reasoning). In-cluster DNS; every call degrades gracefully (a service that is absent
  # or on a different port simply reports 'degraded' — it never breaks the twin, which is local-first).
  HT_ER_URL: "http://entity-resolution.socioprophet.svc.cluster.local:8080"        # dedup → golden records
  HT_IE_URL: "http://ie-engine.socioprophet.svc.cluster.local:8080"                # free-text → facts (spaCy)
  HT_HOLMES_URL: "http://holmes.socioprophet.svc.cluster.local:8091"               # claim grounding (anti-Watson)
  HT_HELLGRAPH_URL: "http://hellgraph-service.socioprophet.svc.cluster.local:8090" # land + hybrid semantic search
  HT_OWL_URL: "http://sophos-reasoner.socioprophet.svc.cluster.local:8080"            # TTL → entailments
  # Routed through the receipt-gateway (deploy/values/receipt-gateway.yaml) so every embedding call is
  # receipted; it forwards transparently to the `embeddings` service and returns the same response.
  HT_EMBEDDINGS_URL: "http://receipt-gateway.socioprophet.svc.cluster.local:8898/v1/embeddings"
  # The estate's medical BRAIN (Noetica agent-machine, 125k USMLE-textbook chunks): grounds Ask/Explain
  # in cited medical texts via /api/study/retrieve. Degrades to the local sourced KB if unreachable.
  NOETICA_AM_URL: "http://agent-machine.socioprophet.svc.cluster.local:8080"
  # The agent-machine rejects no-Origin server-to-server callers without a bearer, so brain grounding
  # in-cluster needs NOETICA_AM_TOKEN (= the AM's local-token). Inject it from a Secret via envFrom —
  # do NOT put the token here. Absent → the twin degrades gracefully to the local sourced KB (no break).
  # SMART launch link base for CDS Hooks cards (the cockpit's /health surface).
  SMART_APP_BASE: "https://socioprophet.md"
  # CORS. Deliberately NOT set, and that is the whole point: the cockpit reaches this service
  # SAME-ORIGIN through nginx (`/svc/health/` → health-twin:8097, see apps/socioprophet-web/
  # nginx.conf), so no browser here ever performs a cross-origin request and no allowance is needed.
  # The service no longer emits `access-control-allow-origin: *` — on a surface that accepts the
  # `x-health-grant` credential, a wildcard let any page in any tab mint a grant and read the chart.
  # Unset on a synthetic-only deployment, the default allowlist is the loopback developer origins
  # (nothing in-cluster can be at one of those). To allow a browser origin that is genuinely
  # cross-origin — a BearBrowser sovereign host on a loopback sidecar, say — name it exactly:
  #   HEALTH_TWIN_ALLOWED_ORIGINS: "http://127.0.0.1:7654"
  # `""` means none at all. `"*"` is refused AT BOOT, in either exposure mode.
