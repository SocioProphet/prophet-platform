# First-party sovereign embeddings service (apps/embeddings) — FastAPI serving nomic-embed-text over an
# OpenAI-compatible /v1/embeddings. Flips memoryd from the lexical/hashing fallback to real semantic
# vectors. The model is baked into the image (no runtime HuggingFace egress, no PVC). tag:latest is
# sha-pinned by gitops-promote after the first CI build.
nameOverride: embeddings
image: { repository: embeddings, tag: latest }
service: { port: 8080, portName: http }

probes:
  path: /healthz
  # Loading nomic-embed-text into memory holds startup ~15–40s; uvicorn doesn't serve /healthz until
  # then. Give readiness/liveness room so the pod isn't killed mid-load.
  initialDelaySeconds: 40
  periodSeconds: 15

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits:   { cpu: "2", memory: 2Gi }
# Autoscaling: SAFE — one SentenceTransformer loaded at import (apps/embeddings/app.py:19)
# and used read-only per request (:40). No cache, no accumulation; replicas are
# interchangeable.
# maxReplicas: 2 is DELIBERATELY TIGHT. This pod requests 250m/1Gi — roughly 5x a default
# service — so each replica is ~$0.50/day, not ~$0.09. It also carries a 40s
# initialDelaySeconds because the model loads before uvicorn binds, so a scale-up is not
# fast relief: it is capacity for a sustained load, not a spike. Widen only with a
# measured queue-depth argument.
autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 2 }
