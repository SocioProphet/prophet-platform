# memoryd — sovereign memory-mesh service (apps/memoryd), vendored from ~/dev/memory-mesh into prophet-platform
# CI so it builds with the estate's WIF like every other service. Recall/write/retract over a pluggable store;
# defaults to in-memory (MEMORYMESH_STORE_URI=memory://) so it boots with no database. Point at a Postgres DSN
# to persist. tag:latest → sha-pinned after first build.
image: { repository: memoryd, tag: sha-d3566908a3d0aea902e5649aff772fa9abfa9d3a }
service: { port: 8787, portName: http }
config:
  MEMORYMESH_STORE_URI: "memory://"
  # 768 = nomic-embed-text's output dimension. RemoteEmbedder returns the raw model vector (it does NOT
  # resize to this), so the store MUST match the embedder or inserts mismatch. HashingEmbedder honours it
  # too, so this is safe whether the semantic endpoint is reachable at boot or not.
  MEMORYMESH_VECTOR_SIZE: "768"
  # Sovereign semantic embeddings, routed through the receipt-gateway (deploy/values/receipt-gateway.yaml)
  # so every embedding call gets a governed, hash-chained InferenceReceipt — the gateway forwards
  # transparently to the `embeddings` service and returns the same /v1/embeddings response, so memoryd is
  # unchanged. If unreachable at startup, memoryd logs and falls back to the hashing embedder — never mixes
  # vector spaces. See infra/k8s/embeddings/base and apps/receipt-gateway.
  EMBEDDINGS_URL: "http://receipt-gateway.socioprophet.svc.cluster.local:8898/v1/embeddings"
  EMBEDDINGS_MODEL: "nomic-embed-text"
  # KMASS baseline (2026-08-01): mesh-qdrant (infra/k8s/mesh-qdrant) existed but was never
  # registered with ArgoCD, so this was always false against an unreachable URL. The code
  # already gates cleanly on QDRANT_ENABLED and bool(QDRANT_URL) -- see main.py -- so this
  # is config only, no app change needed.
  QDRANT_ENABLED: "true"
  QDRANT_URL: "http://mesh-qdrant.socioprophet.svc.cluster.local:6333"
  QDRANT_COLLECTION: "memorymesh-recall"
autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 2 }
# MEMORYMESH_STORE_URI stays memory:// for now -- the primary resource/event store is a
# SEPARATE gap from the vector-recall layer above. postgres_store.py already supports a
# postgresql:// DSN, and a shared, already-running Postgres exists at deploy/datastores/postgres
# (postgres-0, serves socbase auth/rest/workspace/eval-fabric) -- but pointing memoryd at it
# needs a dedicated schema/database and a CI-minted credential Secret first (see this
# estate's "secrets minted in CI, never typed by hand" rule), not just an env var flip.
# Tracked as WO-KMASS-01.01b, deliberately not rushed in the same change as the Qdrant wiring.
