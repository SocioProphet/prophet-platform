# sherlock-engine — sovereign, ontology-driven Discovery search (Tantivy/Rust, no JVM). Serves the
# lexical (BM25) tier of the federated search plane; the search-gateway fans it in as source "corpus"
# alongside SearXNG (web) + commons-search (commons). Pin the immutable sha- tag the build publishes.
image: { repository: sherlock-engine, tag: sha-f3674f0c99c038af2ca30ffdb7496504fd62e776 }
service: { port: 8093, portName: http }
# server serves /healthz (chart default).
config:
  # Dense / semantic substrate (hybrid lexical+vector). Qdrant is the shared platform vector store
  # (infra/k8s/mesh-qdrant) already used by memoryd + the Prophet Mesh — Sherlock rides it, no new
  # store. Embeddings via the estate sovereign contract (same as hellgraph-service/memoryd).
  # NOTE: consumed once the engine's dense-rerank path lands; declared here so the binding is explicit.
  QDRANT_URL: "http://mesh-qdrant.socioprophet.svc.cluster.local:6333"
  QDRANT_COLLECTION: "sherlock-corpus"
  # Routed through the receipt-gateway (deploy/values/receipt-gateway.yaml) so every embedding call is
  # receipted; it forwards transparently to the `embeddings` service and returns the same response.
  EMBEDDINGS_URL: "http://receipt-gateway.socioprophet.svc.cluster.local:8898/v1/embeddings"
  EMBEDDINGS_MODEL: "nomic-embed-text"
  # KMASS baseline (2026-08-01) found the tantivy index was create_in_ram over a static
  # in-image fixture with no ingest path -- corpus resets to the same 12 docs on every
  # restart. This is the persistent doc store: seeded once from the fixture on first boot,
  # then grown via POST /ingest and reloaded from here on every subsequent boot.
  SHERLOCK_DATA_DIR: "/data"
autoscaling: { enabled: false }
replicaCount: 1
# JSONL doc store is a single-writer file; same reasoning as compute-gateway's SQLite store
# (see that values file) — RollingUpdate with maxSurge 0 behaves like Recreate for one
# replica (old pod releases the RWO PD before the new one claims it) without the
# apply-time "rollingUpdate may not be specified when type is Recreate" conflict on an
# existing Deployment.
strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
persistence: { enabled: true, storageClass: dynamic-rwo, size: 2Gi, mountPath: /data }
