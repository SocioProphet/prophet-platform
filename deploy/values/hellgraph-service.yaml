# hellgraph-service — the engine serves on :8090 (not 8080); align service + probes.
# tag pinned to the 6bc77790 build — WO-2: HNSW+BM25 hybrid retrieval on the GraphRAG grounding path.
# Pinned manually: the image built fine, but the images matrix run failed on an UNRELATED service
# (sherlock-engine), and gitops-promote only fires on a fully-green images run — so one unrelated build
# failure blocked the auto-promote. (Follow-up: promote per-service on partial success.)
image: { repository: hellgraph-service, tag: sha-c4ebc2ee53d0570f02b3c71300c3af7146a6b30c }
service: { port: 8090, portName: http }
# Measured: 55k RC load peaks 560MB RSS (batched loader, engine 0.4.40) — 1Gi is the honest budget.
resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits:   { cpu: "2", memory: 1Gi }
config:
  # Estate sovereign embeddings contract (matches memoryd + prophet-platform #799): the engine
  # (semantic.embedText, ≥0.4.23) speaks EMBEDDINGS_URL → the in-cluster Ollama pod's OpenAI-
  # compatible /v1/embeddings. This flips GraphRAG + commons retrieval from substring/hashing to
  # REAL semantic ("car" ≈ "automobile"). The vector store is dimension-adaptive (holds
  # nomic-embed-text's 768-dim vectors as-is), so no fixed vector-size var is needed here — unlike
  # memoryd's MEMORYMESH_VECTOR_SIZE. The fogstack (federal/standard) tiers override EMBEDDINGS_URL
  # to "" in the appset so a sovereign tier never reaches this socioprophet-namespace service.
  EMBEDDINGS_URL: "http://embeddings.socioprophet.svc.cluster.local:8080/v1/embeddings"
  EMBEDDINGS_MODEL: "nomic-embed-text"
  # Load the ~55k KBpedia reference concepts at startup (the RC ABox under KKO, vendored gzipped in
  # the image). Activates the KKO coherence ranker in /api/graph/enrich and gives semantic entity
  # typing its target vocabulary. Idempotent (content-addressed atoms).
  HELLGRAPH_LOAD_RC: "on"  # 0.4.40 batched loader: measured 560MB peak @55k under a 400MB heap cap
  # ── W1.3 receipt unification: engine sealed() receipts → THE estate spine ──
  # After each /api/graph/enrich|explore, the sealed engine receipt (sha256 over the ranked
  # output + snapshot {seq,nodes,edges}) is POSTed to compute-gateway POST /v1/engine-receipts
  # (body kind=enrich|explore — which of the two engine receipts this is; the gateway then runs
  # it through its own COMPUTE kind engine-seal, same namespace — materializer precedent)
  # and the response carries
  # spine:{ok, receiptId}; ONE gateway verify then walks signature → engine hash → snapshot.seq
  # binding end-to-end. Honest degradation by design: gateway unreachable ⇒ the result still
  # serves with spine:{ok:false, reason} and /healthz unsealedReceipts increments — the read
  # NEVER fails because sealing failed, and we never claim sealed when it isn't.
  GATEWAY_RECEIPTS: "on"
  GATEWAY_URL: "http://compute-gateway:8080"
  # ── ORG SUPER-PEER (federation) — opt-in, OFF by default ──────────────────────────────────
  # The membership loop for local Noetica users: admit a user's writer key ONCE (signed
  # addWriter control op) and their local graph changes percolate to this org graph
  # automatically over Hyperswarm (P2P discovery by base key — no ingress needed; the
  # super-peer is an INDEX, never a data owner, so its storage re-materializes from
  # participants' logs). Governance is fail-closed: enabling without the HMAC secret
  # refuses to start. TO ACTIVATE:
  #   kubectl -n socioprophet create secret generic hellgraph-federation-hmac --from-literal=secret=<random>
  #   flip FEDERATION_ENABLED to "1", uncomment the secretEnv entry below, commit.
  # Admit tokens are minted operator-side from the same secret (HmacTokenVerifier.mint,
  # scope 'admit') — admission is the identity primitive until the login work lands.
  FEDERATION_ENABLED: "0"
  # ── WAVE 2 DOORS: governance on the graph surface (src/auth.ts + src/membrane.ts) ──────────
  # AUTH: scoped HMAC bearer tokens on /api/graph/* + /api/membrane/* (graph:read /
  # graph:write / graph:enrich). Flagged rollout — "off" is passthrough with a startup WARN;
  # FLIPPING TO "on" IS AN OPS DECISION (every caller needs a token first). Fail-closed:
  # "on" without the secret refuses startup. TO ACTIVATE:
  #   kubectl -n socioprophet create secret generic hellgraph-auth-hmac --from-literal=secret=<random>
  #   flip AUTH_ENFORCE to "on", uncomment the AUTH_HMAC_SECRET secretEnv entry below, commit.
  # Tokens are minted operator-side from the same secret (auth.ts mintGraphToken — the same
  # HMAC token format federation admit tokens use).
  AUTH_ENFORCE: "off"
  # MEMBRANE: the B-after-A gate is ON — a node write labeled ExecutionReport REQUIRES
  # properties.decisionRef → an approved EffectDecision (minted only via POST
  # /api/membrane/decide, policy kernel v0, idempotent by idempotencyKey) whose intentRef
  # matches the report's. Structural, not advisory; typed 403s. Decisions are sealed on the
  # estate receipt spine via compute-gateway kind=materialize (the W1.1 attestation door —
  # never a parallel receipt lineage); an unreachable gateway degrades the attestation
  # honestly (sealed:false + sealError on the decision node), never the gate itself.
  MEMBRANE_ENFORCE: "on"
  COMPUTE_GATEWAY_URL: "http://compute-gateway:8080"
secretEnv:
  # The SAME compute-gateway-token Secret compute-gateway + prophet-materializer-clickhouse
  # already require in this namespace — nothing new is provisioned, for either the membrane's
  # seal calls (W2.2) or the engine-receipt spine (W1.3).
  # optional: true — THE graph service must never block on the receipts secret. Absent token
  # ⇒ gateway 401 ⇒ spine:{ok:false} + unsealedReceipts, and membrane decisions land with
  # sealed:false + sealError. Both degrade the ATTESTATION honestly; neither degrades the
  # GATE, which is structural and needs no seal to refuse a write.
  GATEWAY_TOKEN: { secretName: compute-gateway-token, key: token, optional: true }
# secretEnv additions when activating federation / auth enforcement (see comments above):
#   FEDERATION_HMAC_SECRET: { secretName: hellgraph-federation-hmac, key: secret }
#   AUTH_HMAC_SECRET: { secretName: hellgraph-auth-hmac, key: secret }
