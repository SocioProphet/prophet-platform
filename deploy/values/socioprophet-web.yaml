# socioprophet-web — THE unified analyst cockpit (client-vue), first service on the SOVEREIGN registry.
#
# Registry: registry.socioprophet.ai (zot), NOT GAR. socioprophet-web is the proof of the GAR→zot
# cutover: images.yml builds+pushes it there (registry: registry.socioprophet.ai, basic auth), so the
# deploy MUST pull from there too. Overriding the GAR default here is what fixes a 24h ImagePullBackOff
# (6539 pulls): the image existed only in zot, the chart pulled it from GAR, the digest never matched.
# The `zot-pull` dockerconfigjson secret (namespace socioprophet) carries the basic-auth creds for zot.
#
# Pin the immutable commit-SHA tag, per the chart's own contract ("Immutable tag = the commit SHA the
# GitOps promotion writes"). `latest` is a MOVING tag and the chart sets imagePullPolicy: IfNotPresent —
# so once a node caches `latest`, kubelet never pulls a newer one, and even `rollout restart` re-runs the
# stale image (that trap survived 574 restarts over 2 days). gitops-promote rewrites this tag to the
# fresh client-vue build SHA when this branch merges to main.
image: { registry: registry.socioprophet.ai, repository: socioprophet-web, tag: sha-a5ccf6c2e72fa12f6bc5261af048b9ac128fbf88 }
imagePullSecrets: [{ name: zot-pull }]
service: { port: 8080, portName: http }
ingress:
  enabled: true
  className: ""   # cluster default; set per-cloud (gce / azure-application-gateway / alb) via overlay
  # Bind the ingress to the reserved GLOBAL static IP (8.233.245.238) so app.socioprophet.ai's A record
  # stays stable across ingress re-creates. Reserved as `socioprophet-web-app-ip` (IN_USE).
  annotations:
    kubernetes.io/ingress.global-static-ip-name: socioprophet-web-app-ip
  hosts: [{ host: app.socioprophet.ai, paths: [{ path: /, pathType: Prefix }] }]
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }
# nginx needs these writable under the chart's readOnlyRootFilesystem (Autopilot).
writableDirs: [/var/cache/nginx, /var/run]
