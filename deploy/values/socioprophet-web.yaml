# socioprophet-web — THE unified analyst cockpit (client-vue), first service on the SOVEREIGN registry.
#
# Registry: registry.socioprophet.ai (zot), NOT GAR. socioprophet-web is the proof of the GAR→zot
# cutover: images.yml builds+pushes it there (registry: registry.socioprophet.ai, basic auth), so the
# deploy MUST pull from there too. Overriding the GAR default here is what fixes a 24h ImagePullBackOff
# (6539 pulls): the image existed only in zot, the chart pulled it from GAR, the digest never matched.
# The `zot-pull` dockerconfigjson secret (namespace socioprophet) carries the basic-auth creds for zot.
#
# Pin the immutable commit-SHA tag, per the chart's own contract ("Immutable tag = the commit SHA the
# GitOps promotion writes"). `latest` is a MOVING tag and the chart sets imagePullPolicy: IfNotPresent —
# so once a node caches `latest`, kubelet never pulls a newer one, and even `rollout restart` re-runs the
# stale image (that trap survived 574 restarts over 2 days). gitops-promote rewrites this tag to the
# fresh client-vue build SHA when this branch merges to main.
image: { registry: registry.socioprophet.ai, repository: socioprophet-web, tag: sha-3ac446e234a5701ee2156c32f5db8d21b030daec }
imagePullSecrets: [{ name: zot-pull }]
service: { port: 8080, portName: http }
ingress:
  enabled: true
  className: ""   # cluster default; set per-cloud (gce / azure-application-gateway / alb) via overlay
  # Bind the ingress to the reserved GLOBAL static IP (8.233.245.238) so the A records
  # stay stable across ingress re-creates. Reserved as `socioprophet-web-app-ip` (IN_USE).
  annotations:
    kubernetes.io/ingress.global-static-ip-name: socioprophet-web-app-ip
    # HTTPS for the public prod domain + the .ai APEX. Each domain gets its OWN
    # ManagedCertificate object (a cert's domain list is immutable and fail-closed — one
    # unresolvable domain stalls the whole cert), so the live .com cert is never at risk
    # while the apex cert sits Provisioning until socioprophet.ai's A record (Namecheap)
    # points at 8.233.245.238.
    networking.gke.io/managed-certificates: socioprophet-web-com-cert,socioprophet-ai-apex-cert
  # GKE ManagedCertificate rendered by the chart (templates/managed-certificate.yaml) —
  # only socioprophet-web sets this, so no other chart consumer emits a cert.
  managedCertificate:
    name: socioprophet-web-com-cert
    domains: [app.socioprophet.com]
  # The .ai apex as a SEPARATE, independently-provisioning cert. The apex serves the
  # store-identity statics: Flathub domain verification (/.well-known/org.flathub.VerifiedApps.txt
  # — token file mounts via extraFileMounts once Flathub issues it) and /screenshots/.
  additionalManagedCertificates:
    - { name: socioprophet-ai-apex-cert, domains: [socioprophet.ai] }
  # app.socioprophet.com = the prod login URL (marketing "Sign in" button → here). app.socioprophet.ai
  # stays as the .ai alias (HTTP for now; no public A record). socioprophet.ai (apex) = the
  # store/canonical identity domain. Same backend/cockpit for all three.
  hosts:
    - { host: socioprophet.ai,      paths: [{ path: /, pathType: Prefix }] }
    - { host: app.socioprophet.ai,  paths: [{ path: /, pathType: Prefix }] }
    - { host: app.socioprophet.com, paths: [{ path: /, pathType: Prefix }] }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }
# nginx needs these writable under the chart's readOnlyRootFilesystem (Autopilot).
writableDirs: [/var/cache/nginx, /var/run]
# Overlay the REAL Firebase web config at runtime from an out-of-git ConfigMap, so the
# public-but-not-secret key never lands in source or image layers. The ConfigMap
# `socioprophet-web-firebase-config` (key firebase-config.js) is created out-of-band in
# the cluster (NOT committed) — see the deploy runbook. Empty repo copy → local dev bypass;
# this mount → real login in-cluster.
extraFileMounts:
  - configMap: socioprophet-web-firebase-config
    key: firebase-config.js
    mountPath: /usr/share/nginx/html/firebase-config.js
    subPath: firebase-config.js
