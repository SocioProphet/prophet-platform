# holmes — the claim deduction/verification engine (Go). `holmes serve` on :8091 reasons over the
# canonical hellgraph (HOLMES_HELLGRAPH). The cockpit's ieApi.verifyClaims → nginx /svc/holmes → this
# service — it's what makes the Law citator + News claim-verify REAL (were 502 / Noetica-narrated).
# nginx already routes /svc/holmes → holmes.socioprophet.svc:8091. Binds 0.0.0.0 (bind fix). Vendored
# from ~/dev/holmes.
#
# tag:latest → gitops-promote pins the sha- tag on the first successful build (new-service pattern,
# same as synapse-bridge/owl-reasoner). Pulls from GAR (chart default).
image: { repository: holmes, tag: sha-319fb2c4daf579e384788dadb63dfa7f46d605b9 }
service: { port: 8091, portName: http }
extraEnv:
  - name: HOLMES_HELLGRAPH
    value: http://hellgraph-service.socioprophet.svc.cluster.local:8090
# Autoscaling: SAFE — handlers (apps/holmes/main.go:281-324) forward to hellgraph over a
# shared http.Client and compute their verdict from the response; the only package vars
# are build-info strings (:136-140). No local writes.
autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3 }
