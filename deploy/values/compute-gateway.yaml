# compute-gateway — the Universal Compute Contract router (apps/compute-gateway).
# One governed door for every kind of compute: routes notebook→lattice-forge and
# graph→hellgraph-service through a single ComputeRequest→ComputeResult, applies
# ONE uniform entitlement gate, seals ONE universal hash-chained receipt per run,
# types the output's warrant, and writes the run's provenance subgraph back to the
# graph. Control-plane only (executes no user code) → platform namespace.
# tag:latest is a bootstrap; sha-pin after first build (gitops-promote only
# MAINTAINS an existing sha- pin — a new latest service must be pinned once).
image: { repository: compute-gateway, tag: sha-aba4e851feed70ec0af93fcb96014bd694fee1df }
service: { port: 8080, portName: http }
config:
  FORGE_URL: "http://lattice-forge.sovereign-runtime.svc.cluster.local:8870"
  HELLGRAPH_URL: "http://hellgraph-service:8090"
  # THE uniform pay-gate across ALL compute kinds (generalizes STUDIO_COMPUTE_ENTITLEMENTS).
  # Tokens: "*" | "<kind>" | "<kind>:<backend>" | "<project>" | "<project>:<kind>" | "<project>:<kind>:<backend>".
  # `materialize` = the Seal-the-Walls W1.1 receipt door for materializer batches
  # (prophet-materializer-clickhouse) — explicit kind token, not reliant on project naming.
  # `governance` = the L5 lifecycle-warden run-attestation door — same reasoning.
  # `engine-seal` = the W1.3 receipt-unification door: hellgraph-service chains its engine
  # sealed() enrich/explore receipts onto THE spine — explicit kind token, same rationale.
  COMPUTE_ENTITLEMENTS: "demo,default,graph-query,graph-stats,gyg-reporting,materialize,governance,engine-seal"
  # every ok run writes its ComputeRun/Receipt subgraph to hellgraph (best-effort).
  GATEWAY_WRITE_PROVENANCE: "true"
  # READ-PATH MASKING PDP — ON. Until now this was code that never ran: masking.py has been
  # mounted in the dispatch path since it landed, but with no policy configured it returned
  # outputs unchanged, so the moat existed and was switched off. The 2026-08-04 catalog/masking
  # audit found GATEWAY_MASKING_POLICY set nowhere in deploy/ — not a missing mechanism, an
  # unused one.
  #
  # Applies to graph-query/graph-stats reads only (masking.READ_KINDS). Direct identifiers are
  # masked before the outputs are sealed, so the Ed25519 receipt attests exactly what the
  # caller received, and the masking decision is appended as a sealed output — the property
  # WKC-style dynamic masking does not produce, because there the enforcement leaves no
  # verifiable artifact.
  #
  # forbidden_mixtures encodes the no_health_adtech veto: a requester whose realm carries the
  # adtech topic reading records that carry the health topic is DENIED outright and the records
  # are withheld, not merely masked.
  #
  # The exact JSON below is parsed out of this file and exercised by
  # apps/compute-gateway/tests/test_masking_policy_values.py, so a typo here fails CI rather
  # than silently reverting the gateway to passthrough. A policy nobody tests is a policy that
  # is one YAML mistake away from being off again.
  GATEWAY_MASKING_POLICY: >-
    {"policy_version":"masking-v1-2026-08-04","decided_by":"prophet-platform/compute-gateway","record_topic_fields":["topic","domain"],"requesting_realm_topics":{"adtech":"adtech","marketing":"adtech"},"forbidden_mixtures":[["health","adtech"]],"mask_fields":{"email":"hmac_pseudonym","email_address":"hmac_pseudonym","phone":"hmac_pseudonym","msisdn":"hmac_pseudonym","ssn":"one_way_hash","national_id":"one_way_hash","patient_mrn":"chameleon_token","date_of_birth":"generalize","dob":"generalize","full_name":"redact","street_address":"redact"}}

  # Durable proof store: receipts + content-addressed artifacts + the doc→SQL sink land on
  # the PVC mounted here, so a governed run survives a restart (compute-gateway persistence).
  GATEWAY_STORE_DIR: "/data"
  # ZEROTRUST_ENFORCE is DELIBERATELY UNSET, and that means the zero-trust gate is OFF in
  # production: grant_check() records kernel-shaped evidence but validates no presented
  # grant_id against the store, so a REVOKED or EXPIRED grant reads valid=True on entitlement
  # alone. The gateway now says so out loud in its startup log rather than leaving it to be
  # inferred from an absent key. Turning it on is a deployment decision with a live blast
  # radius (every user-code kind starts requiring an explicit capability grant), so it is
  # left to an explicit call, not flipped as a side effect of the parsing fix:
  #   ZEROTRUST_ENFORCE: "1"      # accepted: 1 | true | yes | on
# GATEWAY_TOKEN provisioned out-of-band; FORGE_TOKEN is the SAME lattice-forge-token
# already present in socioprophet (the gateway authenticates to the forge with it).
secretEnv:
  GATEWAY_TOKEN: { secretName: compute-gateway-token, key: token }
  FORGE_TOKEN: { secretName: lattice-forge-token, key: token }
# The proof store is one SQLite file ⇒ exactly one writer. Pin a single replica (no HPA) on a
# ReadWriteOnce PD, and the new pod must not start until the old one releases the disk. We do
# that with a surge-free rolling update (maxSurge 0, maxUnavailable 1) rather than type:Recreate:
# for a single replica it behaves identically (old terminates before new starts), but it keeps
# strategy.type == RollingUpdate, so switching an existing Deployment over doesn't hit the
# apply-time conflict ("rollingUpdate may not be specified when type is Recreate"). Same few
# seconds of rollout downtime — deliberate; the object-store backend lifts this later.
autoscaling: { enabled: false }
replicaCount: 1
# The gateway hydrates its durable receipt/blob store (/data, 2Gi PVC — thousands of
# blobs + the hash-chained receipt log) into memory on boot, on top of the hellgraph
# and embedding libraries. The shared chart default (512Mi) is too tight: the pod was
# OOMKilled ~9s into startup, before it could serve or even log — 31 restarts, the whole
# gateway (compute, config-plane, governance receipts) down. Raise the limit for THIS
# service only (not the chart default, which every service inherits).
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits:   { cpu: "1",  memory: 1Gi }
strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
persistence: { enabled: true, storageClass: dynamic-rwo, size: 2Gi, mountPath: /data }
