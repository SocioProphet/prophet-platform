# socioprophet-gateway — HTTP edge gateway
image: { repository: socioprophet-gateway, tag: latest }
service: { port: 8080, portName: http }
# The binary reads GATEWAY_PORT (cmd/tritrpc-gateway/main.go:30) and binds ":"+port.
# A Service named `gateway` makes Kubernetes inject GATEWAY_PORT=tcp://<clusterIP>:8080
# as a service link, so the app bound ":tcp://34.118.237.248:8080" and died with
# "too many colons in address" — 590 restarts over 2 days. Same class as the
# osm-map-api note. Disabling service links removes the collision.
enableServiceLinks: false
# The binary registers mux.HandleFunc("/health") (main.go:43), NOT the chart's
# default /healthz — so probes 404'd regardless of the bind fix above.
probes:
  path: /health
config:
  # The image bakes ENV TRITRPC_TARGET_ADDR=tcp://socioprophet-api:9000
  # (apps/gateway/Dockerfile:17), but that Service does not exist: the chart
  # deploys the tritRPC core as `api` (deploy/values/api.yaml — socioprophet-api
  # is only the image repository name). So every /health ping died with
  # "lookup socioprophet-api: no such host" -> 502 -> liveness kill: 620 restarts
  # over 2 days. Point it at the Service that actually exists (api:9000, verified
  # reachable from the gateway pod).
  TRITRPC_TARGET_ADDR: "tcp://api:9000"
  # DEV ONLY — provision a real TRITRPC_KEY_HEX secret for prod
  TRITRPC_ALLOW_INSECURE_DEV_KEY: "1"
ingress:
  enabled: true
  className: ""   # cluster default; set per-cloud (gce / azure-application-gateway / alb) via overlay
  hosts: [{ host: api.socioprophet.ai, paths: [{ path: /, pathType: Prefix }] }]
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }
# nginx needs these writable under the chart's readOnlyRootFilesystem (Autopilot).
writableDirs: [/var/cache/nginx, /var/run]
