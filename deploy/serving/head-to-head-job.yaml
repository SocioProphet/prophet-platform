# Head-to-head proof Job — runs the live comparison and PERSISTS it to eval-fabric.
#
# Reuses the eval-fabric-api image (the runner lives at app.runner.head_to_head). Calls the served
# mesh (mesh-vllm) and — if frontier keys are present — Claude/GPT, grades every answer against
# independent hidden tests, and writes competitor_snapshots (reproduced_by_us=true). The result
# then shows up at GET /v1/competition/reproduced-vs-claimed with full provenance.
#
#   # 1. (mesh-vllm already up — see mesh-vllm-serve.yaml)
#   # 2. optional frontier arms:
#   kubectl -n prophet-platform create secret generic frontier-keys \
#       --from-literal=anthropic=$ANTHROPIC_API_KEY --from-literal=openai=$OPENAI_API_KEY
#   kubectl apply -f deploy/serving/head-to-head-job.yaml
#   kubectl -n prophet-platform logs -f job/head-to-head-proof
#   # 3. read the reproduced evidence:
#   curl http://eval-fabric-api:8080/v1/competition/reproduced-vs-claimed
apiVersion: batch/v1
kind: Job
metadata:
  name: head-to-head-proof
  namespace: prophet-platform
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: ghcr.io/socioprophet/prophet-platform/eval-fabric-api:dev
          command: ["python", "-m", "app.runner.head_to_head"]
          env:
            - name: POSTGRES_DSN
              value: postgresql://prophet:prophet@postgres:5432/prophet_platform
            - name: MESH_URL
              value: http://mesh-vllm.serving.svc.cluster.local:8000/v1
            - name: MESH_MODEL
              value: "Qwen/Qwen2.5-Coder-7B-Instruct"
            # Frontier arms turn on only if these resolve. The secret is optional — without it the
            # Job runs the sovereign arms (mesh, mesh+verify) and records those as reproduced.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: frontier-keys, key: anthropic, optional: true }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: frontier-keys, key: openai, optional: true }
            - name: CLAUDE_MODEL
              value: "claude-sonnet-4-6"
            - name: GPT_MODEL
              value: "gpt-4o"
          resources:
            limits: { cpu: "2", memory: 2Gi }
            requests: { cpu: "500m", memory: 512Mi }
