# EDGE — on current GCP quota (A100-40 spot). The same choir as small specialists,
# 1 GPU each — mirrors the local ollama choir (qwen2.5/coder, deepseek-r1, llava,
# nomic-embed). Maps to free/dev. The $0-quota dry-run iron.
profile: edge
namespace: serving
defaults: { maxModelLen: 8192, gpuMemoryUtilization: 0.92 }
iron:
  accelerator: nvidia-tesla-a100
models:
  - { name: conductor, family: open_private,        model: RESOLVE_open_small,        gpus: 1, tensorParallel: 1 }  # Qwen3-32B class on 1×A100-40
  - { name: code,      family: code_specialist,     model: RESOLVE_open_code_small,   gpus: 1, tensorParallel: 1 }  # Qwen3-Coder / Codestral small
  - { name: reasoning, family: reasoning_specialist, model: RESOLVE_open_reason_small, gpus: 1, tensorParallel: 1 }  # DeepSeek-R1 (distill) class
  - { name: vision,    family: image_specialist,    model: RESOLVE_open_vlm_small,    gpus: 1, tensorParallel: 1 }  # LLaVA-class VLM (mirrors local llava:13b)
  - { name: embedding, family: embeddings,          model: RESOLVE_open_embed,        gpus: 1, tensorParallel: 1 }  # nomic-embed class
