# EDGE — current GCP quota (A100-40 spot). Same choir as int4(awq) specialists,
# 1 GPU each — mirrors the local ollama choir, scaled down. The $0-quota dry-run.
profile: edge
namespace: serving
defaults: { maxModelLen: 8192, gpuMemoryUtilization: 0.92 }
iron: { accelerator: nvidia-tesla-a100 }
models:
  - { name: conductor, family: open_private,         model: RESOLVE, gpus: 1, tensorParallel: 1, quantization: awq }
  - { name: code,      family: code_specialist,      model: RESOLVE, gpus: 1, tensorParallel: 1, quantization: awq }
  - { name: reasoning, family: reasoning_specialist, model: RESOLVE, gpus: 1, tensorParallel: 1, quantization: awq }
  - { name: vision,    family: vision_understanding, model: RESOLVE, gpus: 1, tensorParallel: 1, quantization: awq }
  - { name: reranker,  family: reranker,             model: RESOLVE, gpus: 1, tensorParallel: 1 }
  - { name: guard,     family: guard,                model: RESOLVE, gpus: 1, tensorParallel: 1 }
  - { name: embedding, family: embeddings,           model: RESOLVE, gpus: 1, tensorParallel: 1 }
