# PRO — ~4–6× H100. Same 7-role choir, mid open models, fewer GPUs per role.
profile: pro
namespace: serving
defaults: { maxModelLen: 8192, gpuMemoryUtilization: 0.92 }
iron: { accelerator: nvidia-h100-80gb }
models:
  - { name: conductor, family: open_private,         model: RESOLVE_open_mid,        gpus: 2, tensorParallel: 2 }   # Qwen3-32B / Mistral-Large-3
  - { name: code,      family: code_specialist,      model: RESOLVE_open_code_mid,   gpus: 1, tensorParallel: 1 }
  - { name: reasoning, family: reasoning_specialist, model: RESOLVE_open_reason_mid, gpus: 1, tensorParallel: 1 }
  - { name: vision,    family: vision_understanding, model: RESOLVE_open_vlm_mid,    gpus: 1, tensorParallel: 1 }
  - { name: reranker,  family: reranker,             model: RESOLVE_open_reranker,   gpus: 1, tensorParallel: 1 }
  - { name: guard,     family: guard,                model: RESOLVE_open_guard,      gpus: 1, tensorParallel: 1 }
  - { name: embedding, family: embeddings,           model: RESOLVE_open_embed,      gpus: 1, tensorParallel: 1 }
