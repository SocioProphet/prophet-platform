# Frontier tier (super-high-end) — serves the current #1 open MoE on 8 GPUs.
# Makes the top mesh tier AVAILABLE. Model is NOT hardcoded: MESH_MODEL is set by
# the resolve-current-sota step (the mesh-model ConfigMap) to whatever the live
# leaderboard's top open model is that fits 8×H100/H200 at FP8.
#
# Iron: 8× H100-80 (FP8) or 8× H200. Schedules wherever those nodes exist —
# rented GPU-cloud (now) or GCP/Azure/AWS after a quota bump.
#
# Spin up:  kubectl apply -f deploy/serving/mesh-vllm-serve-high.yaml
#           kubectl -n serving rollout status deploy/mesh-vllm-high --timeout=30m
# Tear down (the moment you're done — this is the expensive one):
#           kubectl delete -f deploy/serving/mesh-vllm-serve-high.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-model-high
  namespace: serving
data:
  # set by resolve-current-sota at run time (placeholder = explicit, not a bake-in)
  MESH_MODEL: "RESOLVE_AT_RUNTIME_top_open_moe"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-vllm-high
  namespace: serving
  labels: { app: mesh-vllm-high, tier: frontier, lifecycle: ephemeral }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mesh-vllm-high }
  template:
    metadata:
      labels: { app: mesh-vllm-high, tier: frontier }
    spec:
      # H100/H200 node selection — rented or quota'd. (a3-highgpu-8g on GCP.)
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-80gb
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          envFrom:
            - configMapRef: { name: mesh-model-high }
          args:
            - "--model=$(MESH_MODEL)"
            - "--tensor-parallel-size=8"      # 8-GPU shard for a 700B–1.6T MoE
            - "--quantization=fp8"
            - "--max-model-len=8192"
            - "--gpu-memory-utilization=0.92"
            - "--port=8000"
          ports: [ { containerPort: 8000 } ]
          resources:
            limits:
              nvidia.com/gpu: "8"
              cpu: "32"
              memory: 256Gi
          volumeMounts:
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
            - { name: shm, mountPath: /dev/shm }   # NCCL needs large shared mem for TP=8
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 80              # big-MoE load can take many minutes
      volumes:
        - { name: hf-cache, emptyDir: {} }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 32Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-vllm
  namespace: serving
spec:
  selector: { app: mesh-vllm-high }
  ports: [ { port: 8000, targetPort: 8000 } ]
