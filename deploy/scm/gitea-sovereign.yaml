# gitea-sovereign (scm) — self-hosted, login-walled SCM for the SocioProphet estate (ST018).
# Moves the estate's repos off GitHub. Login-wall ON (REQUIRE_SIGNIN_VIEW, registration closed).
# v1: SQLite + single replica + PVC (adequate for a small team; Postgres = later hardening).
#
# THIS IS THE LIVE, DATA-HOLDING INSTANCE — do not confuse with `gitea` in namespace
# `socioprophet` (deploy/gitea-authority/k8s/gitea-sovereign.yaml). They are two SEPARATE
# Deployments/Services/PVCs that happen to share the name "gitea":
#   - scm/gitea         → code.socioprophet.ai  → 125 real repos (sourceos-linux, socios-linux,
#                          socioprophet orgs), ~1.5Gi of data, applied out-of-band 2026-07-15,
#                          DNS live, TLS live (GKE ManagedCertificate). THE production sovereign SCM.
#   - socioprophet/gitea → gitea.sourceos.dev    → empty PVC, no repositories/ directory, DNS never
#                          pointed (see deploy-gitea-authority.yml's own comment: "the ONE external
#                          step this can't do"). A migration target that was never populated.
# The 2026-08-04 orphan-gitea postmortem (#1401) and its follow-ups (#1426/#1431/#1434) were about
# the socioprophet/gitea instance ONLY and never knew this one existed — this manifest closes that
# gap: it is the first time this deployment (originally captured only in stash
# capture/stash-4-e9a17e7, 2026-07-17, applied straight to prod via kubectl and never committed to
# a tracked branch) has actually landed in git, and the first time it comes under ArgoCD.
#
# DNS: code.socioprophet.ai already points at the Ingress IP (verified live, do not re-point).
apiVersion: v1
kind: Namespace
metadata:
  name: scm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: scm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: scm
  labels: { app: gitea }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC — one pod at a time
  selector:
    matchLabels: { app: gitea }
  template:
    metadata:
      labels: { app: gitea }
    spec:
      # fsGroup was already present live (this instance never hit the 26h crashloop the
      # socioprophet/gitea sibling did). fsGroupChangePolicy is the missing half of the #1431
      # fix: without it, every pod (re)start re-chowns the entire PVC (currently ~1.5Gi of real
      # repo data and growing) instead of only when the root dir's group is actually wrong.
      securityContext: { fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch }
      containers:
        - name: gitea
          # Digest-pinned to the exact image this instance is already running (verified via
          # `kubectl get pod -n scm ... -o jsonpath='{.status.containerStatuses[0].imageID}'`,
          # gitea version 1.27.1) — a no-op pin, not a version bump. Was the floating `gitea/gitea:1`
          # tag; clears the same Kyverno `require-image-digest` audit #1431 cleared for the sibling.
          image: gitea/gitea:1@sha256:34e3f6b75f5cbb6aebce588037fc5a53c84213e4d4b00da0a8d73e031a558e52
          env:
            - { name: USER_UID, value: "1000" }
            - { name: USER_GID, value: "1000" }
            - { name: GITEA__server__ROOT_URL, value: "https://code.socioprophet.ai/" }
            - { name: GITEA__server__DOMAIN, value: "code.socioprophet.ai" }
            - { name: GITEA__server__SSH_DOMAIN, value: "code.socioprophet.ai" }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            # --- login wall: nothing visible without sign-in; no open registration ---
            - { name: GITEA__service__REQUIRE_SIGNIN_VIEW, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE, value: "true" }
            - { name: GITEA__openid__ENABLE_OPENID_SIGNIN, value: "false" }
            # SQLite (v1); switch to Postgres for hardening (tracked in docs/design/estate-unified-sso.md)
            - { name: GITEA__database__DB_TYPE, value: "sqlite3" }
          ports:
            - { name: http, containerPort: 3000 }
            - { name: ssh, containerPort: 22 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitea-data }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gitea-backendconfig
  namespace: scm
spec:
  healthCheck:
    requestPath: /api/healthz   # returns 200 without auth (login-wall redirects / to /user/login)
    port: 3000
    type: HTTP
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: scm
  annotations:
    cloud.google.com/backend-config: '{"default": "gitea-backendconfig"}'
spec:
  type: NodePort
  selector: { app: gitea }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: code-cert
  namespace: scm
spec:
  domains: [ code.socioprophet.ai ]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: scm
  annotations:
    networking.gke.io/managed-certificates: code-cert
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - host: code.socioprophet.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port: { number: 3000 }
