schema_version: "fogstack.bundle/v0.1"
kind: "FogStackBundle"
metadata:
  bundle_id: "fogstack.knowledge"
  version: "0.1.0"
  display_name: "Fog Stack Knowledge"
  summary: "Governed knowledge ingress, Academy search explanation retrieval, and local indexing bundle deployed on Prophet Platform substrate."
  source_repositories:
    - "SocioProphet/prophet-platform"
    - "SocioProphet/alexandrian-academy"
    - "SocioProphet/policy-fabric"

claims:
  government_grade_hygiene: true
  self_hostable: true
  standalone_first_value: true
  federated_supported: false
  intelligent_mode: "suggest"

runtime:
  substrate: "prophet-platform"
  service_classes:
    - "cluster-service"
    - "local-daemon"
  components:
    - id: "apps/knowledge-reason"
      role: "governed-ingress"
    - id: "apps/lampstand"
      role: "local-index-daemon"
    - id: "services/search-orchestrator"
      role: "academy-search-bridge"

contracts:
  required:
    - "EventEnvelope"
    - "EvidenceReceipt"
    - "LearningSearchRecord"
    - "AcademySearchVisibilityRequestV1"
    - "AcademySearchVisibilityDecisionV1"

profiles:
  supported:
    - id: "local-dev"
      status: "supported"
      kubernetes_required: false
      root_required: false
    - id: "hybrid-standard"
      status: "supported"
      kubernetes_required: true
      root_required: false
    - id: "academy-carrier"
      status: "supported"
      kubernetes_required: true
      root_required: false
    - id: "academy-carrier-policy"
      status: "supported"
      kubernetes_required: true
      root_required: false

deployment:
  minimum_nodes_for_first_value: 1
  max_required_services: 3
  install_time_target_minutes: 30
  argocd_appsets:
    - "infra/argocd/appsets/search-orchestrator-academy-appset.yaml"
  kustomize_overlays:
    - "infra/k8s/search-orchestrator/overlays/carrier"
    - "infra/k8s/search-orchestrator/overlays/policy"

security:
  identities:
    operator_identity: true
    node_identity: true
    workload_identity: true
    peer_identity: false
  supply_chain:
    signed_artifacts: true
    sbom_required: true
    provenance_required: true
  policy:
    endpoint_explicit_policy_fabric: true
    local_fallback_supported: true

lifecycle:
  channel: "preview"
  support_state: "community"
