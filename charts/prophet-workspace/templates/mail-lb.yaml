apiVersion: v1
kind: Service
metadata:
  name: workspace-smtp-public     # MX target — mail.{{ .Values.domain }} A-record → this LB IP (set PTR on it)
  labels: { app: workspace-smtp }
  annotations:
    {{- include "pw.lbAnnotations" (dict "root" . "extra" .Values.loadBalancer.smtp.annotations) }}
spec:
  type: LoadBalancer
  {{- with .Values.loadBalancer.smtp.staticIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  externalTrafficPolicy: Local    # preserve client source IP (spam scoring / RBL checks)
  selector: { app: workspace-smtp }
  ports:
    - { name: smtp,       port: 25,  targetPort: 25 }
    - { name: submission, port: 587, targetPort: 587 }
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-mail-public     # IMAPS — imap.{{ .Values.domain }} → this LB IP
  labels: { app: workspace-mail }
  annotations:
    {{- include "pw.lbAnnotations" (dict "root" . "extra" .Values.loadBalancer.imap.annotations) }}
spec:
  type: LoadBalancer
  {{- with .Values.loadBalancer.imap.staticIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  externalTrafficPolicy: Local
  selector: { app: workspace-mail }
  ports:
    - { name: imaps, port: 993, targetPort: 993 }
