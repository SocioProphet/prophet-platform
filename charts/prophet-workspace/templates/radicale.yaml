apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-caldav
  labels: { app: workspace-caldav }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: workspace-caldav } }
  template:
    metadata: { labels: { app: workspace-caldav } }
    spec:
      # radicale runs non-root (uid/gid 999, verified via `id` in the live pod); its PVC
      # workspace-caldav-pvc mounts root-owned, so without fsGroup the collections can't be
      # written — the gitea-class failure Kyverno require-fsgroup-for-pvc-writers flags. fsGroup: 999
      # matches the runtime GID; OnRootMismatch chowns the volume group only when the root dir is
      # wrong, so a large collection store isn't re-chowned on every mount.
      securityContext: { fsGroup: 999, fsGroupChangePolicy: OnRootMismatch }
      containers:
        - name: radicale
          image: {{ include "pw.image" (dict "root" . "name" "radicale") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: caldav, containerPort: 5232 }]
          volumeMounts:
            - { name: collections, mountPath: /var/lib/radicale/collections }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: collections
          persistentVolumeClaim: { claimName: workspace-caldav-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-caldav
  labels: { app: workspace-caldav }
spec:
  type: ClusterIP
  selector: { app: workspace-caldav }
  ports: [{ name: caldav, port: 5232, targetPort: 5232 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-caldav
  annotations: { kubernetes.io/ingress.class: nginx }
spec:
  {{- if .Values.tls.certSecret }}
  tls:
    - hosts: [{{ .Values.caldavHostname | quote }}]
      secretName: {{ .Values.tls.certSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.caldavHostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: workspace-caldav, port: { number: 5232 } } }
