apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-mail-pvc
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.storage.mailbox }} } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-caldav-pvc
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.storage.radicale }} } }
