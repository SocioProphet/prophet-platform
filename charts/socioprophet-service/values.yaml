# Defaults for the reusable socioprophet-service chart.
# Per-service files in deploy/values/<svc>.yaml override only what differs.

# Logical service name (becomes the workload + Service name and app label).
nameOverride: ""
fullnameOverride: ""

image:
  # GAR — the estate registry the build-image reusable workflow pushes to.
  registry: us-central1-docker.pkg.dev/socioprophet-platform/socioprophet
  repository: ""          # required per service, e.g. socioprophet-api
  # Immutable tag = the commit SHA the GitOps promotion writes. "" → chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secret(s), if the namespace needs them (GAR via WIF usually doesn't).
imagePullSecrets: []

replicaCount: 1
# Deployment rollout strategy (empty = k8s default RollingUpdate). Set { type: Recreate }
# for single-replica services on tight clusters to avoid a 2x-memory surge.
strategy: {}

# Optional durable volume (PVC). Default OFF — these services are stateless, so this is a
# no-op for every service that doesn't opt in. Enable for a SINGLE-WRITER service (e.g.
# compute-gateway's SQLite proof store): pair it with replicaCount: 1, autoscaling.enabled:
# false, and strategy: { type: Recreate }, because a ReadWriteOnce PD binds to one pod and a
# rolling update would deadlock on the mount.
persistence:
  enabled: false
  storageClass: ""              # "" = cluster default; GKE PD single-writer = dynamic-rwo
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

# Container port the app listens on (also the Service targetPort).
service:
  type: ClusterIP
  port: 8080
  # Service port name; keep stable for NetworkPolicy / mesh.
  portName: http
  # Optional extra ports: [{ name: tritrpc, port: 9000 }]
  extraPorts: []

# Plain env (non-secret). Rendered into a ConfigMap and injected.
#
# OTLP telemetry pattern (documented, deliberately NOT forced on all services):
# the observability stack (deploy/argocd/observability-services.yaml) runs an
# OTel collector that fans out to Prometheus/Tempo/Loki. A service that emits
# OTLP opts in from its own deploy/values/<name>.yaml:
#   config:
#     OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
#     OTEL_SERVICE_NAME: "<name>"
# (gRPC callers use otel-collector.observability.svc.cluster.local:4317.)
config: {}
#   TRITRPC_LISTEN_ADDR: "tcp://0.0.0.0:9000"

# Secret env: name → existing Secret + key. The Secret is NOT created here
# (never commit secrets); reference one provisioned out of band / by SOPS.
secretEnv: {}
#   TRITRPC_KEY_HEX: { secretName: tritrpc-shared-key, key: TRITRPC_KEY_HEX, optional: true }

# Extra raw env entries passed straight through.
extraEnv: []

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: "1",  memory: 512Mi }

# Hardened by default — matches the estate's existing kustomize bases.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities: { drop: ["ALL"] }

# Writable scratch for readOnlyRootFilesystem services (mounted at /tmp).
tmpDir:
  enabled: true
  sizeLimit: 256Mi

# Extra writable emptyDir mounts for services that need to write outside /tmp under a
# read-only root filesystem (e.g. nginx needs /var/cache/nginx + /var/run). Per-service
# override in deploy/values/<name>.yaml. Empty by default.
writableDirs: []

probes:
  enabled: true
  path: /healthz
  # Set false for services with no HTTP health endpoint (e.g. raw TCP daemons).
  httpGet: true
  initialDelaySeconds: 5
  periodSeconds: 10

# Prometheus scraping (renders a ServiceMonitor for the observability stack's
# Prometheus — deploy/argocd/observability-services.yaml). Default OFF, and
# VERIFIED 2026-07-29 that it stays off for every current service: none exposes
# a native /metrics endpoint yet (hellgraph-service serves /healthz +
# /api/graph/*; compute-gateway serves /healthz + /v1/*). Enabling this for a
# service without a real endpoint points Prometheus at a 404 and fires
# TargetDown — flip it per-service in deploy/values/<name>.yaml only WHEN the
# endpoint exists. (Until then, telemetry flows through the OTLP pattern
# documented above `config`.)
metrics:
  enabled: false
  path: /metrics
  interval: 30s
  # Scrape port name; "" = the main service.portName (http).
  portName: ""

# Horizontal autoscaling. CPU-utilisation based, DELIBERATELY — not a custom/external
# metric. The estate has no HTTP request metric with emitters today (`metrics.enabled:
# false` chart-wide, above, overridden nowhere), so a request-rate or latency HPA would
# be an autoscaler wired to a series that does not exist: permanently `<unknown>`,
# permanently pinned at minReplicas, and green. CPU comes from metrics-server, which is
# on by default on GKE and already serves every HPA in this cluster.
#
# ⚠️ BEFORE YOU SET enabled: true — THE STATEFULNESS TEST.
# An HPA is only correct for a workload whose replicas are INTERCHANGEABLE. Ask what a
# second replica would split. Disqualifying, every time:
#   - a PVC, a SQLite file, or any local-disk write a later request must read back
#   - a module-level dict/list/set/counter that survives between requests and shapes
#     responses (ledgers, stores-of-record, session/grant/revocation tables)
#   - a background loop, poller, ticker or scheduler — two replicas do the work twice
#   - a single-writer cursor, checkpoint or sequence (the materializer/market-replay shape)
#   - any follow-up request that must land on the SAME process to succeed
# These fail SILENTLY: pods Ready, dashboards green, and the damage is a wrong answer
# served to whoever happened to hit the other replica. Services that fail this test
# carry an explicit `autoscaling: { enabled: false }` with the reason written beside it
# in deploy/values/<name>.yaml — that is the pattern; keep it.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  # Optional second Resource metric. Unset by default — see hpa.yaml on why heap-shaped
  # memory pins an autoscaler at maxReplicas.
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleUp:
      # 0 = act on the current recommendation (k8s' own scale-up default).
      stabilizationWindowSeconds: 0
      podsPerMinute: 2
    scaleDown:
      # 300s matches the k8s default, but is set EXPLICITLY so the anti-thrash window is
      # a decision on the record rather than an inherited value an API default could
      # move underneath us.
      stabilizationWindowSeconds: 300
      podsPerMinute: 1

# Voluntary-disruption budget. Rendered ONLY when the guaranteed replica floor is >= 2 —
# a PDB on a singleton wedges Autopilot node drains forever. Full reasoning in
# templates/pdb.yaml; the floor is computed by the `svc.replicaFloor` helper.
podDisruptionBudget:
  enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []          # [{ host: api.socioprophet.ai, paths: [{ path: /, pathType: Prefix }] }]
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}    # e.g. iam.gke.io/gcp-service-account for Workload Identity

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Legacy docker-link service env vars (<SVC>_PORT=tcp://…) — disable per-service to avoid collisions.
enableServiceLinks: true
