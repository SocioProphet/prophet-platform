{{- /*
Renders as a plain Deployment UNLESS this service has adopted the Argo Rollouts
canary pattern (rollout.enabled: true in its values file), in which case
rollout.yaml renders the equivalent workload as a `Rollout` instead — the two
are mutually exclusive so a service is never managed by both at once.
*/ -}}
{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "svc.fullname" . }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "svc.selectorLabels" . | nindent 6 }}
  template:
    {{- include "svc.podTemplateSpec" . | nindent 4 }}
{{- end }}
