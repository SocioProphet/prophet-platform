# Design Register v0 — every design concept as machine-checkable state.
# Doctrine: docs/METAPHOR_TO_MECHANISM_PROGRAM.md
# Status ladder: absent -> declared (spec merged) -> wired (callers>0, probe passes live)
#                -> measured (metric/bench number exists) -> sealed (number is receipted).
# RULE: nothing is described above its probe-verified status — in memory, retros, or to Gus.
# Schema note: formalize this file's shape in sourceos-spec as part of W6.0 (spec-first).

register:
  - id: effect-discipline
    source: concept-diagram-2026-07 (monads panel)
    mechanism: >-
      No monad library. Canon doc of the correspondence (receipts~Writer,
      entitlements~Reader, sessions~State) + FOUR enforced laws in
      tests/test_receipt_compositionality.py: warrant fold (weakest-link monoid),
      structural fold (composite embeds exactly its step receipts in DAG order),
      hash binding (inputs/outputs shas recompute), determinism (memo law).
    owner: prophet-platform/apps/compute-gateway
    status: wired   # laws written 2026-07-29, 4/4 pass; enforced every CI run by app-test-diagnostics
    probe: >-
      The law suite exists and the gateway test dir is CI-gated (enforcement =
      app-test-diagnostics runs the whole suite; this probe pins the wiring).
    # Copilot #1004/#1016: the prior probe_cmd was `grep -rq "compute-gateway"
    # .github/workflows/` — satisfied by ANY workflow that so much as mentions the
    # string (images.yml's Docker build, provision-secrets.yml, probe-contract.yml, ...),
    # none of which run the law suite. Deleting the actual test-running CI step would
    # have left this probe green. Now it greps the specific matrix entry that runs the
    # gateway's pytest suite and requires the pytest invocation to be right there.
    probe_cmd: >-
      test -f apps/compute-gateway/tests/test_receipt_compositionality.py
      && grep -A4 "name: compute-gateway" .github/workflows/validate-target-diagnostics.yml | grep -q "pytest -q tests"
    wave: W6.0

  - id: exhaust-accounting
    source: concept-diagram-2026-07 (thermodynamics panel)
    mechanism: >-
      ExhaustRecord on every compute/compaction (counts + hashes of discarded
      context); Receipt gains optional exhaust_sha/bytes_in/bytes_out; v1 entropy =
      compression ratio. Exhaust->intake loop: trace-dream job mines
      discarded-but-later-needed to tune retrieval + SRS.
    owner: agent-machine + compute-gateway (+ sourceos-spec fields)
    status: wired
    # declared 2026-07-29: ExhaustRecord schema MERGED (sourceos-spec #208); gateway emission
    # code-complete + tested (bytes on every receipt; _exhaust bound via content-addressed
    # exhaust_sha; pre-W6.1 persisted receipts still verify — fields ride outside the id-hash).
    # wired 2026-07-29: gateway image rolled AND live-probed in prod — a real /v1/compute
    # call on pod compute-gateway-68b88fdc69 returned bytes_in=2 bytes_out=89. The
    # probe_cmd below is the CI-runnable half (CI has no cluster access); the live probe
    # is re-run by hand on each roll.
    # 2026-07-29 LOOP CLOSED (Noetica#569): lib/exhaust.ts records rejected retrieval
    # candidates by hash only (EX-I2 negative-tested), notes what WAS used, and mines the two
    # into DISCARD MISSES (discarded at T, needed after T) ranked by repeats — the retrieval
    # cut's own error signal. Wired at a real cut (tieredGround) + GET /api/exhaust reporting
    # compressionRatio and discardMissRate. Fail-soft: observability cannot fail a retrieval.
    # `measured` still needs: a real discardMissRate/compression number observed from live
    # traffic + surfacing on the Govern Proof act.
    probe: "sample /v1/compute receipt carries exhaust_sha and bytes_in/bytes_out"
    probe_cmd: >-
      test -f apps/compute-gateway/tests/test_exhaust_accounting.py
      && grep -q exhaust_sha apps/compute-gateway/src/compute_gateway/contract.py
      && grep -q canonical_size apps/compute-gateway/src/compute_gateway/receipts.py
    wave: W6.1

  - id: banded-memory
    source: concept-diagram-2026-07 (Fourier memory panel)
    mechanism: >-
      v1 multi-timescale bands L0 session -> L1 daily -> L2 weekly -> L3 permanent
      with promotion/decay, over agent-memory isolation routing + SRS. Literal
      spectral compression via the FNO operator sidecar = research gate, bench-arm only.
    owner: Noetica/agent-machine (memory), noetica-operator (research arm)
    status: declared
    # declared 2026-07-29 (Noetica#567): memory-bands.ts — four bands with survival windows +
    # reinforcement thresholds; promote on proven need, demote (never destroy) on silence, prune
    # only a session memory nothing ever recalled, pins exempt, every verdict carries its reason.
    # Wired as autoDream Phase 4b (absent = unchanged legacy path) + recallTopicBanded makes the
    # READ path feed survival + GET /api/memory/bands (?sweep=1 = dry run). 12 tests.
    # NOT `wired`: not in a shipped release, live probe not yet run.
    # The literal-Fourier spectral arm remains research-gated behind a bench win.
    probe: "memory API reports per-band counts; a promotion event is observable"
    wave: W6.2

  - id: deliberation-value-controller
    source: concept-diagram-2026-07 (L-function / planning-value panels)
    mechanism: >-
      DeliberationController estimating P(correct|features) from harness signals
      (sample agreement, operator-fire, retrieval-gate scores), calibrated on the
      owned 686-board transcripts; stop/escalate on marginal
      expected-accuracy-per-token. Extends escalate-only-on-disagreement.
      L-function functional form = Heller-Winters-lane research gate.
    owner: Noetica/agent-machine (bench arm first, server routing second)
    status: declared
    # declared 2026-07-29 (Noetica#568): logistic P(correct|signals), no deps, calibrated on
    # 376 OWNED labelled rows (250/126 split, ECE 8.9%) at zero token cost. Honesty instruments:
    # reliability()/ECE expose overconfidence, sparse features dropped, no-signal falls back to
    # base rate, evaluatePolicy STATES its escalation-recovery assumption.
    # 🔴 CALIBRATION FOUND A REAL FLAW: model never predicts >0.8, so the absolute default
    # stopAbove=0.9 fired NEVER (0 stops, 83.3% escalation, 4.33x spend). Fixed via
    # suggestPolicy (thresholds derived from the model's own distribution under a spend
    # budget): 39.7% escalation, 2.59x spend, 16 stops. Weights: gate_conf .322,
    # gate_reliability .268, gate_agree .250; brain_conf ~0; vote_share too sparse.
    # NOT `measured`: projected accuracy rests on a STATED assumption — a live board
    # emitting real cost-per-point is what replaces it (needs token budget).
    probe: "board run emits cost-per-point for the controller arm"
    wave: W6.3

  - id: declared-organs
    source: concept-diagram-2026-07 (organogenesis panels) + twin program (organs design-only)
    mechanism: >-
      v1 Organ{kind, members, capabilities, health} as a sourceos-spec type over
      EXISTING services (memory-mesh, zone/model-router, ingest/ie-engine,
      capability membrane), served from the federation plane + Govern Posture card.
      v2 membership dynamics via admit/writer-key machinery. v3 differentiation =
      research gate.
    owner: hellgraph-service federation + agentplane + client-vue (card)
    status: wired
    # declared→wired 2026-08-03: spec Organ.json MERGED (sourceos-spec#211) with OR-I1 (never
    # invents a member; undeterminable health = `unknown`, never optimistically healthy) + OR-I2
    # (organ health DERIVED from members; an unknown member blocks a healthy verdict).
    # Implementation merged (prophet-platform#1021) AND in the deployed image: organs.ts declares
    # four organs over REAL services (memory-mesh/hellgraph, zone-router/compute-gateway, ie-engine/
    # entity-resolution/embeddings, identity-policy/evidence-receipts); prober distinguishes
    # non-2xx (down) from unreachable (unknown); endpoints env-overridable for edge/air-gapped
    # topologies; GET /api/organs is a gated route (auth.test.ts). 13 tests. CI has no cluster
    # access, so probe_cmd is the static wiring proxy (organs.ts + /api/organs + health fold
    # present); the LIVE GET /api/organs probe (>0 organs with member health) is re-run by hand
    # and is what would carry this to `measured`.
    # v2 membership dynamics + v3 differentiation deliberately out of scope until v1 proves out.
    probe: "static: organs.ts + /api/organs + health fold present; live: GET /api/organs returns >0 organs with member health"
    probe_cmd: >-
      test -f apps/hellgraph-service/src/organs.ts
      && grep -rq "/api/organs" apps/hellgraph-service/src/
      && grep -q "health" apps/hellgraph-service/src/organs.ts
    wave: W6.4

  # ── Pre-existing convictions imported so the register is honest from birth ──
  - id: l5-governance-lifecycle
    source: blueprint audit 2026-07 ("libraries nobody calls")
    mechanism: >-
      The engine lifecycle FSM + Governor + object store are invoked on the governed
      path by apps/lifecycle-warden, which runs dueTransitions → runRetention → gc every
      WARDEN_INTERVAL_SECONDS and seals each pass on THE receipt spine via compute-gateway
      kind=governance (adapters._governance). No longer a library with zero callers.
    owner: prophet-platform
    status: wired
    # declared→wired 2026-07-29 on LIVE PROBE (not inference): deployment lifecycle-warden
    # 1/1 in ns socioprophet; GET /healthz 200; GET /v1/audit/head seq 59; and 44 kind=governance
    # receipts on the gateway chain (/data/gateway.db) — the warden IS the caller and the
    # evidence is on the spine. CI has no cluster access, so probe_cmd below is the static
    # wiring proxy; the runtime probe is re-run by hand on each roll.
    # 🔴 CANNOT reach `measured` until objects_scanned > 0: the warden governs an EMPTY set
    # (POST /v1/objects had no caller — issue #1048). PR #1054 adds the enrolment producer +
    # Sovereign Retention Doctrine; the first LIVE enrolment is a deliberate bounded write to
    # the append-only prod chain, held for go-ahead. Until then: it runs, it is receipted, it
    # governs nothing — do not describe above `wired`.
    probe: "warden is the live caller: healthz 200 + 44 kind=governance receipts on the spine"
    probe_cmd: >-
      grep -q "_governance" apps/compute-gateway/src/compute_gateway/adapters.py
      && grep -q '"governance"' apps/compute-gateway/src/compute_gateway/registry.py
      && test -f deploy/values/lifecycle-warden.yaml
      && grep -rq "lifecycle-warden" deploy/argocd/
    wave: unassigned

  - id: swarm-holography-gate
    source: agentic-swarm-holography-fabric design (3-layer gate, INV-22..26)
    mechanism: >-
      libs/python/holography-gate: a disclosure gate any swarm agent calls to project a
      subject's fields. L1 legality (hard prohibitions never dilate; soft budgets dilate
      with trust) ∧ L2 Ω-readiness, per field. INV-26 Holographic Completeness: the
      projection domain is ALWAYS the full field set — a denied field carries a structured
      Denial(reason, policy_ref, class), never ⊥, so a refusal shows the shape of what was
      withheld (hologram, not a cropped photograph). Denial class distinguishes polytope
      (architecturally illegal, unearnable) from omega (earnable by advancing readiness).
    owner: prophet-mesh / agentplane
    status: wired
    # absent→wired 2026-08-03: gate implemented + 9 invariant tests (INV-26 completeness,
    # hard-facet non-dilation at max trust, soft-budget dilation, permit-monotonicity =
    # I(T;π_S(T)) non-decreasing, omega-earnability). First caller +
    # observable decision = tools/smoke_swarm_holography_gate.py (the register's own probe,
    # literally "gate decision observable on a sample swarm dispatch"): name/email disclosed,
    # HEALTH∧ADS hard-denied unearnably, location soft-denied at trust 0.6. Next toward
    # `measured`: embed in a production swarm-runtime dispatch + count real gate decisions.
    probe: "gate decision observable on a sample swarm dispatch"
    probe_cmd: >-
      test -f libs/python/holography-gate/src/holography_gate/__init__.py
      && python3 tools/smoke_swarm_holography_gate.py
    wave: unassigned

  - id: sovereign-config-plane
    source: peer-artifact audit 2026-07-29 (~/.claude.json — Anthropic's client state file)
    mechanism: >-
      The sovereign equivalent of Claude Code's remote-config machinery, over EXISTING
      estate planes: (a) flags/kill-switches served from prophet-platform admin API and
      cached client-side WITH timestamps (every cache entry stamped, scoped per
      app+model+org — the clientDataCacheSlots pattern); (b) per-feature and per-MODEL
      off-switches (their tengu-off-switch / tengu-fable-off-switch pattern — our
      :latest/IfNotPresent rollout trap is exactly what this kills); (c) a
      migrationVersion for ~/.noetica local state with explicit one-time migrations;
      (d) a local usage ledger (their pluginUsage/skillUsage) feeding SRS and
      personalization — receipts already exist, but counters-for-adaptation do not.
      NO third-party flag SaaS (no GrowthBook) — the flag plane is ours.
    owner: Noetica/agent-machine (client cache + migrations) + prophet-platform admin API (flag service)
    status: wired
    # declared→wired 2026-08-03: BOTH halves are merged (the earlier note claiming the
    # SERVER half was "unbuilt" was stale — #1029 built it). SERVER half: compute-gateway
    # serves /v1/config (read, default scope open, org/model token-gated), /v1/config/set
    # (sealed BEFORE write — a change that can't be receipted must not take effect), and
    # /v1/config/history; config_plane.py has set_flag/get_snapshot/history. CLIENT half
    # (Noetica#564): config-plane.ts precedence local-override>env>remote>default, explain()
    # names the decider, capability-surface guard, offline-first refresh; local-state.ts
    # migrationVersion + once-only migrations + usage ledger; 13 tests. CI has no cluster
    # access, so probe_cmd is the static wiring proxy; the LIVE kill-switch probe — flip a
    # capability off without a release and observe it take effect — is re-run by hand and is
    # what would carry this to `measured`. (Open: config-plane `app` selector ungated — #1102.)
    probe: "static: /v1/config{,/set,/history} + config_plane.set_flag present; live: a kill-switch flips a capability without a release"
    probe_cmd: >-
      grep -q "/v1/config" apps/compute-gateway/src/compute_gateway/server.py
      && test -f apps/compute-gateway/src/compute_gateway/config_plane.py
      && grep -q "def set_flag" apps/compute-gateway/src/compute_gateway/config_plane.py
    wave: unassigned
